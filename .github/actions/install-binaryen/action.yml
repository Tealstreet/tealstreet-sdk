name: Install pinned Binaryen
description: Restore a checksum-verified Binaryen archive before a bounded cold download
runs:
  using: composite
  steps:
    - name: Restore pinned Binaryen archive
      uses: actions/cache@v6
      with:
        path: ${{ runner.tool_cache }}/binaryen-archives
        key: binaryen-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdk-rs/harness/install-binaryen.sh') }}
    - name: Verify and install pinned Binaryen
      shell: bash
      run: bash sdk-rs/harness/install-binaryen.sh
