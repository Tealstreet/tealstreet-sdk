name: Install locked Yarn dependencies
description: Retry only dependency network failures and save a successful cache immediately
inputs:
  cache-dir:
    description: Dependency cache directory from prepare-yarn
    required: true
  cache-key:
    description: Exact cache key from prepare-yarn (empty if the cache service is unavailable)
    required: false
  cache-hit:
    description: Exact cache hit from prepare-yarn
    required: false
runs:
  using: composite
  steps:
    - name: Install with bounded network-only retries
      shell: bash
      run: corepack yarn -s node "$GITHUB_ACTION_PATH/install.cjs"
    - name: Save successful Yarn dependency cache
      if: inputs.cache-hit != 'true' && inputs.cache-key != ''
      uses: actions/cache/save@v6
      with:
        path: ${{ inputs.cache-dir }}
        key: ${{ inputs.cache-key }}
