# Mirror CI for tealstreet-sdk. Source-of-truth lives in the monorepo at
# mirrors/tealstreet-sdk/.github/workflows/ — contributors cannot edit it here
# (CODEOWNERS + branch protection). Read-only token, no secrets, no release.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch: # manual re-run (e.g. validation after a sync)

# Read-only GITHUB_TOKEN — this CI can never push, tag, or release.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile --network-timeout 600000
      - run: yarn check:licenses
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test

  # The Rust port, on FREE minutes. This repo is public, so these four checks
  # cost nothing here — in the monorepo the same jobs sit on five shared
  # self-hosted runner slots. That is the whole reason sdk-rs is in this slice:
  # see docs/plans/PUBLIC_MIRROR_CI_v1.md in the monorepo.
  #
  # `sdk-rs/` is a self-contained Cargo workspace: its Cargo.toml, Cargo.lock
  # and rust-toolchain.toml are all inside it and all mirrored, so nothing here
  # reaches outside the slice. The Node-dependent parity and venue oracles are
  # `#[ignore]`d by default and are NOT run here — they need an isolated
  # TypeScript install and `node_modules`, which belongs with the monorepo's own
  # parity job.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdk-rs
    env:
      # Same policy the workspace lint table sets, stated here so a local
      # `cargo clippy` and this job cannot disagree.
      RUSTFLAGS: -Dwarnings
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      # NO third-party action here, and that is load-bearing rather than taste.
      # This repo's Actions policy is `selected` with `github_owned_allowed:
      # true`, `verified_allowed: false` and an EMPTY pattern list, so anything
      # outside `actions/*` makes the whole RUN fail at startup - taking the
      # `ci` and `secret-scan` jobs down with it, since a startup failure is per
      # run and not per job. `dtolnay/rust-toolchain@stable` did exactly that on
      # 2026-10-16: three consecutive exports produced `startup_failure` and the
      # mirror ran nothing at all for seven hours, including the suites this
      # monorepo has stopped running itself.
      #
      # `ubuntu-latest` ships rustup and cargo, and `rustup show` in a directory
      # carrying rust-toolchain.toml installs the pinned toolchain and its
      # components, so the action was never doing anything the image cannot.
      - name: Load workspace toolchain
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sdk-rs/target
          key: ${{ runner.os }}-cargo-sdk-rs-${{ hashFiles('sdk-rs/**/Cargo.toml', 'sdk-rs/Cargo.lock', 'sdk-rs/rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-sdk-rs-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo build --workspace --locked
      # NO `cargo test` here, and not an oversight. Measured three ways on
      # 2026-10-14 with `cargo test --workspace --locked --no-fail-fast`:
      #
      #   no node_modules, no compiler exported ......... 164 targets fail
      #   + node_modules + SAFE_CEX_TYPESCRIPT_PATH ........  9 targets fail
      #   + SAFE_CEX_WORKER_LODASH_PATH + _CRYPTO_ORACLE_DEPS  8 targets fail
      #
      # So the suite is NOT hermetic (sdk-rs guidance says it is), and 155 of
      # those 164 were only missing dependencies this mirror already installs
      # in the `ci` job above. 3383 tests pass once they are there.
      #
      # Turning it on is the four lines below. It is left off because the
      # remaining 8 targets fail for substantive, lane-owned reasons - among
      # them safe-cex-exchange's cancellation gate, which is red in the
      # monorepo too - and a public mirror showing red CI is worse than a
      # mirror that has not claimed the check yet. Flip it when those clear.
      #
      #   - uses: actions/setup-node@v4
      #     with: { node-version: 22, cache: yarn }
      #   - run: yarn install --frozen-lockfile --network-timeout 600000
      #     working-directory: .
      #   - run: cargo test --workspace --locked
      #     env:
      #       SAFE_CEX_TYPESCRIPT_PATH: ${{ github.workspace }}/node_modules/typescript
      #       SAFE_CEX_WORKER_LODASH_PATH: ${{ github.workspace }}/node_modules/lodash
      #       SAFE_CEX_CRYPTO_ORACLE_DEPS: ${{ github.workspace }}/node_modules

  # Open source (MIT): scan every new commit for secrets. Known test fixtures
  # predate this gate, so only the pushed or proposed range is scanned.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitleaks*
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - name: Scan new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ "$EVENT" = "push" ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            range="origin/master..${PUSH_AFTER:-HEAD}"
          fi
          echo "Scanning ${range}"
          ./gitleaks git --no-banner --redact --exit-code 1 --log-opts="${range}" .
