# Mirror CI for tealstreet-sdk. Source-of-truth lives in the monorepo at
# mirrors/tealstreet-sdk/.github/workflows/ — contributors cannot edit it here
# (CODEOWNERS + branch protection). Read-only token, no secrets, no release.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch: # manual re-run (e.g. validation after a sync)

# Read-only GITHUB_TOKEN — this CI can never push, tag, or release.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/prepare-yarn
        id: yarn
      - uses: ./.github/actions/install-yarn
        with:
          cache-dir: ${{ steps.yarn.outputs.cache-dir }}
          cache-key: ${{ steps.yarn.outputs.cache-key }}
          cache-hit: ${{ steps.yarn.outputs.cache-hit }}
      - run: corepack yarn -s node --test .github/tests/*.test.cjs
      - run: corepack yarn check:licenses
      - run: corepack yarn typecheck
      - run: corepack yarn lint
      - run: corepack yarn test


  # Open source (MIT): scan every new commit for secrets. Known test fixtures
  # predate this gate, so only the pushed or proposed range is scanned.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitleaks*
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - name: Scan new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ "$EVENT" = "push" ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          elif [ "$EVENT" = "push" ]; then
            range="origin/master..${PUSH_AFTER:-HEAD}"
            if git show-ref --verify --quiet refs/remotes/origin/feat/rust-rewrite; then
              # Landing history is the baseline for branches descended from it.
              # The common ancestor preserves unique commits on older branches.
              if landing_base="$(git merge-base origin/feat/rust-rewrite "${PUSH_AFTER:-HEAD}")"; then
                landing_only="$(git rev-list -1 "$landing_base" --not origin/master)"
                if [ -n "$landing_only" ]; then
                  range="${landing_base}..${PUSH_AFTER:-HEAD}"
                fi
              else
                merge_base_status=$?
                if [ "$merge_base_status" -ne 1 ]; then exit "$merge_base_status"; fi
              fi
            else
              landing_ref_status=$?
              if [ "$landing_ref_status" -ne 1 ]; then exit "$landing_ref_status"; fi
            fi
          else
            range="origin/master..${PUSH_AFTER:-HEAD}"
          fi
          echo "Scanning ${range}"
          ./gitleaks git --no-banner --redact --exit-code 1 --log-opts="${range}" .
