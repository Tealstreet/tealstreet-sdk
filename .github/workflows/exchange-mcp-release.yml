# Publishes @tealstreet/exchange-mcp to npm. Source of truth is the monorepo
# (mirrors/tealstreet-sdk/.github/); Copybara carries it here. Authenticates by
# npm trusted publishing (OIDC), so there is no token secret, and npm attaches
# provenance because this repo is public. Release steps:
# packages/exchange-mcp/CLAUDE.md.
#
# Release from the Actions tab: "exchange-mcp release" → Run workflow → patch,
# minor or major. The next version is npm's `latest` bumped by that much. It is
# stamped into package.json for this build only, and the version tag is pushed
# after a successful publish. Nothing is committed: master is protected, and a
# committed bump would also have to round-trip through Copybara.
name: exchange-mcp release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump from the latest version on npm
        type: choice
        options: [patch, minor, major]
        default: patch
  push:
    tags:
      - 'exchange-mcp-v*'

concurrency:
  group: exchange-mcp-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PACKAGE_DIR: packages/exchange-mcp
  PACKAGE_NAME: '@tealstreet/exchange-mcp'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version tag after a dispatched release
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # No `registry-url`: it writes an .npmrc expecting NODE_AUTH_TOKEN, which
      # nothing sets; the publish authenticates by OIDC. check-latest because
      # trusted publishing needs Node >= 22.14.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
      - uses: ./.github/actions/prepare-yarn
        id: yarn

      - name: Use npm with trusted publishing support
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Resolve the release version
        id: meta
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#exchange-mcp-v}"
          else
            LATEST="$(npm view "$PACKAGE_NAME" dist-tags.latest --registry https://registry.npmjs.org)"
            VERSION="$(node -e '
              const [major, minor, patch] = process.argv[1].split(".").map(Number);
              const next = { major: [major + 1, 0, 0], minor: [major, minor + 1, 0], patch: [major, minor, patch + 1] }[process.argv[2]];
              console.log(next.join("."));
            ' "$LATEST" "$BUMP")"
            echo "npm latest is ${LATEST}; releasing ${VERSION} (${BUMP})"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must be X.Y.Z, got ${VERSION}" >&2
            exit 1
          fi
          if npm view "${PACKAGE_NAME}@${VERSION}" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${VERSION} is already on npm" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/exchange-mcp-v${VERSION}" >/dev/null && [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "tag exchange-mcp-v${VERSION} already exists but ${VERSION} is not on npm; publish it by re-running that tag" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # The bundle reads its MCP serverInfo version from package.json at build time.
      - name: Stamp the version into package.json
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const file = process.env.PACKAGE_DIR + "/package.json";
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            manifest.version = process.env.VERSION;
            fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + "\n");
          '

      - uses: ./.github/actions/install-yarn
        with:
          cache-dir: ${{ steps.yarn.outputs.cache-dir }}
          cache-key: ${{ steps.yarn.outputs.cache-key }}
          cache-hit: ${{ steps.yarn.outputs.cache-hit }}

      - name: Typecheck
        run: corepack yarn --cwd "$PACKAGE_DIR" typecheck

      - name: Test
        run: corepack yarn --cwd "$PACKAGE_DIR" test-ci

      - name: Install pinned binaryen (wasm-opt)
        run: bash sdk-rs/harness/install-binaryen.sh

      - name: Build the Rust engine included in the package
        env:
          SAFE_CEX_WASM_OPT: required
        run: |
          (cd sdk-rs && rustup show)
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          corepack yarn -s rust:build-wasm

      # Also writes dist/THIRD_PARTY_LICENSES.md, and fails on a bundled
      # dependency whose licence is not allowed.
      - name: Build
        run: corepack yarn --cwd "$PACKAGE_DIR" build

      # Boots dist/index.js over stdio, then loads the Poseidon WASM that
      # Lighter signs through from the same dist/ directory.
      - name: Smoke-test the bundle
        run: corepack yarn --cwd "$PACKAGE_DIR" smoke

      # The bundle is self-contained: a runtime dependency on an unpublished
      # @tealstreet/* workspace is what broke `npm install -g @tealstreet/cli`.
      - name: Verify the npm package contents
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          set -euo pipefail
          npm pack --dry-run --json --registry https://registry.npmjs.org > npm-pack.json
          node - <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('npm-pack.json', 'utf8');
          const jsonStart = raw.lastIndexOf('\n[');
          const pack = JSON.parse(jsonStart >= 0 ? raw.slice(jsonStart + 1) : raw)[0];
          const files = pack.files.map((file) => file.path).sort();
          const expected = [
            'LICENSE',
            'README.md',
            'dist/THIRD_PARTY_LICENSES.md',
            'dist/index.js',
            'dist/wasm/poseidon_crypto.wasm',
            'dist/wasm/rust/safe_cex_wasm.cjs',
            'dist/wasm/rust/safe_cex_wasm_bg.wasm',
            'package.json',
          ];
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const problems = [];
          if (JSON.stringify(files) !== JSON.stringify(expected)) {
            problems.push(`files ${JSON.stringify(files)} != ${JSON.stringify(expected)}`);
          }
          for (const field of ['dependencies', 'peerDependencies', 'optionalDependencies']) {
            if (manifest[field] && Object.keys(manifest[field]).length) problems.push(`package.json has ${field}`);
          }
          if (!fs.readFileSync('dist/index.js', 'utf8').startsWith('#!/usr/bin/env node')) {
            problems.push('dist/index.js has no node shebang');
          }
          if (manifest.repository?.url !== `git+https://github.com/${process.env.GITHUB_REPOSITORY}.git`) {
            problems.push(`repository.url ${manifest.repository?.url} is not this repo; npm rejects the trusted publish`);
          }
          if (pack.version !== process.env.VERSION) problems.push(`packed ${pack.version}, expected ${process.env.VERSION}`);
          if (problems.length) {
            console.error(problems.map((p) => `- ${p}`).join('\n'));
            process.exit(1);
          }
          console.log(`npm package: ${pack.name}@${pack.version}, ${files.length} files, ${pack.size} bytes packed`);
          NODE
          rm npm-pack.json
        env:
          VERSION: ${{ steps.meta.outputs.version }}

      - name: Publish npm package
        working-directory: ${{ env.PACKAGE_DIR }}
        run: npm publish --access public --provenance --registry https://registry.npmjs.org

      # Pushed with GITHUB_TOKEN, so it does not trigger this workflow again.
      - name: Tag the release
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          git tag "exchange-mcp-v${VERSION}" "$GITHUB_SHA"
          git push origin "refs/tags/exchange-mcp-v${VERSION}"
          echo "### Released ${PACKAGE_NAME}@${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "https://www.npmjs.com/package/${PACKAGE_NAME}/v/${VERSION}" >> "$GITHUB_STEP_SUMMARY"
