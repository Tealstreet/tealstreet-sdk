# Rust engine CI. Requirements live in docs/plans/RUST_REWRITE.md.
#
# Keep every step GitHub-owned: this repo's Actions policy allows only
# GitHub-owned actions, so one foreign action fails the whole run at startup.
name: Rust SDK

on:
  workflow_dispatch:
    inputs:
      replay_artifact:
        description: Engine layout for the complete strict replay matrix
        type: choice
        options: [family, combined]
        default: family
      mutation_barrier_size:
        description: Compare standalone Bybit barrier capability off/on on this exact checkout
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - 'sdk-rs/**'
      - 'package.json'
      - 'yarn.lock'
      - 'tsconfig*.json'
      - 'thirdparty/**'
      - '.cargo/**'
      - 'rust-toolchain*'
      - 'packages/**'
      - 'apps/cli/**'
      - '.github/workflows/rust.yml'
      - '.github/actions/prepare-yarn/**'
      - '.github/actions/prefetch-cargo/**'
      - '.github/actions/install-yarn/**'
      - '.github/actions/install-binaryen/**'
  # Unfiltered so "Rust / required coverage" always reports for branch protection;
  # the scope job applies the push path list and skips coverage outside it.
  pull_request:
    branches: [master]

permissions:
  contents: read
  actions: read
  pull-requests: read

# Every master push gets its own complete run: one group per sha. A shared
# group keeps only one pending run, so a merge rush cancelled every commit
# between the running and the newest one. PR pushes cancel stale runs.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('rust-pr-{0}', github.ref) || format('rust-{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No global RUSTFLAGS: it would replace sdk-rs/.cargo/config.toml's flags,
# including the wasm stack size. Warnings are denied per command instead.
env:
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 4
  # libgit2 has dropped git-dependency fetches on transient TLS errors; the git CLI
  # plus cargo's own retries ride those out.
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  CARGO_NET_RETRY: '10'

defaults:
  run:
    working-directory: sdk-rs

jobs:
  scope:
    name: Rust / scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply the Rust path scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node sdk-rs/harness/ci-scope.mjs

  selection:
    needs: scope
    if: needs.scope.outputs.relevant == 'true'
    name: Rust / affected coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.select.outputs.full }}
      checkoutSha: ${{ steps.select.outputs.checkoutSha }}
      nativeFull: ${{ steps.select.outputs.nativeFull }}
      combinedRequired: ${{ steps.select.outputs.combinedRequired }}
      integrationTests: ${{ steps.select.outputs.integrationTests }}
      nativeCrates: ${{ steps.select.outputs.nativeCrates }}
      replay: ${{ steps.select.outputs.replay }}
      families: ${{ steps.select.outputs.families }}
      replayRequired: ${{ steps.select.outputs.replayRequired }}
      sizeRequired: ${{ steps.select.outputs.sizeRequired }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select coverage from the actual checkout composition
        id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node sdk-rs/harness/ci-selection.mjs


  harness:
    needs: selection
    name: Rust / replay harness tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/prepare-yarn
        id: yarn
      - uses: ./.github/actions/install-yarn
        with:
          cache-dir: ${{ steps.yarn.outputs.cache-dir }}
          cache-key: ${{ steps.yarn.outputs.cache-key }}
          cache-hit: ${{ steps.yarn.outputs.cache-hit }}
      - run: corepack yarn rust:test-harness


  bans:
    needs: selection
    name: Rust / banned patterns
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The shrink-only request provenance ratchet verifies immutable base
          # and parent manifests, never a caller-supplied enlarged inventory.
          fetch-depth: 0
      - name: Reject JavaScript emulation and deleted-port dependencies
        run: ./scripts/check-bans.sh


  native:
    needs: selection
    name: Rust / native ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: fmt
            command: cargo fmt --all --check
          - check: clippy
            command: cargo clippy --locked --workspace --exclude safe-cex-candle-cache --exclude safe-cex-num --exclude safe-cex-types --all-targets -- -D warnings && cargo clippy --locked -p safe-cex-crypto --all-targets --features ed25519,es256,secp256k1,stark,schnorr,hmac-sha512 -- -D warnings
          - check: test
            # Workspace builds unify crypto features; prove disabled and enabled provider arms.
            command: 'RUSTFLAGS=-Dwarnings cargo test --locked --workspace --exclude safe-cex-candle-cache --exclude safe-cex-num --exclude safe-cex-types && RUSTFLAGS=-Dwarnings cargo test --locked -p safe-cex-crypto --lib signer:: && RUSTFLAGS=-Dwarnings cargo test --locked -p safe-cex-crypto --features ed25519,es256,secp256k1,stark,schnorr,hmac-sha512 --lib signer::'
          # Workspace resolution unifies family features. Exercise each
          # standalone engine closure, including both Plan configurations.
          - check: engine-feature-modes
            timeout: 90
            command: python3 scripts/test-http-plan-feature-modes.py
          # The restored master candle-cache crates (mono candle-server image) build
          # alone, with master's serde_json features, never unified into the port.
          - check: candle-cache
            command: |
              cargo build --locked -p safe-cex-candle-cache --bin candle-cache-owner
              cargo clippy --locked -p safe-cex-candle-cache -p safe-cex-num -p safe-cex-types --lib --bins -- -D warnings
              # The fix_audit and monthly_behavior targets and two lib tests load the TypeScript
              # compiler over TS venue sources, which the Rust-only bundle deletes.
              cargo test --locked -p safe-cex-candle-cache --lib --bins --test backend_api --test divergence_audit --test field_identity --test numeric_ingress --test owner_lifecycle --test p4_calendar --test runtime_backends -- --skip tests::cleaning_2000_nan_permutations_match_actual_source_order --skip tests::cleaning_source_nan_permutations_keep_first_duplicates
              cargo test --locked -p safe-cex-num --lib
              # This audit reads source of a crate the port deleted.
              cargo test --locked -p safe-cex-types --lib -- --skip position_record::tests::serde_accepted_spelling_inventory_matches_source
              python3 scripts/check-serde-json-features.py
          - check: mutation-barriers
            command: |
              cargo clippy --locked -p safe-cex-engine --all-targets --no-default-features --features http-mutation-barriers,test-support,order-locks,managed-sockets -- -D warnings
              RUSTFLAGS=-Dwarnings cargo test --locked -p safe-cex-engine --no-default-features --features http-mutation-barriers,test-support,order-locks,managed-sockets --test plan_mutation_prepare_barrier --test multi_constraint_pacing
              RUSTFLAGS=-Dwarnings cargo test --locked -p safe-cex-engine --no-default-features --features http-plans,test-support --lib disabled_barrier_refusal
              cargo clippy --locked -p safe-cex-native --no-default-features --features http-mutation-barriers --all-targets -- -D warnings
              RUSTFLAGS=-Dwarnings cargo test --locked -p safe-cex-native --no-default-features --features http-mutation-barriers --lib managed_http
              CARGO_TARGET_DIR=target cargo test --locked --manifest-path hosts/native/tests/barrier-feature-unification/Cargo.toml
              CARGO_TARGET_DIR=target cargo test --locked --manifest-path hosts/native/tests/barrier-feature-unification/Cargo.toml --features host-barriers
              node --test hosts/wasm/js/hostmanagedhttp.test.mjs hosts/wasm/js/hostmanagedhttp-group.test.mjs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sdk-rs/target
          key: ${{ runner.os }}-cargo-${{ matrix.check }}-${{ hashFiles('sdk-rs/Cargo.lock', 'sdk-rs/rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.check }}-
      - name: Install pinned toolchain
        run: rustup show
      - uses: ./.github/actions/prefetch-cargo
      - uses: actions/setup-node@v4
        if: matrix.check == 'engine-feature-modes' || matrix.check == 'mutation-barriers'
        with:
          node-version: 22
      - name: Run ${{ matrix.check }}
        run: ${{ matrix.command }}


  wasm:
    name: Rust / wasm32
    needs: selection
    if: needs.selection.outputs.nativeFull == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sdk-rs/target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('sdk-rs/Cargo.lock', 'sdk-rs/rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-
      - name: Install pinned toolchain
        run: rustup show
      - uses: ./.github/actions/prefetch-cargo
      - name: Build every crate for wasm32
        run: cargo build --locked --workspace --exclude safe-cex-candle-cache --exclude safe-cex-num --exclude safe-cex-types --exclude safe-cex-candle-server --exclude safe-cex-exchange-server --exclude safe-cex-remote-signer --target wasm32-unknown-unknown
      - name: Lint every crate for wasm32
        run: cargo clippy --locked --workspace --exclude safe-cex-candle-cache --exclude safe-cex-num --exclude safe-cex-types --exclude safe-cex-candle-server --exclude safe-cex-exchange-server --exclude safe-cex-remote-signer --target wasm32-unknown-unknown -- -D warnings
      - name: Lint explicit WASM Mutation-barrier host support
        run: cargo clippy --locked -p safe-cex-wasm --no-default-features --features bitunix,http-mutation-barriers --target wasm32-unknown-unknown -- -D warnings


  mutation-barrier-size:
    needs: selection
    name: Rust / Bybit Mutation-barrier size comparison
    if: github.event_name == 'workflow_dispatch' && inputs.mutation_barrier_size
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUST_CHECKOUT_SHA: ${{ needs.selection.outputs.checkoutSha }}
      WASM_BINDGEN_VERSION: 0.2.129
      SAFE_CEX_WASM_OPT: required
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            sdk-rs/target
          key: ${{ runner.os }}-cargo-barrier-size-${{ hashFiles('sdk-rs/Cargo.lock', 'sdk-rs/rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-gate-
      - name: Install pinned toolchain and wasm-bindgen
        run: |
          (cd sdk-rs && rustup show)
          if ! wasm-bindgen --version 2>/dev/null | grep -q "$WASM_BINDGEN_VERSION"; then
            cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked --force
          fi
      - uses: ./.github/actions/prefetch-cargo
      - uses: ./.github/actions/install-binaryen
      - name: Build and measure both capabilities from this checkout
        run: |
          for mode in off on; do
            args=(--venue bybit)
            if [[ $mode == on ]]; then args+=(--mutation-barriers); fi
            bash sdk-rs/harness/build.sh "${args[@]}"
            MODE=$mode node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { createRequire } from 'node:module';
          import { copyFileSync, mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { wasmBudgetBytes, wasmBudgetError } from './sdk-rs/harness/wasm-budget.mjs';
          const mode = process.env.MODE;
          const { WasmEngine } = createRequire(import.meta.url)('./sdk-rs/hosts/wasm/pkg/node/safe_cex_wasm.js');
          for (const method of ['httpGroupPending', 'httpClaimGroup']) {
            if ((typeof WasmEngine.prototype[method] === 'function') !== (mode === 'on')) throw new Error(`unexpected ${mode} export: ${method}`);
          }
          const out = `sdk-rs/harness/out/barrier-size/${mode}`;
          mkdirSync(out, { recursive: true });
          const artifacts = ['web', 'node'].map((target) => {
            const path = `sdk-rs/hosts/wasm/pkg/${target}/safe_cex_wasm_bg.wasm`;
            const bytes = readFileSync(path);
            copyFileSync(path, `${out}/${target}.wasm`);
            return { target, bytes: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex'), error: wasmBudgetError(bytes.length, 'venue', 'bybit') ?? null };
          });
          const report = { revision: process.env.RUST_CHECKOUT_SHA, mode, budgetBytes: wasmBudgetBytes('venue', 'bybit'), artifacts };
          writeFileSync(`${out}/report.json`, JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report, null, 2));
          JS
          done
      - name: Compare measurements and require ordinary Bybit budget
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const read = (mode) => JSON.parse(readFileSync(`sdk-rs/harness/out/barrier-size/${mode}/report.json`));
          const off = read('off');
          const on = read('on');
          if (off.revision !== on.revision || off.revision !== process.env.RUST_CHECKOUT_SHA) throw new Error('comparison revision mismatch');
          for (const artifact of off.artifacts) {
            const enabled = on.artifacts.find(({ target }) => target === artifact.target);
            if (!enabled) throw new Error('comparison target missing');
            console.log(`${artifact.target}: off=${artifact.bytes}, on=${enabled.bytes}, delta=${enabled.bytes - artifact.bytes}`);
          }
          if (off.artifacts.some(({ error }) => error)) throw new Error('ordinary Bybit exceeds its venue budget');
          JS
      - name: Retain same-head capability measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bybit-mutation-barrier-size
          path: sdk-rs/harness/out/barrier-size/
          retention-days: 3


  families:
    name: Rust / wasm family (${{ matrix.family }})
    needs: selection
    if: needs.selection.outputs.sizeRequired == 'true'
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON(needs.selection.outputs.families) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WASM_BINDGEN_VERSION: 0.2.129
      SAFE_CEX_WASM_OPT: required
      # The single-venue size budget is read from sdk-rs/harness/wasm-budget.mjs.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/prepare-yarn
        id: yarn
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            sdk-rs/target
          key: ${{ runner.os }}-cargo-family-${{ matrix.family }}-${{ hashFiles('sdk-rs/Cargo.lock', 'sdk-rs/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-family-${{ matrix.family }}-
            ${{ runner.os }}-cargo-gate-
      - name: Install pinned toolchain and wasm-bindgen
        run: |
          (cd sdk-rs && rustup show)
          if ! wasm-bindgen --version 2>/dev/null | grep -q "$WASM_BINDGEN_VERSION"; then
            cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked --force
          fi
      - uses: ./.github/actions/prefetch-cargo
      - uses: ./.github/actions/install-binaryen
      - uses: ./.github/actions/install-yarn
        with:
          cache-dir: ${{ steps.yarn.outputs.cache-dir }}
          cache-key: ${{ steps.yarn.outputs.cache-key }}
          cache-hit: ${{ steps.yarn.outputs.cache-hit }}
      - name: Build the selected venue family
        run: |
          corepack yarn rust:build-wasm --venue '${{ matrix.family }}'
      - name: Lint the selected venue family with the pinned toolchain
        working-directory: sdk-rs
        run: cargo clippy --locked -p safe-cex-wasm --no-default-features --features '${{ matrix.family }}' --target wasm32-unknown-unknown -- -D warnings
      - name: Seal the selected family build
        run: |
          node sdk-rs/harness/ci-wasm.mjs --venue '${{ matrix.family }}' --archive sdk-rs/hosts/wasm/pkg/ci-replay
          mkdir -p 'sdk-rs/hosts/wasm/pkg/web/${{ matrix.family }}' 'sdk-rs/hosts/wasm/pkg/node/${{ matrix.family }}'
          cp sdk-rs/hosts/wasm/pkg/web/*.* 'sdk-rs/hosts/wasm/pkg/web/${{ matrix.family }}/'
          cp sdk-rs/hosts/wasm/pkg/node/*.* 'sdk-rs/hosts/wasm/pkg/node/${{ matrix.family }}/'
      - name: Check family isolation, every alias and the shipped size
        env:
          RUST_TEST_FAMILY: ${{ matrix.family }}
        run: corepack yarn rust:test-families
      - name: MEXC missing command-feature negative control
        if: matrix.family == 'mexc'
        run: corepack yarn -s node sdk-rs/harness/capability-feature-control.mjs
      - name: Retain sealed same-run family build
        uses: actions/upload-artifact@v7
        with:
          name: wasm-family-${{ matrix.family }}
          path: |
            sdk-rs/hosts/wasm/pkg/node/
            sdk-rs/hosts/wasm/pkg/web/
            sdk-rs/hosts/wasm/pkg/ci-replay/
          retention-days: 3
          if-no-files-found: error

      - name: Prove the shared operation channel through actual Kraken WASM engines
        if: matrix.family == 'kraken'
        env:
          CARGO_BUILD_JOBS: 4
        run: |
          (cd sdk-rs && cargo build --locked -p safe-cex-wasm --no-default-features --features hosted-operation-proof --target wasm32-unknown-unknown)
          wasm-bindgen --target nodejs --out-dir "$RUNNER_TEMP/hosted-operation-proof" sdk-rs/target/wasm32-unknown-unknown/debug/safe_cex_wasm.wasm
          printf '{"type":"commonjs"}\n' > "$RUNNER_TEMP/hosted-operation-proof/package.json"
          HOSTED_OPERATION_WASM="$RUNNER_TEMP/hosted-operation-proof/safe_cex_wasm.js" node --test --test-timeout=10000 sdk-rs/hosts/wasm/js/hosted-operation.integration.mjs


  combined:
    name: Rust / combined consumers
    needs: selection
    if: needs.selection.outputs.combinedRequired == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WASM_BINDGEN_VERSION: 0.2.129
      SAFE_CEX_WASM_OPT: required
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/prepare-yarn
        id: yarn
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            sdk-rs/target
          key: ${{ runner.os }}-cargo-combined-${{ hashFiles('sdk-rs/Cargo.lock', 'sdk-rs/rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-combined-
      - name: Install pinned toolchain and wasm-bindgen
        run: |
          (cd sdk-rs && rustup show)
          if ! wasm-bindgen --version 2>/dev/null | grep -q "$WASM_BINDGEN_VERSION"; then
            cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked --force
          fi
      - uses: ./.github/actions/prefetch-cargo
      - uses: ./.github/actions/install-binaryen
      - uses: ./.github/actions/install-yarn
        with:
          cache-dir: ${{ steps.yarn.outputs.cache-dir }}
          cache-key: ${{ steps.yarn.outputs.cache-key }}
          cache-hit: ${{ steps.yarn.outputs.cache-hit }}
      - name: Rust book delta wire through the JS decoder and SDK
        run: corepack yarn rust:test-frame-wire
      - name: Build the offline native session fixture
        working-directory: sdk-rs
        run: cargo build --locked -p safe-cex-native --example session-adapter-fixture
      - name: Native frame session adapter through real WebSockets
        run: corepack yarn rust:test-server-adapter
      - name: Build the combined wasm engine
        run: corepack yarn rust:build-wasm
      - name: Combined capability command conformance
        run: corepack yarn -s node --test sdk-rs/harness/capabilities-combined.integration.mjs
      - name: Check the shipped combined wasm size budget
        if: needs.selection.outputs.sizeRequired == 'true'
        run: corepack yarn -s rust:wasm-budget --combined
      # Capture web bytes BEFORE the standalone family build overwrites pkg/web.
      - name: Archive same-run combined browser diagnostic
        if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master'))
        run: corepack yarn -s rust:measure-browser --archive combined --out sdk-rs/harness/out/browser-combined
      - name: Retain combined browser inputs
        if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master'))
        uses: actions/upload-artifact@v7
        with:
          name: browser-wasm-combined
          path: sdk-rs/harness/out/browser-combined/
          retention-days: 14
          if-no-files-found: error
      - name: The TS exchange on the wasm engine
        run: corepack yarn workspace @tealstreet/safe-cex test-wasm
      - name: Install pinned Bun for standalone CLI loader proof
        run: |
          corepack yarn -s global add bun@1.4.3
          corepack yarn -s global bin >> "$GITHUB_PATH"
      - name: Rust consumer startup and packaged loaders
        run: |
          corepack yarn workspace @tealstreet/safe-cex-server test-wasm
          corepack yarn workspace @tealstreet/exchange-mcp test-wasm
          corepack yarn workspace @tealstreet/cli test-wasm
          corepack yarn workspace @tealstreet/safe-cex-react-native test-wasm
          corepack yarn -s workspace @tealstreet/exchange-mcp build
          corepack yarn -s workspace @tealstreet/exchange-mcp smoke
      - name: Native product semantics through the real CLI preflight
        run: corepack yarn rust:test-product-semantics
      - name: The Cloudflare Workers host
        run: corepack yarn workspace @tealstreet/safe-cex-wasm test
      - name: Run changed venue integration controls against the built combined engine
        env:
          CHANGED_INTEGRATION_TESTS: ${{ needs.selection.outputs.integrationTests }}
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          const tests = JSON.parse(process.env.CHANGED_INTEGRATION_TESTS);
          if (!Array.isArray(tests) || tests.some(path => !/^sdk-rs\/harness\/[a-z0-9-]+\.integration\.[cm]?[jt]s$/.test(path))) throw new Error('Invalid integration test selection');
          if (tests.length) {
            const child = spawnSync(process.execPath, ['--import', 'tsx', '--test', ...tests], { stdio: 'inherit' });
            if (child.error || child.signal || child.status !== 0) throw new Error('Changed integration controls failed');
          }
          JS
      - name: Retain built combined module for reuse
        uses: actions/upload-artifact@v7
        with:
          name: replay-combined-package
          path: |
            sdk-rs/hosts/wasm/pkg/node/
            sdk-rs/hosts/wasm/pkg/web/
          if-no-files-found: error
          retention-days: 3


  browser:
    name: Rust / browser cold start
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    needs: [selection, families, combined]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/prepare-yarn
        id: yarn
      - uses: ./.github/actions/install-yarn
        with:
          cache-dir: ${{ steps.yarn.outputs.cache-dir }}
          cache-key: ${{ steps.yarn.outputs.cache-key }}
          cache-hit: ${{ steps.yarn.outputs.cache-hit }}
      - uses: actions/download-artifact@v8
        with:
          pattern: wasm-family-*
          path: sdk-rs/hosts/wasm/pkg/
          merge-multiple: true
      - name: Archive reused same-run browser family assets
        run: corepack yarn -s rust:measure-browser --archive families --out sdk-rs/harness/out/browser-inputs
      - uses: actions/download-artifact@v8
        with:
          pattern: browser-wasm-*
          path: sdk-rs/harness/out/browser-inputs
          merge-multiple: true
      - name: Measure actual Chrome worker module readiness
        run: |
          corepack yarn -s rust:measure-browser --inputs sdk-rs/harness/out/browser-inputs --out sdk-rs/harness/out/browser-cold-start
          cat sdk-rs/harness/out/browser-cold-start/table.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain browser observations and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-cold-start
          path: sdk-rs/harness/out/browser-cold-start/
          retention-days: 14
          if-no-files-found: error

  # Replays recorded traffic through TS and Rust: output must be identical, and
  # on public data Rust must use less CPU and less memory (see the plan's gates).

  replay:
    name: Rust / replay correctness (${{ matrix.venue }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [selection, families, combined]
    if: always() && needs.selection.result == 'success' && needs.families.result == 'success' && (needs.combined.result == 'success' || needs.combined.result == 'skipped') && needs.selection.outputs.replayRequired == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.selection.outputs.replay) }}
    env:
      WASM_BINDGEN_VERSION: 0.2.129
      SAFE_CEX_WASM_OPT: required
      RUST_REPLAY_CORRECTNESS_ONLY: 'true'
      RUST_REPLAY_CI_WASM: sdk-rs/hosts/wasm/pkg/ci-replay
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/prepare-yarn
        id: yarn
      - uses: ./.github/actions/install-yarn
        with:
          cache-dir: ${{ steps.yarn.outputs.cache-dir }}
          cache-key: ${{ steps.yarn.outputs.cache-key }}
          cache-hit: ${{ steps.yarn.outputs.cache-hit }}
      - uses: actions/download-artifact@v8
        with:
          name: wasm-family-${{ matrix.family }}
          path: sdk-rs/hosts/wasm/pkg/
      - name: Verify the same-run matching family capsule
        run: node sdk-rs/harness/ci-wasm.mjs --venue '${{ matrix.venue }}' --verify sdk-rs/hosts/wasm/pkg/ci-replay
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sdk-rs/target
          key: ${{ runner.os }}-cargo-replay-native-${{ matrix.family }}-${{ hashFiles('sdk-rs/Cargo.lock', 'sdk-rs/rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-family-${{ matrix.family }}-
      - name: Install pinned toolchain for native contracts
        run: (cd sdk-rs && rustup show)
      - uses: ./.github/actions/prefetch-cargo
      - name: Scripted lifecycle financial parity (fixed sanitized capture)
        if: matrix.venue == 'binance'
        run: corepack yarn -s rust:gate:record --venue binance --tape sdk-rs/harness/fixtures/binance-scripted-lifecycle-private.jsonl --books BTCUSDT
      - name: Credentialed lifecycle runner (scripted transport only)
        if: matrix.venue == 'binance'
        run: corepack yarn rust:test-live-smoke
      - name: Public data (correctness)
        run: corepack yarn -s rust:gate:record --venue ${{ matrix.venue }} --tape sdk-rs/harness/fixtures/${{ matrix.venue }}-public.jsonl.gz --books '${{ matrix.books }}'
      - name: OKX inverse public books (correctness)
        if: matrix.venue == 'okx'
        run: corepack yarn -s rust:gate:record --venue okx --tape sdk-rs/harness/fixtures/okx-inverse-public.jsonl.gz --books BTCUSD,ETHUSD
      - name: OKX EEA X-Perps public books (correctness)
        if: matrix.venue == 'okx'
        run: corepack yarn -s rust:gate:record --venue okxeu --tape sdk-rs/harness/fixtures/okxeu-xperp-public.jsonl.gz --books BTCUSD_UM_XPERP310404,ETHUSD_UM_XPERP310404
      - name: Account and trading (correctness)
        if: matrix.venue != 'okx' && matrix.venue != 'orderly' && matrix.venue != 'coinbase'
        run: |
          corepack yarn ${{ matrix.private_script }}
          corepack yarn -s rust:gate:record --venue ${{ matrix.venue }} --tape sdk-rs/harness/tapes/${{ matrix.venue }}-private.jsonl --books ''
      - name: Hyperliquid spot-enabled account and trading (correctness)
        if: matrix.venue == 'hyperliquid'
        run: |
          corepack yarn rust:private-tape-hyperliquid --spot --out sdk-rs/harness/tapes/hyperliquid-spot-private.jsonl
          corepack yarn -s rust:gate:record --venue hyperliquid --tape sdk-rs/harness/tapes/hyperliquid-spot-private.jsonl --books ''
      - name: Lighter testnet deployment signing and replay
        if: matrix.venue == 'lighter' || matrix.venue == 'lighter-robinhood'
        run: |
          corepack yarn rust:private-tape-lighter --venue '${{ matrix.venue }}' --testnet --out sdk-rs/harness/tapes/lighter-testnet-private.jsonl
          corepack yarn -s rust:gate:record --venue '${{ matrix.venue }}' --tape sdk-rs/harness/tapes/lighter-testnet-private.jsonl --books ''
      - name: Binance Spot, COIN-M and portfolio margin public variants
        if: matrix.venue == 'binance'
        run: |
          corepack yarn -s rust:gate:record --venue binancespot --tape sdk-rs/harness/fixtures/binancespot-public.jsonl.gz --books BTCUSDT,ETHUSDT
          corepack yarn -s rust:gate:record --venue binanceinverse --tape sdk-rs/harness/fixtures/binanceinverse-public.jsonl.gz --books BTCUSD_PERP,ETHUSD_PERP
          corepack yarn -s rust:gate:record --venue binancepm --tape sdk-rs/harness/fixtures/binance-public.jsonl.gz --books BTCUSDT,ETHUSDT,SOLUSDT
      - name: Binance European Options retained-reference REST parity
        if: matrix.venue == 'binance'
        run: |
          corepack yarn rust:private-tape-binanceoptions --public
          corepack yarn rust:private-tape-binanceoptions
          corepack yarn -s rust:gate:record --venue binanceoptions --tape sdk-rs/harness/tapes/binanceoptions.jsonl --books ''
          corepack yarn -s rust:gate:record --venue binanceoptions --tape sdk-rs/harness/tapes/binanceoptions-private.jsonl --books ''
      - name: Binance Spot, COIN-M and portfolio margin private variants
        if: matrix.venue == 'binance'
        run: |
          for venue in binancespot binanceinverse binancepm; do
            corepack yarn "rust:private-tape-$venue"
            corepack yarn -s rust:gate:record --venue "$venue" --tape "sdk-rs/harness/tapes/$venue-private.jsonl" --books ''
          done
      - name: Hyperliquid Spot compiled native account and trading contracts
        if: matrix.venue == 'hyperliquidspot'
        run: corepack yarn rust:test-hyperliquidspot-parity
      - name: Kraken Spot compiled auth and atomic amendment contracts
        if: matrix.venue == 'krakenspot'
        run: corepack yarn rust:test-krakenspot-parity
      - name: Breakout compiled account, startup and polling controls
        if: matrix.venue == 'breakoutprop'
        run: corepack yarn rust:test-breakoutprop-parity
      - name: Backpack selected public-only history contracts
        if: matrix.venue == 'backpack'
        run: corepack yarn -s node --test sdk-rs/harness/backpack-history.integration.mjs
      - name: Aster V3 wallet auth, builder, STP and native query contracts
        if: matrix.venue == 'asterdex'
        run: |
          corepack yarn rust:private-tape-asterdex-v3
          corepack yarn -s rust:gate:record --venue asterdex --tape sdk-rs/harness/tapes/asterdex-v3-private.jsonl --books ''
          corepack yarn rust:test-asterdex-parity
      - name: Bitget inverse account and native contract sizing
        if: matrix.venue == 'bitget'
        run: |
          corepack yarn rust:private-tape-bitgetinverse
          corepack yarn -s rust:gate:record --venue bitgetinverse --tape sdk-rs/harness/tapes/bitgetinverse-private.jsonl --books ''
      - name: Bitget UTA ledger and Classic/UTA trailing native contracts
        if: matrix.venue == 'bitget'
        run: corepack yarn rust:test-bitget-parity
      - name: OKX EU X-Perp public products (correctness)
        if: matrix.venue == 'okx'
        run: corepack yarn -s rust:gate:record --venue okxeu --tape sdk-rs/harness/fixtures/okxeu-public.jsonl.gz --books BTCUSD_UM_XPERP310404,ETHUSD_UM_XPERP310404
      - name: OKX account and trading variants (correctness)
        if: matrix.venue == 'okx'
        run: |
          for venue in okx okxeu okxdemo okxeudemo; do
            corepack yarn rust:private-tape-okx --venue "$venue"
            corepack yarn -s rust:gate:record --venue "$venue" --tape "sdk-rs/harness/tapes/$venue-private.jsonl" --books ''
          done

      - name: Bybit inverse/spot/demo public data (correctness)
        if: matrix.venue == 'bybit'
        run: |
          corepack yarn -s rust:gate:record --venue bybitinverse --tape sdk-rs/harness/fixtures/bybitinverse-public.jsonl.gz --books BTCUSD,ETHUSD
          corepack yarn -s rust:gate:record --venue bybitspot --tape sdk-rs/harness/fixtures/bybitspot-public.jsonl.gz --books BTCUSDT,ETHUSDT
          corepack yarn -s rust:gate:record --venue bybitdemo --tape sdk-rs/harness/fixtures/bybitdemo-public.jsonl.gz --books BTCUSDT,ETHUSDT
      - name: Hyro documented public contract (live endpoints not configured)
        if: matrix.venue == 'bybit'
        run: corepack yarn -s rust:gate:record --venue hyrotrader --tape sdk-rs/harness/fixtures/hyrotrader-public.jsonl.gz --books BTCUSDT,ETHUSDT
      - name: Bybit variants account and trading (documented correctness)
        if: matrix.venue == 'bybit'
        run: |
          for venue in bybitinverse bybitspot bybitdemo hyrotrader; do
            corepack yarn "rust:private-tape-$venue"
            corepack yarn -s rust:gate:record --venue "$venue" --tape "sdk-rs/harness/tapes/$venue-private.jsonl" --books ''
          done
      - name: Orderly broker and testnet variants (correctness)
        if: matrix.venue == 'orderly'
        run: |
          for venue in orderly tealstreet-dex kodiakfi woofi mode salsadex what; do
            for network in mainnet testnet; do
              extra=()
              suffix=''
              if [ "$network" = testnet ]; then extra+=(--testnet); suffix='-testnet'; fi
              corepack yarn rust:private-tape-orderly --venue "$venue" "${extra[@]}"
              corepack yarn -s rust:gate:record --venue "$venue" --tape "sdk-rs/harness/tapes/$venue$suffix-private.jsonl" --books ''
            done
          done
      - name: Coinbase product and CDP algorithm variants (correctness)
        if: matrix.venue == 'coinbase'
        run: |
          for profile in intx cfm spot; do
            for algorithm in ES256 EdDSA; do
              tape="sdk-rs/harness/tapes/coinbase-$profile-$algorithm-private.jsonl"
              corepack yarn rust:private-tape-coinbase --venue coinbase --profile "$profile" --algorithm "$algorithm" --out "$tape"
              corepack yarn -s rust:gate:record --venue coinbase --tape "$tape" --books ''
            done
          done
          for algorithm in ES256 EdDSA; do
            tape="sdk-rs/harness/tapes/coinbasespot-spot-$algorithm-private.jsonl"
            corepack yarn rust:private-tape-coinbase --venue coinbasespot --profile spot --algorithm "$algorithm" --out "$tape"
            corepack yarn -s rust:gate:record --venue coinbasespot --tape "$tape" --books ''
          done
      - name: Verify complete correctness coverage
        if: always()
        run: node sdk-rs/harness/verify-gates.mjs --suite '${{ matrix.venue }}' --mode correctness
      - name: Retain correctness replay reports and artifact budgets
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: correctness-replay-${{ matrix.venue }}
          path: |
            sdk-rs/harness/out/
          retention-days: 14

  gate:
    name: Rust / replay measurement (${{ matrix.venue }})
    needs: selection
    if: needs.selection.outputs.replayRequired == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Legacy DXtrade has no anonymous API; this public fixture is documented/scripted.
          - venue: breakoutprop
            books: BTCUSD,ETHUSD
            private_script: rust:private-tape-breakoutprop
          - venue: apexomni
            books: BTCUSDT,ETHUSDT
            private_script: rust:private-tape-apexomni
          - venue: asterdex
            books: BTCUSDT,ETHUSDT
            private_script: rust:private-tape-asterdex
          - venue: woo
            books: BTCUSDT,ETHUSDT
            private_script: rust:private-tape-woo
          - venue: binance
            books: BTCUSDT,ETHUSDT,SOLUSDT
            private_script: rust:private-tape
          - venue: bitunix
            books: BTCUSDT,ETHUSDT
            private_script: rust:private-tape-bitunix
          - venue: orderly
            books: BTCUSDC,ETHUSDC
            private_script: rust:private-tape-orderly
          - venue: coinbase
            books: BTC-USD,ETH-USD
            private_script: rust:private-tape-coinbase
          - venue: bitget
            books: BTCUSDT,ETHUSDT
            private_script: rust:private-tape-bitget
          - venue: bitgetusdc
            books: BTCUSDC,ETHUSDC
            private_script: rust:private-tape-bitgetusdc
          - venue: backpack
            books: SOL_USDC_PERP,BTC_USDC_PERP
            private_script: rust:private-tape-backpack
          - venue: blofin
            books: BTCUSDT,ETHUSDT
            private_script: rust:private-tape:blofin
          - venue: mexc
            books: BTCUSDT,ETHUSDT
            private_script: rust:private-tape-mexc
          - venue: polymarket
            books: xi-jinping-out-before-2027-Yes,will-gavin-newsom-win-the-2028-democratic-presidential-nomination-568-Yes
            private_script: rust:private-tape-polymarket
          - venue: kucoin
            books: BTCUSDT,ETHUSDT
            private_script: rust:private-tape-kucoin
          - venue: kucoinspot
            books: BTC-USDT,ETH-USDT
            private_script: rust:private-tape-kucoinspot
          - venue: bingx
            books: BTCUSDT,ETHUSDT
            private_script: rust:private-tape-bingx
          - venue: bybit
            books: BTCUSDT,ETHUSDT
            private_script: rust:private-tape-bybit
          - venue: okx
            books: BTCUSDT,ETHUSDT
            private_script: rust:private-tape-okx
          - venue: cryptocom
            books: BTCUSD-PERP,ETHUSD-PERP
            private_script: rust:private-tape-cryptocom
          - venue: weex
            books: BTCUSDT,ETHUSDT
            private_script: rust:private-tape:weex
          - venue: grvt
            books: BTC_USDT_PERP,ETH_USDT_PERP
            private_script: rust:private-tape-grvt
          - venue: phemex
            books: BTCUSDT,ETHUSDT
            private_script: rust:private-tape:phemex
          - venue: krakenspot
            books: XBT/USD,ETH/USD
            private_script: rust:private-tape-krakenspot
          - venue: hyperliquidspot
            books: PURR/USDC,HYPE/USDC
            private_script: rust:private-tape-hyperliquidspot
          - venue: kraken
            books: PF_XBTUSD,PF_ETHUSD
            private_script: rust:private-tape-kraken
          - venue: lighter
            books: ETH,BTC
            private_script: rust:private-tape-lighter
          - venue: lighter-robinhood
            books: ETH,BTC
            private_script: rust:private-tape-lighter-robinhood
          - venue: bitrue
            books: E-BTC-USDT,E-ETH-USDT
            private_script: rust:private-tape-bitrue
          - venue: hyperliquid
            books: BTC-PERP,ETH-PERP
            private_script: rust:private-tape-hyperliquid
          - venue: paradex
            books: BTC-USD-PERP,ETH-USD-PERP
            private_script: rust:private-tape-paradex
          - venue: txflow
            books: BTC-USDC,ETH-USDC
            private_script: rust:private-tape-txflow
    env:
      WASM_BINDGEN_VERSION: 0.2.129
      SAFE_CEX_WASM_OPT: required
      # Five pairs only for the venue's sweep; Bitget also covers its USDC suite.
      PRIVATE_REPLAY_RUNS: ${{ ((github.head_ref || github.ref_name) == format('wip/harness-tape-time-{0}', matrix.venue) || (matrix.venue == 'bitgetusdc' && (github.head_ref || github.ref_name) == 'wip/harness-tape-time-bitget')) && '5' || '1' }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/prepare-yarn
        id: yarn
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            sdk-rs/target
          key: ${{ runner.os }}-cargo-gate-${{ hashFiles('sdk-rs/Cargo.lock', 'sdk-rs/rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-gate-
      - name: Install pinned toolchain and wasm-bindgen
        run: |
          (cd sdk-rs && rustup show)
          if ! wasm-bindgen --version 2>/dev/null | grep -q "$WASM_BINDGEN_VERSION"; then
            cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked --force
          fi
      - uses: ./.github/actions/prefetch-cargo
      - uses: ./.github/actions/install-binaryen
      - uses: ./.github/actions/install-yarn
        with:
          cache-dir: ${{ steps.yarn.outputs.cache-dir }}
          cache-key: ${{ steps.yarn.outputs.cache-key }}
          cache-hit: ${{ steps.yarn.outputs.cache-hit }}
      - name: Rust book delta wire through the JS decoder and SDK
        if: matrix.venue == 'binance'
        run: corepack yarn rust:test-frame-wire
      - name: Build the offline native session fixture
        if: matrix.venue == 'binance'
        run: cargo build --locked --manifest-path sdk-rs/Cargo.toml -p safe-cex-native --example session-adapter-fixture
      - name: Native frame session adapter through real WebSockets
        if: matrix.venue == 'binance'
        run: corepack yarn rust:test-server-adapter
      - name: Build the combined wasm engine
        if: matrix.venue == 'binance' || inputs.replay_artifact == 'combined'
        run: corepack yarn rust:build-wasm
      - name: Combined capability command conformance
        if: matrix.venue == 'binance' || inputs.replay_artifact == 'combined'
        run: corepack yarn -s node --test sdk-rs/harness/capabilities-combined.integration.mjs
      - name: Check the shipped combined wasm size budget
        if: matrix.venue == 'binance' || inputs.replay_artifact == 'combined'
        run: corepack yarn -s rust:wasm-budget --combined
      # Capture web bytes BEFORE the standalone family build overwrites pkg/web.
      - name: Archive same-run combined browser diagnostic
        if: matrix.venue == 'binance' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master'))
        run: corepack yarn -s rust:measure-browser --archive combined --out sdk-rs/harness/out/browser-combined
      - name: Retain combined browser inputs
        if: matrix.venue == 'binance' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master'))
        uses: actions/upload-artifact@v7
        with:
          name: measured-browser-wasm-combined
          path: sdk-rs/harness/out/browser-combined/
          retention-days: 14
          if-no-files-found: error
      - name: The TS exchange on the wasm engine
        if: matrix.venue == 'binance'
        run: corepack yarn workspace @tealstreet/safe-cex test-wasm
      - name: Install pinned Bun for standalone CLI loader proof
        if: matrix.venue == 'binance'
        run: |
          corepack yarn -s global add bun@1.4.3
          corepack yarn -s global bin >> "$GITHUB_PATH"
      - name: Rust consumer startup and packaged loaders
        if: matrix.venue == 'binance'
        run: |
          corepack yarn workspace @tealstreet/safe-cex-server test-wasm
          corepack yarn workspace @tealstreet/exchange-mcp test-wasm
          corepack yarn workspace @tealstreet/cli test-wasm
          corepack yarn workspace @tealstreet/safe-cex-react-native test-wasm
          corepack yarn -s workspace @tealstreet/exchange-mcp build
          corepack yarn -s workspace @tealstreet/exchange-mcp smoke
      - name: Native product semantics through the real CLI preflight
        if: matrix.venue == 'binance'
        run: corepack yarn rust:test-product-semantics
      - name: The Cloudflare Workers host
        if: matrix.venue == 'binance'
        run: corepack yarn workspace @tealstreet/safe-cex-wasm test
      # A dispatched combined run replays this exact module in every suite;
      # never overwrite it with a family or archive it as a family-only build.
      - name: Build the venue wasm engine
        if: inputs.replay_artifact != 'combined'
        run: corepack yarn rust:build-wasm --venue ${{ matrix.venue }}
      - name: Archive the matching CI replay engine
        if: inputs.replay_artifact != 'combined'
        run: corepack yarn -s node sdk-rs/harness/ci-wasm.mjs --venue '${{ matrix.venue }}' --archive sdk-rs/hosts/wasm/pkg/ci-replay
      - name: Check the wasm size budget
        if: inputs.replay_artifact != 'combined'
        run: corepack yarn -s rust:wasm-budget --venue '${{ matrix.venue }}'
      - name: Replay request normalization
        run: corepack yarn rust:test-harness
      - name: Credentialed lifecycle runner (scripted transport only)
        if: matrix.venue == 'binance'
        run: corepack yarn rust:test-live-smoke
      - name: Scripted lifecycle financial parity (fixed sanitized capture)
        if: matrix.venue == 'binance'
        run: corepack yarn -s rust:gate:record --venue binance --tape sdk-rs/harness/fixtures/binance-scripted-lifecycle-private.jsonl --books BTCUSDT --runs "$PRIVATE_REPLAY_RUNS"
      - name: Generate Binance Options public CPU input before sealing
        if: matrix.venue == 'binance'
        run: corepack yarn rust:private-tape-binanceoptions --public
      - name: Seal approved CPU measurement inputs
        id: cpu_prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node sdk-rs/harness/cpu-ci.mjs --command prepare --suite '${{ matrix.venue }}'
          --out '${{ runner.temp }}/cpu-runtime-first' --mode '${{ inputs.replay_artifact == 'combined' && 'combined' || 'family' }}'
      - name: Public data (correctness, CPU and memory)
        run: corepack yarn -s rust:gate:record --venue ${{ matrix.venue }} --tape sdk-rs/harness/fixtures/${{ matrix.venue }}-public.jsonl.gz --books '${{ matrix.books }}' --runs 9
      - name: OKX inverse public books (correctness, CPU and memory)
        if: matrix.venue == 'okx'
        run: corepack yarn -s rust:gate:record --venue okx --tape sdk-rs/harness/fixtures/okx-inverse-public.jsonl.gz --books BTCUSD,ETHUSD --runs 9
      - name: OKX EEA X-Perps public books (correctness, CPU and memory)
        if: matrix.venue == 'okx'
        run: corepack yarn -s rust:gate:record --venue okxeu --tape sdk-rs/harness/fixtures/okxeu-xperp-public.jsonl.gz --books BTCUSD_UM_XPERP310404,ETHUSD_UM_XPERP310404 --runs 9
      - name: Account and trading (correctness)
        if: matrix.venue != 'okx' && matrix.venue != 'orderly' && matrix.venue != 'coinbase'
        run: |
          corepack yarn ${{ matrix.private_script }}
          corepack yarn -s rust:gate:record --venue ${{ matrix.venue }} --tape sdk-rs/harness/tapes/${{ matrix.venue }}-private.jsonl --runs "$PRIVATE_REPLAY_RUNS" --books ''
      - name: Hyperliquid spot-enabled account and trading (correctness)
        if: matrix.venue == 'hyperliquid'
        run: |
          corepack yarn rust:private-tape-hyperliquid --spot --out sdk-rs/harness/tapes/hyperliquid-spot-private.jsonl
          corepack yarn -s rust:gate:record --venue hyperliquid --tape sdk-rs/harness/tapes/hyperliquid-spot-private.jsonl --runs "$PRIVATE_REPLAY_RUNS" --books ''
      - name: Lighter testnet deployment signing and replay
        if: matrix.venue == 'lighter' || matrix.venue == 'lighter-robinhood'
        run: |
          corepack yarn rust:private-tape-lighter --venue '${{ matrix.venue }}' --testnet --out sdk-rs/harness/tapes/lighter-testnet-private.jsonl
          corepack yarn -s rust:gate:record --venue '${{ matrix.venue }}' --tape sdk-rs/harness/tapes/lighter-testnet-private.jsonl --runs "$PRIVATE_REPLAY_RUNS" --books ''
      - name: Binance Spot, COIN-M and portfolio margin public variants
        if: matrix.venue == 'binance'
        run: |
          corepack yarn -s rust:gate:record --venue binancespot --tape sdk-rs/harness/fixtures/binancespot-public.jsonl.gz --books BTCUSDT,ETHUSDT --runs 9
          corepack yarn -s rust:gate:record --venue binanceinverse --tape sdk-rs/harness/fixtures/binanceinverse-public.jsonl.gz --books BTCUSD_PERP,ETHUSD_PERP --runs 9
          corepack yarn -s rust:gate:record --venue binancepm --tape sdk-rs/harness/fixtures/binance-public.jsonl.gz --books BTCUSDT,ETHUSDT,SOLUSDT --runs 9
      - name: Binance European Options retained-reference REST parity
        if: matrix.venue == 'binance'
        run: |
          corepack yarn rust:private-tape-binanceoptions
          corepack yarn -s rust:gate:record --venue binanceoptions --tape sdk-rs/harness/tapes/binanceoptions.jsonl --books '' --runs 9
          corepack yarn -s rust:gate:record --venue binanceoptions --tape sdk-rs/harness/tapes/binanceoptions-private.jsonl --books '' --runs "$PRIVATE_REPLAY_RUNS"
      - name: Binance Spot, COIN-M and portfolio margin private variants
        if: matrix.venue == 'binance'
        run: |
          for venue in binancespot binanceinverse binancepm; do
            corepack yarn "rust:private-tape-$venue"
            corepack yarn -s rust:gate:record --venue "$venue" --tape "sdk-rs/harness/tapes/$venue-private.jsonl" --runs "$PRIVATE_REPLAY_RUNS" --books ''
          done
      - name: MEXC missing command-feature negative control
        if: matrix.venue == 'mexc'
        run: corepack yarn -s node sdk-rs/harness/capability-feature-control.mjs
      - name: Hyperliquid Spot compiled native account and trading contracts
        if: matrix.venue == 'hyperliquidspot'
        run: corepack yarn rust:test-hyperliquidspot-parity
      - name: Kraken Spot compiled auth and atomic amendment contracts
        if: matrix.venue == 'krakenspot'
        run: corepack yarn rust:test-krakenspot-parity
      - name: Breakout compiled account, startup and polling controls
        if: matrix.venue == 'breakoutprop'
        run: corepack yarn rust:test-breakoutprop-parity
      - name: Backpack selected public-only history contracts
        if: matrix.venue == 'backpack'
        run: corepack yarn -s node --test sdk-rs/harness/backpack-history.integration.mjs
      - name: Aster V3 wallet auth, builder, STP and native query contracts
        if: matrix.venue == 'asterdex'
        run: |
          corepack yarn rust:private-tape-asterdex-v3
          corepack yarn -s rust:gate:record --venue asterdex --tape sdk-rs/harness/tapes/asterdex-v3-private.jsonl --runs "$PRIVATE_REPLAY_RUNS" --books ''
          corepack yarn rust:test-asterdex-parity
      - name: Bitget inverse account and native contract sizing
        if: matrix.venue == 'bitget'
        run: |
          corepack yarn rust:private-tape-bitgetinverse
          corepack yarn -s rust:gate:record --venue bitgetinverse --tape sdk-rs/harness/tapes/bitgetinverse-private.jsonl --runs "$PRIVATE_REPLAY_RUNS" --books ''
      - name: Bitget UTA ledger and Classic/UTA trailing native contracts
        if: matrix.venue == 'bitget'
        run: corepack yarn rust:test-bitget-parity
      - name: OKX EU X-Perp public products (correctness, CPU and memory)
        if: matrix.venue == 'okx'
        run: corepack yarn -s rust:gate:record --venue okxeu --tape sdk-rs/harness/fixtures/okxeu-public.jsonl.gz --books BTCUSD_UM_XPERP310404,ETHUSD_UM_XPERP310404 --runs 9
      - name: OKX account and trading variants (correctness)
        if: matrix.venue == 'okx'
        run: |
          for venue in okx okxeu okxdemo okxeudemo; do
            corepack yarn rust:private-tape-okx --venue "$venue"
            corepack yarn -s rust:gate:record --venue "$venue" --tape "sdk-rs/harness/tapes/$venue-private.jsonl" --runs "$PRIVATE_REPLAY_RUNS" --books ''
          done

      - name: Bybit inverse/spot/demo public data (correctness, CPU and memory)
        if: matrix.venue == 'bybit'
        run: |
          corepack yarn -s rust:gate:record --venue bybitinverse --tape sdk-rs/harness/fixtures/bybitinverse-public.jsonl.gz --books BTCUSD,ETHUSD --runs 9
          corepack yarn -s rust:gate:record --venue bybitspot --tape sdk-rs/harness/fixtures/bybitspot-public.jsonl.gz --books BTCUSDT,ETHUSDT --runs 9
          corepack yarn -s rust:gate:record --venue bybitdemo --tape sdk-rs/harness/fixtures/bybitdemo-public.jsonl.gz --books BTCUSDT,ETHUSDT --runs 9
      - name: Hyro documented public contract (live endpoints not configured)
        if: matrix.venue == 'bybit'
        run: corepack yarn -s rust:gate:record --venue hyrotrader --tape sdk-rs/harness/fixtures/hyrotrader-public.jsonl.gz --books BTCUSDT,ETHUSDT --runs 9
      - name: Bybit variants account and trading (documented correctness)
        if: matrix.venue == 'bybit'
        run: |
          for venue in bybitinverse bybitspot bybitdemo hyrotrader; do
            corepack yarn "rust:private-tape-$venue"
            corepack yarn -s rust:gate:record --venue "$venue" --tape "sdk-rs/harness/tapes/$venue-private.jsonl" --runs "$PRIVATE_REPLAY_RUNS" --books ''
          done
      - name: Orderly broker and testnet variants (correctness)
        if: matrix.venue == 'orderly'
        run: |
          for venue in orderly tealstreet-dex kodiakfi woofi mode salsadex what; do
            for network in mainnet testnet; do
              extra=()
              suffix=''
              if [ "$network" = testnet ]; then extra+=(--testnet); suffix='-testnet'; fi
              corepack yarn rust:private-tape-orderly --venue "$venue" "${extra[@]}"
              corepack yarn -s rust:gate:record --venue "$venue" --tape "sdk-rs/harness/tapes/$venue$suffix-private.jsonl" --runs "$PRIVATE_REPLAY_RUNS" --books ''
            done
          done
      - name: Coinbase product and CDP algorithm variants (correctness)
        if: matrix.venue == 'coinbase'
        run: |
          for profile in intx cfm spot; do
            for algorithm in ES256 EdDSA; do
              tape="sdk-rs/harness/tapes/coinbase-$profile-$algorithm-private.jsonl"
              corepack yarn rust:private-tape-coinbase --venue coinbase --profile "$profile" --algorithm "$algorithm" --out "$tape"
              corepack yarn -s rust:gate:record --venue coinbase --tape "$tape" --runs "$PRIVATE_REPLAY_RUNS" --books ''
            done
          done
          for algorithm in ES256 EdDSA; do
            tape="sdk-rs/harness/tapes/coinbasespot-spot-$algorithm-private.jsonl"
            corepack yarn rust:private-tape-coinbase --venue coinbasespot --profile spot --algorithm "$algorithm" --out "$tape"
            corepack yarn -s rust:gate:record --venue coinbasespot --tape "$tape" --runs "$PRIVATE_REPLAY_RUNS" --books ''
          done
      # Collector steps retain strict FAIL reports so every product runs. Only
      # this mandatory verifier can certify the job; unknown/missing gates fail.
      - name: Verify strict replay results and declared known failures
        if: always()
        id: cpu_collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node sdk-rs/harness/cpu-ci.mjs --command collect --suite '${{ matrix.venue }}'
      - name: Retain CPU runtime capsule
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cpu-cohort-${{ matrix.venue }}
          path: sdk-rs/harness/out/cpu-collection/cohort/
          retention-days: 14
          if-no-files-found: error
      - name: Retain the eligible original runtime bytes
        if: steps.cpu_collect.outputs.has_eligible == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: cpu-runtime-${{ matrix.venue }}
          path: ${{ steps.cpu_prepare.outputs.runtime_path }}/
          retention-days: 3
          if-no-files-found: error
      - name: Retain strict gate reports and artifact budgets
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strict-replay-${{ matrix.venue }}
          path: |
            sdk-rs/harness/out/
          retention-days: 14
      - name: Retain the matching CI replay engine briefly
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-wasm-${{ matrix.venue }}
          path: sdk-rs/hosts/wasm/pkg/ci-replay/
          retention-days: 3
          if-no-files-found: ignore
      - name: Retain the shipped combined replay engine briefly
        if: always() && inputs.replay_artifact == 'combined' && matrix.venue == 'binance'
        uses: actions/upload-artifact@v7
        with:
          name: combined-wasm
          path: |
            sdk-rs/hosts/wasm/pkg/node/safe_cex_wasm.js
            sdk-rs/hosts/wasm/pkg/node/safe_cex_wasm_bg.wasm
            sdk-rs/hosts/wasm/pkg/node/package.json
          retention-days: 3
          if-no-files-found: error



  bitget-paired:
    name: Rust / Bitget counterbalanced steady CPU
    needs: selection
    if: needs.selection.outputs.replayRequired == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: .
    env:
      CARGO_BUILD_JOBS: 4
      WASM_BINDGEN_VERSION: 0.2.129
      SAFE_CEX_WASM_OPT: required
      ESBUILD_WORKER_THREADS: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/prepare-yarn
        id: yarn
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
          key: ${{ runner.os }}-cargo-bitget-paired-${{ hashFiles('sdk-rs/Cargo.lock', 'sdk-rs/rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-gate-
      - name: Install pinned toolchain and wasm-bindgen
        run: |
          (cd sdk-rs && rustup show)
          if ! wasm-bindgen --version 2>/dev/null | grep -q "$WASM_BINDGEN_VERSION"; then
            cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked --force
          fi
      - uses: ./.github/actions/prefetch-cargo
      - uses: ./.github/actions/install-binaryen
      - uses: ./.github/actions/install-yarn
        with:
          cache-dir: ${{ steps.yarn.outputs.cache-dir }}
          cache-key: ${{ steps.yarn.outputs.cache-key }}
          cache-hit: ${{ steps.yarn.outputs.cache-hit }}
      - name: Public counterbalanced Bitget steady CPU
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node sdk-rs/harness/bitget-paired-ci.mjs --out '${{ runner.temp }}/bitget-paired-steady'
      - name: Retain counterbalanced Bitget steady evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bitget-paired-steady
          path: ${{ runner.temp }}/bitget-paired-steady/
          retention-days: 14
          if-no-files-found: error


  cpu-plan:
    name: Rust / CPU remeasurement plan
    needs: [selection, gate, bitget-paired]
    if: always() && needs.selection.outputs.replayRequired == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 32
    outputs:
      has_eligible: ${{ steps.plan.outputs.has_eligible }}
      matrix: ${{ steps.plan.outputs.matrix }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/prepare-yarn
        id: yarn
      - uses: ./.github/actions/install-yarn
        with:
          cache-dir: ${{ steps.yarn.outputs.cache-dir }}
          cache-key: ${{ steps.yarn.outputs.cache-key }}
          cache-hit: ${{ steps.yarn.outputs.cache-hit }}
      - name: Authenticate complete first evidence and select eligible cases
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node sdk-rs/harness/cpu-ci.mjs --command plan --out '${{ runner.temp }}/cpu-plan'
      - name: Retain CPU remeasurement plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cpu-plan
          path: ${{ runner.temp }}/cpu-plan/
          retention-days: 14
          if-no-files-found: error


  cpu-second:
    name: Rust / CPU remeasurement (${{ matrix.suite }})
    needs: cpu-plan
    if: needs.cpu-plan.result == 'success' && needs.cpu-plan.outputs.has_eligible == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.cpu-plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 42
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No install, compilation, module build, or measurement fallback here.
      - name: Public CPU remeasurement from sealed original runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node sdk-rs/harness/cpu-ci.mjs --command second --suite '${{ matrix.suite }}' --out '${{ runner.temp }}/cpu-runtime-second'
      - name: Retain CPU remeasurement results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cpu-second-${{ matrix.suite }}
          path: sdk-rs/harness/out/
          retention-days: 14
          if-no-files-found: error


  cpu-certify:
    name: Rust / shared CPU certification
    needs: [selection, gate, bitget-paired, cpu-plan, cpu-second]
    if: always() && needs.selection.outputs.replayRequired == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 42
    outputs:
      results: ${{ steps.certify.outputs.results }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/prepare-yarn
        id: yarn
      - uses: ./.github/actions/install-yarn
        with:
          cache-dir: ${{ steps.yarn.outputs.cache-dir }}
          cache-key: ${{ steps.yarn.outputs.cache-key }}
          cache-hit: ${{ steps.yarn.outputs.cache-hit }}
      - name: Verify strict first results or complete two-run means
        id: certify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node sdk-rs/harness/cpu-ci.mjs --command certify --out '${{ runner.temp }}/cpu-certificates'
      - name: Retain CPU certificates
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cpu-certificates
          path: ${{ runner.temp }}/cpu-certificates/
          retention-days: 14
          if-no-files-found: error


  cpu-final:
    name: Rust / replay gate (${{ matrix.suite }})
    needs: [selection, cpu-certify]
    if: always() && needs.selection.outputs.replayRequired == 'true'
    strategy:
      fail-fast: false
      matrix:
        suite: [breakoutprop, apexomni, asterdex, woo, binance, bitunix, orderly, coinbase, bitget, bitgetusdc, backpack, blofin, mexc, polymarket, kucoin, kucoinspot, bingx, bybit, okx, cryptocom, weex, grvt, phemex, krakenspot, hyperliquidspot, kraken, lighter, lighter-robinhood, bitrue, hyperliquid, paradex, txflow]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require complete same-run shared certification
        env:
          CPU_CERT_RESULT: ${{ needs.cpu-certify.result }}
          CPU_CERT_RESULTS: ${{ needs.cpu-certify.outputs.results }}
        run: node sdk-rs/harness/cpu-ci.mjs --command status --suite '${{ matrix.suite }}'

  result:
    name: Rust / required coverage
    needs: [scope, selection, bans, harness, native, wasm, families, combined, replay]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Accept a change outside the Rust path scope
        if: needs.scope.result == 'success' && needs.scope.outputs.relevant == 'false'
        run: echo "No Rust-scoped paths changed; no Rust coverage required."
      - name: Require selected coverage and record landing fix ownership on red
        if: needs.scope.result != 'success' || needs.scope.outputs.relevant != 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node sdk-rs/harness/ci-result.mjs
