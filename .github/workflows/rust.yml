# Rust engine CI. Requirements live in docs/plans/RUST_REWRITE.md.
#
# Keep every step GitHub-owned: this repo's Actions policy allows only
# GitHub-owned actions, so one foreign action fails the whole run at startup.
name: Rust SDK

on:
  workflow_dispatch:
  push:
    branches: [master, feat/rust-rewrite]
    paths:
      - 'sdk-rs/**'
      - 'packages/safe-cex/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'sdk-rs/**'
      - 'packages/safe-cex/**'
      - '.github/workflows/rust.yml'

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

# No global RUSTFLAGS: it would replace sdk-rs/.cargo/config.toml's flags,
# including the wasm stack size. Warnings are denied per command instead.
env:
  CARGO_INCREMENTAL: 0

defaults:
  run:
    working-directory: sdk-rs

jobs:
  bans:
    name: Rust / banned patterns
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Reject JavaScript emulation and deleted-port dependencies
        run: ./scripts/check-bans.sh

  native:
    name: Rust / native ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: fmt
            command: cargo fmt --all --check
          - check: clippy
            command: cargo clippy --locked --workspace --all-targets -- -D warnings
          - check: test
            command: RUSTFLAGS=-Dwarnings cargo test --locked --workspace
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sdk-rs/target
          key: ${{ runner.os }}-cargo-${{ matrix.check }}-${{ hashFiles('sdk-rs/Cargo.lock', 'sdk-rs/rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.check }}-
      - name: Install pinned toolchain
        run: rustup show
      - name: Run ${{ matrix.check }}
        run: ${{ matrix.command }}

  wasm:
    name: Rust / wasm32
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sdk-rs/target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('sdk-rs/Cargo.lock', 'sdk-rs/rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-
      - name: Install pinned toolchain
        run: rustup show
      - name: Build every crate for wasm32
        run: cargo build --locked --workspace --target wasm32-unknown-unknown
      - name: Lint every crate for wasm32
        run: cargo clippy --locked --workspace --target wasm32-unknown-unknown -- -D warnings

  # Replays recorded traffic through TS and Rust: output must be identical, and
  # on public data Rust must use less CPU and less memory (see the plan's gates).
  gate:
    name: Rust / replay gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WASM_BINDGEN_VERSION: 0.2.129
      # Combined Binance, Bybit, Crypto.com, OKX and WEEX; remeasure after additions.
      WASM_BUDGET_BYTES: 2097152
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            sdk-rs/target
          key: ${{ runner.os }}-cargo-gate-${{ hashFiles('sdk-rs/Cargo.lock', 'sdk-rs/rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-gate-
      - name: Install pinned toolchain and wasm-bindgen
        run: |
          (cd sdk-rs && rustup show)
          if ! wasm-bindgen --version 2>/dev/null | grep -q "$WASM_BINDGEN_VERSION"; then
            cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked --force
          fi
      - run: yarn install --frozen-lockfile --network-timeout 600000
      - name: Build the wasm engine
        run: yarn rust:build-wasm
      - name: The TS exchange on the wasm engine
        run: yarn workspace @tealstreet/safe-cex test-wasm
      - name: The Cloudflare Workers host
        run: yarn workspace @tealstreet/safe-cex-wasm test
      - name: Harness oracle regressions
        run: corepack yarn -s rust:test-harness
      - name: Check the wasm size budget
        run: |
          size=$(stat -c%s sdk-rs/hosts/wasm/pkg/node/safe_cex_wasm_bg.wasm)
          echo "wasm: $size bytes (budget $WASM_BUDGET_BYTES)"
          test "$size" -le "$WASM_BUDGET_BYTES"
      - name: Binance public data (correctness, CPU and memory)
        run: yarn rust:gate --tape sdk-rs/harness/fixtures/binance-public.jsonl.gz
      - name: Binance account and trading (correctness)
        run: |
          yarn rust:private-tape
          yarn rust:gate --tape sdk-rs/harness/tapes/binance-private.jsonl --runs 1 --books ''
      - name: Bybit public data (correctness, CPU and memory)
        run: yarn rust:gate --venue bybit --tape sdk-rs/harness/fixtures/bybit-public.jsonl.gz --books BTCUSDT,ETHUSDT
      - name: Bybit account and trading (correctness)
        run: |
          yarn rust:private-tape-bybit
          yarn rust:gate --venue bybit --tape sdk-rs/harness/tapes/bybit-private.jsonl --runs 1 --books ''
      - name: Harness protocol regressions
        run: yarn rust:test-harness
      - name: Crypto.com public data (correctness, CPU and memory)
        run: yarn rust:gate --venue cryptocom --tape sdk-rs/harness/fixtures/cryptocom-public.jsonl.gz --books BTCUSD-PERP,ETHUSD-PERP
      - name: Crypto.com account and trading (correctness)
        run: |
          yarn rust:private-tape-cryptocom
          yarn rust:gate --venue cryptocom --tape sdk-rs/harness/tapes/cryptocom-private.jsonl --runs 1 --books ''
      - name: OKX public data (correctness, CPU and memory)
        run: yarn rust:gate --venue okx --tape sdk-rs/harness/fixtures/okx-public.jsonl.gz --books BTCUSDT,ETHUSDT
      - name: OKX account and trading variants (correctness)
        run: |
          for venue in okx okxeu okxdemo okxeudemo; do
            yarn rust:private-tape-okx --venue "$venue"
            yarn rust:gate --venue "$venue" --tape "sdk-rs/harness/tapes/$venue-private.jsonl" --runs 1 --books ''
          done
      - name: WEEX public data (correctness, CPU and memory)
        run: corepack yarn -s rust:gate --venue weex --tape sdk-rs/harness/fixtures/weex-public.jsonl.gz --books BTCUSDT,ETHUSDT
      - name: WEEX account and trading (correctness)
        run: |
          corepack yarn -s rust:private-tape:weex
          corepack yarn -s rust:gate --venue weex --tape sdk-rs/harness/tapes/weex-private.jsonl --runs 1 --books ''
