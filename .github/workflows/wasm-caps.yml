# Generated WASM caps (rule 17). After each master Rust SDK run, measure every
# sealed family artifact and the combined package of that run and raise any cap
# whose reserve fell under 10 KiB: cap = max(cap, ceil((measured + 10 KiB) / KiB)).
# Caps are never lowered. Changes go to one bot PR for review; nothing auto-merges.
#
# Keep every step GitHub-owned: this repo's Actions policy allows only
# GitHub-owned actions. PRs opened with GITHUB_TOKEN do not start other
# workflows, so a maintainer re-runs CI on the bot PR (close/reopen or a push).
name: WASM caps

on:
  workflow_run:
    workflows: [Rust SDK]
    types: [completed]
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: wasm-caps
  cancel-in-progress: false

jobs:
  refresh:
    name: Restore rule-17 reserve
    # Only master pushes measure every family; a failed run still uploads the families that fit.
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      MEASURED_SHA: ${{ github.event.workflow_run.head_sha }}
      MEASURED_RUN: ${{ github.event.workflow_run.id }}
      BOT_BRANCH: bot/wasm-caps
    steps:
      - name: Check out current master (the caps to rewrite)
        uses: actions/checkout@v7
        with:
          ref: master
      - name: Check out the measured source (validates each artifact's build-input fingerprint)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: measured
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download that run's sealed family artifacts
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: wasm-family-*
          path: ${{ runner.temp }}/wasm-caps
      - name: Download that run's combined package
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: replay-combined-package
          path: ${{ runner.temp }}/wasm-caps
      - name: Keep raises already proposed on the open bot branch
        run: |
          if git fetch --depth=1 origin "$BOT_BRANCH" 2>/dev/null; then
            git show "FETCH_HEAD:sdk-rs/harness/wasm-caps.json" > "$RUNNER_TEMP/bot-wasm-caps.json"
          fi
      - name: Apply rule 17 to the measured modules
        run: |
          node sdk-rs/harness/update-wasm-caps.mjs \
            --artifacts "$RUNNER_TEMP/wasm-caps" --root measured \
            --source-head "$MEASURED_SHA" --run-id "$MEASURED_RUN" \
            --merge "$RUNNER_TEMP/bot-wasm-caps.json" --report "$RUNNER_TEMP/wasm-caps.md"
          cat "$RUNNER_TEMP/wasm-caps.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update the bot PR
        run: |
          if git diff --quiet -- sdk-rs/harness/wasm-caps.json; then
            echo "Every measured module keeps its rule-17 reserve; no PR."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BOT_BRANCH"
          git commit -m "chore(wasm): restore rule-17 reserve" \
            -m "Measured by Rust SDK run $MEASURED_RUN at $MEASURED_SHA." -- sdk-rs/harness/wasm-caps.json
          # The bot branch is rebuilt from master each time; it only ever holds this one commit.
          git push --force origin "$BOT_BRANCH"
          {
            echo "Generated by \`.github/workflows/wasm-caps.yml\` from Rust SDK run"
            echo "[$MEASURED_RUN](${{ github.server_url }}/${{ github.repository }}/actions/runs/$MEASURED_RUN) at \`$MEASURED_SHA\`."
            echo
            echo "Rule 17: cap = max(current cap, measured + 10 KiB rounded up to KiB); caps are never lowered."
            echo "Only \`sdk-rs/harness/wasm-caps.json\` changes. Review and merge by hand; CI must be re-run on this PR"
            echo "because PRs opened with GITHUB_TOKEN do not trigger workflows."
            echo
            cat "$RUNNER_TEMP/wasm-caps.md"
          } > "$RUNNER_TEMP/pr-body.md"
          if [ -n "$(gh pr list --head "$BOT_BRANCH" --base master --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BOT_BRANCH" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create --head "$BOT_BRANCH" --base master \
              --title "chore(wasm): restore rule-17 reserve" --body-file "$RUNNER_TEMP/pr-body.md"
          fi
