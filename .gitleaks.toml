# Secret-scanning policy for this monorepo.
#
# There was no tracked `.gitleaks*` file before this one, which had two
# consequences worth knowing:
#
#   * `sdk-secret-scan.yml` could only ever scan NEW commits, because a
#     whole-tree scan drowns in test fixtures. That is still the right scope for
#     the merge gate, but it meant nothing had ever been cleared.
#   * `gitleaks dir <path>` AUTO-LOADS `<path>/.gitleaks.toml`. With no policy
#     committed, anything scanning an exported tree would load whatever that
#     tree happened to contain - so a pull request could have supplied its own
#     allowlist. The mirror-export workflows therefore pass `--config`
#     explicitly, and read it from the BASE revision rather than the head.
#
# Every allowlist below records what was actually verified, not what was
# assumed. The default rule set stays on.

[extend]
useDefault = true

[allowlist]
description = "Build output and vendored trees are not sources."
paths = [
  # Cargo build output: gitignored, never mirrored, and full of fixture strings
  # embedded from the crates it compiled. Scanning it took the run from
  # 112 MB to 3.34 GB.
  "sdk-rs/target/",
  "(^|/)node_modules/",
]

# ---------------------------------------------------------------------------
# sdk-rs: signing test vectors use fixed synthetic keys and secrets (for
# example "secret": "test-secret-value" style fixtures and RFC test keys).
# Scoped to test fixture paths; a long opaque string in production source is
# still reported.
# ---------------------------------------------------------------------------

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Public synthetic Ethereum key and its independently derived Paradex test keys."
condition = "AND"
regexTarget = "secret"
regexes = [
  "^1111111111111111111111111111111111111111111111111111111111111111$",
  "^0x4b66a9d883cd6dd0ada419c06467b69124fd6e06c7ebed6c391314fea35ddcd$",
  "^0x30aa092002d2810ad48c006709502638b83f7552f0a6ba69968d05d2c19d0cf$",
]
paths = [
  # Independently generated StarkNet derivation vectors from the public,
  # synthetic Ethereum key consisting of 32 repeated 0x11 bytes.
  "^sdk-rs/venues/paradex/tests/sign-vectors\\.json$",
]

# SHA-256 of the checked-in TS API client in an independent-vector
# provenance manifest. Require both this exact fixture and this public hash; a
# new credential in the same fixture or in any test source must still fail.
[[rules.allowlists]]
description = "Public api-client.ts provenance hash, not a credential."
condition = "AND"
paths = ["^sdk-rs/crypto/tests/fixtures/lighter/venue-signing-preimages\\.json$"]
regexTarget = "secret"
regexes = ["^99291b039f7ecd9952d7fc8fda105c5ca631b597cfbc5a4de4a7f95d435e4470$"]

# This public documentation vector was already recorded in .gitleaksignore for
# the original first-port path. Scope it to the exact current source and bytes.
[[rules.allowlists]]
description = "Binance published SIGNED Endpoint Examples HMAC secret."
condition = "AND"
paths = [
  "^sdk-rs/venues/binance/src/sign\\.rs$",
  # Same published vector, now shared with the injected local-provider tests.
  "^sdk-rs/crypto/tests/fixtures/hmac/binance\\.json$",
]
regexTarget = "secret"
regexes = ["^2b5eb11e18796d12d88f13dc27dbbd02c2cc51ff7059765ed9821957d82bb4d9$"]

# Kraken requires a base64 secret; this is exactly base64("replay-secret").
[[rules.allowlists]]
description = "Public deterministic Kraken replay secret in the venue registry."
condition = "AND"
paths = ["^sdk-rs/harness/venues\\.mjs$"]
regexTarget = "secret"
regexes = ["^cmVwbGF5LXNlY3JldA==$"]

# Existing Polymarket boundary-test HMAC key: base64("safe-fake-secret").
[[rules.allowlists]]
description = "Public synthetic Polymarket boundary-test API secret."
condition = "AND"
paths = ["^packages/safe-cex/src/__tests__/audit-regressions/polymarket\\.rust-boundary\\.wasm\\.test\\.ts$"]
regexTarget = "secret"
regexes = ["^c2FmZS1mYWtlLXNlY3JldA==$"]
