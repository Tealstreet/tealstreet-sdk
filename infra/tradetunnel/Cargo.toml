[package]
name = "tradetunnel"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.23.0"
flate2 = "1.1.5"
futures-util = { version = "0.3.32", default-features = false, features = ["sink", "std"] }
log = "0.4.32"
tokio = { version = "1.52.3", default-features = false, features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "time", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
env_logger = "0.11.10"
# Keep shared frame semantics aligned with sdk-rs/Cargo.toml.
serde_json = { version = "=1.0.154", features = ["float_roundtrip", "preserve_order", "arbitrary_precision"] }
serde = { version = "1.0.228", features = ["derive"] }
reqwest = { version = "0.13.4", features = ["json", "multipart", "form"] }
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
url = "2.5.8"
regex = "1.12.4"
once_cell = "1.21.4"
dashmap = "6.2.1"
redis = { version = "1.4.0", default-features = false, features = ["connection-manager", "script", "tokio-comp"] }
