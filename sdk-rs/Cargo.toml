[workspace]
resolver = "2"
members = [
    "algos/*",
    "crypto",
    "engine",
    "hosts/native",
    "hosts/remote-signer",
    "hosts/server",
    "hosts/wasm",
    "registry",
    # Restored verbatim from master for the monorepo candle-server image
    # (`-p safe-cex-candle-cache`); CI builds these three on their own.
    "safe-cex-candle-cache",
    "safe-cex-num",
    "safe-cex-types",
    "venues/*",
]
# A bare `cargo build|test` never unifies the candle-cache serde_json features
# into the port; those crates build only with `-p`.
default-members = [
    "algos/*",
    "crypto",
    "engine",
    "hosts/native",
    "hosts/wasm",
    "registry",
    "venues/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# The restored candle-cache crates only; never an engine or venue dependency.
safe-cex-types = { path = "safe-cex-types" }
safe-cex-num = { path = "safe-cex-num" }
ryu-js = "1"
ts-rs = "12.0.1"
syn = { version = "3.0.7", features = ["full", "visit"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "=1.0.152", features = ["float_roundtrip", "raw_value"] }
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"

# Internal
safe-cex-crypto = { path = "crypto" }
safe-cex-engine = { path = "engine" }
safe-cex-venues = { path = "registry", default-features = false }
safe-cex-venue-binance = { path = "venues/binance" }
safe-cex-venue-bitrue = { path = "venues/bitrue" }
safe-cex-venue-grvt = { path = "venues/grvt" }
safe-cex-venue-hyperliquid = { path = "venues/hyperliquid" }
safe-cex-venue-blofin = { path = "venues/blofin" }
safe-cex-venue-mexc = { path = "venues/mexc" }
safe-cex-venue-bingx = { path = "venues/bingx" }
safe-cex-venue-bitunix = { path = "venues/bitunix" }
safe-cex-venue-bybit = { path = "venues/bybit" }
safe-cex-venue-cryptocom = { path = "venues/cryptocom" }
safe-cex-venue-okx = { path = "venues/okx" }
safe-cex-venue-kucoin = { path = "venues/kucoin" }
safe-cex-venue-weex = { path = "venues/weex" }
safe-cex-venue-phemex = { path = "venues/phemex" }
safe-cex-venue-woo = { path = "venues/woo" }
safe-cex-native = { path = "hosts/native" }

# P5a Goldilocks/Poseidon2 and ECgFp5 primitives, verified against Go WASM.
poseidon-hash = "=0.1.4"
goldilocks-crypto = "=0.1.2"
# Browser entropy backend required by transitive rand users (signing APIs are explicit/deterministic).
getrandom = { version = "=0.2.17", features = ["js"] }

# EIP-712/secp256k1.
alloy-dyn-abi = { version = "=1.7.3", features = ["eip712"] }
alloy-signer = { version = "=2.5.0" }
alloy-signer-local = { version = "=2.5.0", default-features = false }

# P5a Ed25519 and Starknet/SNIP-12 primitives; no provider/client dependency.
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
starknet-crypto = { version = "=0.8.1", default-features = false, features = ["std"] }

# P5a zkLink Rescue/MuSig fork; plonk is required, multicore deliberately disabled.
franklin-crypto = { git = "https://github.com/zkLinkProtocol/franklin-crypto.git", rev = "6ba7708bd0db5142fc55800addcf211d30e65cfa", default-features = false, features = ["plonk"] }

# P5a nonce memory hygiene; already resolved by the signing dependency graph.
zeroize = "=1.9.1"

# Browser backends for every transitive getrandom generation; no production RNG API.
getrandom_03 = { package = "getrandom", version = "=0.3.4", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "=0.4.3", features = ["wasm_js"] }

# Shared Ethereum ABI/hash/address primitives; same pinned Alloy family as signers.
alloy-primitives = "=1.7.3"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

# Optimize final dispatch for throughput; venue crates retain size profiles.
[profile.release.package.safe-cex-wasm]
opt-level = 3

# Size-optimized so the combined shipped wasm stays within its ceiling.
[profile.release.package.safe-cex-venue-bitunix]
opt-level = "z"

[profile.release.package.safe-cex-venue-binance]
opt-level = "z"

# Keep Bybit family code compact; CI gates public CPU/memory and full raw outputs.
[profile.release.package.safe-cex-venue-bybit]
opt-level = "z"

# CI gates the steady public decoder throughput for this size profile.
[profile.release.package.safe-cex-venue-bingx]
opt-level = "z"

[profile.release.package.safe-cex-venue-weex]
opt-level = "z"

[profile.release.package.safe-cex-venue-phemex]
opt-level = "z"

[profile.release.package.safe-cex-venue-orderly]
opt-level = "z"

[profile.release.package.safe-cex-venue-bitrue]
opt-level = "z"

[profile.release.package.safe-cex-venue-paradex]
opt-level = "z"

# Bitget's streamed ticker decoder is CPU-bound; keep its hot loops optimized
# for throughput while the aggregate WASM build optimizes other crates for size.
[profile.release.package.safe-cex-venue-bitget]
opt-level = 3

[profile.release.package.safe-cex-engine]
opt-level = 3

# CI gates GRVT ticker throughput within the unchanged standalone budget.
[profile.release.package.safe-cex-venue-grvt]
opt-level = "z"

[profile.release.package.safe-cex-venue-coinbase]
opt-level = "z"

# Per-family size profiles; retain only after public timing and complete raw proof.
[profile.release.package.safe-cex-venue-apexomni]
opt-level = "z"

[profile.release.package.safe-cex-venue-asterdex]
opt-level = "z"

[profile.release.package.safe-cex-venue-backpack]
opt-level = "z"

[profile.release.package.safe-cex-venue-blofin]
opt-level = "z"

[profile.release.package.safe-cex-venue-breakoutprop]
opt-level = "z"

[profile.release.package.safe-cex-venue-cryptocom]
opt-level = "z"

[profile.release.package.safe-cex-venue-hyperliquid]
opt-level = "z"

[profile.release.package.safe-cex-venue-kraken]
opt-level = "z"

[profile.release.package.safe-cex-venue-lighter]
opt-level = "z"

[profile.release.package.safe-cex-venue-mexc]
opt-level = "z"

[profile.release.package.safe-cex-venue-okx]
opt-level = "z"

[profile.release.package.safe-cex-venue-polymarket]
opt-level = "z"

[profile.release.package.safe-cex-venue-txflow]
opt-level = "z"

[profile.release.package.safe-cex-venue-woo]
opt-level = "z"
