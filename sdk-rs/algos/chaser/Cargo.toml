[package]
name = "safe-cex-chaser"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Server-side chaser orders on the shared algo runtime, ported from the TS webworker chaser"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
safe-cex-algos = { path = "../runtime" }
safe-cex-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.53.3", features = ["rt", "sync", "time"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.53.3", features = ["rt", "macros", "sync", "time", "test-util"] }
