[package]
name = "safe-cex-chaser"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Server-side chaser orders on the shared algo runtime, ported from the TS webworker chaser"

[lints]
workspace = true

[dependencies]
safe-cex-algos = { path = "../runtime", default-features = false }
safe-cex-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.53.3", features = ["sync"] }

[dev-dependencies]
# Native tests run on the tokio executor.
safe-cex-algos = { path = "../runtime" }
tokio = { version = "1.53.3", features = ["rt", "macros", "sync", "time", "test-util"] }
