[package]
name = "safe-cex-algos"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Shared runtime for server-side algos (chaser, TWAP, exec) on one account thread"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
safe-cex-engine.workspace = true
tokio = { version = "1.53.3", features = ["rt", "sync", "time"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.53.3", features = ["rt", "macros", "sync", "time", "test-util"] }
