[package]
name = "safe-cex-algo-twap"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
safe-cex-algos = { path = "../runtime", default-features = false }
safe-cex-chaser = { path = "../chaser" }
safe-cex-engine.workspace = true
tokio = { version = "1.53.3", features = ["sync"] }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[dev-dependencies]
# Native tests run on the tokio executor.
safe-cex-algos = { path = "../runtime" }
tokio = { version = "1.53.3", features = ["rt", "macros", "sync", "time", "test-util"] }
