[package]
name = "safe-cex-crypto"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
safe-cex-engine.workspace = true
serde_json.workspace = true
serde.workspace = true
hmac.workspace = true
sha2.workspace = true
base64.workspace = true

poseidon-hash.workspace = true
goldilocks-crypto.workspace = true
alloy-primitives.workspace = true
alloy-signer.workspace = true
alloy-signer-local.workspace = true
ed25519-dalek.workspace = true
p256.workspace = true
starknet-crypto.workspace = true
franklin-crypto = { workspace = true, optional = true }
zeroize.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_03.workspace = true
getrandom_04.workspace = true


[features]
# zkLink pulls franklin-crypto; only ApeX Omni builds enable it.
zklink = ["dep:franklin-crypto"]
# Local provider arms. The primitive modules stay available to venues; only a
# family that signs through the provider enables its arm, keeping other WASM
# builds free of that code. Disabled arms refuse with Unsupported.
ed25519 = []
es256 = []
secp256k1 = []
stark = []
# No venue signs HMAC-SHA512 through LocalSigner; keep it out of family builds.
hmac-sha512 = []
schnorr = []

[dev-dependencies]
alloy-signer = { workspace = true, features = ["eip712"] }
alloy-dyn-abi.workspace = true
serde.workspace = true

[lints]
workspace = true
