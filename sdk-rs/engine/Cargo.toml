[package]
name = "safe-cex-engine"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Whole-plan HTTP admission is linked only by adopting venue families.
http-plans = []
# Adopters explicitly include parallel Mutation prepare/sign/release custody.
http-mutation-barriers = ["http-plans"]
# Streamed serial Plans are linked only by adopting families.
serial-plans = ["http-plans"]
# Venue-condition waits for Preflights and serial Plans, linked only by adopters.
condition-waits = ["serial-plans"]
# Temporary migration boundary; remove after all legacy socket families adopt.
managed-sockets = []
order-locks = []
# Prediction venues opt in; other standalone builds omit metadata storage and frames.
prediction = []
# Polling venues and native hosts opt into the polling configuration decoder.
polling-control = []

command-tracking = []
# Hyperliquid signed account-wide dead-man switch decoder.
command-schedule-cancel = []
book-deltas = []
command-order-book = []
command-asterdex = ["command-order-book"]
command-apexomni = []
command-polymarket = ["command-order-book"]
command-kucoinspot = []
# Bitunix opts in; other single-venue WASM builds omit the versioned-envelope selector.
any-field-envelope = []
# Bybit opts in through its dependency so unrelated single-venue WASM builds
# omit option-query deserialization and semantic frame storage/writers.
# Public Command variants and unsupported-IV guards remain available everywhere.
command-options = []
product-semantics = []
# Hyperliquid opts in: the token behind a wrapped spot pair (UBTC behind BTC/USDC).
underlying-tokens = []
# Venue crates' tests drive private request helpers through ProbeVenue.
test-support = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zeroize.workspace = true

[lints]
workspace = true
