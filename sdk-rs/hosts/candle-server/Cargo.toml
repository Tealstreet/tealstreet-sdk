[package]
name = "safe-cex-candle-server"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Native public candle and market-metadata HTTP server"

[[bin]]
name = "candle-server"
path = "src/main.rs"

[dependencies]
safe-cex-engine.workspace = true
safe-cex-native.workspace = true
safe-cex-venues = { workspace = true, features = ["default"] }
serde.workspace = true
serde_json.workspace = true
form_urlencoded = "1.2.2"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query"] }
tokio = { version = "1.53.3", features = ["rt", "macros", "sync", "time", "net", "process", "io-util", "signal"] }
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp", "tokio-rustls-comp"] }

[lints]
workspace = true
