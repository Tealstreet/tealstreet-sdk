[package]
name = "safe-cex-native"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Native (tokio) host for the sans-I/O exchange engine"

[dependencies]
safe-cex-engine = { workspace = true, features = ["command-asterdex", "command-apexomni"] }
safe-cex-venue-binance.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.53.3", features = ["rt", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
base64.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "test-util"] }
