[package]
name = "safe-cex-native"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Native (tokio) host for the sans-I/O exchange engine"

[features]
dispatch-nonce = ["safe-cex-engine/dispatch-nonce"]
default = ["venues"]
http-plans = ["safe-cex-engine/http-plans"]
http-mutation-barriers = ["http-plans", "safe-cex-engine/http-mutation-barriers"]
# Construct any registered venue by name (`FrameServer::add_venue`).
venues = ["dep:safe-cex-venues", "safe-cex-venues/default"]

[dependencies]
safe-cex-crypto.workspace = true
safe-cex-venues = { workspace = true, optional = true }
safe-cex-engine = { workspace = true, features = ["polling-control", "command-asterdex", "command-apexomni", "command-polymarket", "command-kucoinspot", "command-options"] }
safe-cex-venue-binance.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom.workspace = true
safe-cex-engine = { workspace = true, features = ["book-deltas", "command-tracking"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.53.3", features = ["rt", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
base64.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
safe-cex-engine = { workspace = true, features = ["test-support"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "test-util"] }
