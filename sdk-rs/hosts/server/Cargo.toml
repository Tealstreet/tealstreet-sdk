[package]
name = "safe-cex-exchange-server"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Native hosted exchange server: today's /account envelope over FrameServer accounts"

[[bin]]
name = "exchange-server"
path = "src/main.rs"

[dependencies]
safe-cex-crypto = { workspace = true, features = ["admission"] }
safe-cex-engine.workspace = true
safe-cex-venues.workspace = true
safe-cex-native = { workspace = true, features = ["address-nonce"] }
safe-cex-remote-signer = { path = "../remote-signer" }
safe-cex-algos = { path = "../../algos/runtime", features = ["product-semantics"] }
safe-cex-chaser = { path = "../../algos/chaser" }
safe-cex-algo-twap = { path = "../../algos/twap" }
safe-cex-exec = { path = "../../algos/exec" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws", "query", "json"] }
tokio = { version = "1.53.3", features = ["rt", "rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
jsonwebtoken = { version = "9.3.1", default-features = false, features = ["use_pem"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Error capture only: no default integrations, contexts (host inference),
# sessions or native-tls; the reqwest transport over the rustls/ring already here.
sentry = { version = "0.49.5", default-features = false, features = ["reqwest", "rustls-no-provider", "panic"] }
base64.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
ryu-js.workspace = true
# RFC 9180 handover. Only X25519 is enabled; use the crate's base-mode
# implementation rather than maintaining a separate key schedule here.
hpke = { version = "=0.13.0", default-features = false, features = ["std", "x25519"] }
# hpke disables dalek defaults: explicitly retain secret erasure on drop.
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[features]
delegated-order-frames = []
# Test accounts and unsigned proxy tokens for the integration tests; never in the binary.
test-support = ["safe-cex-engine/test-support"]

[dev-dependencies]
safe-cex-venue-backpack = { path = "../../venues/backpack" }
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
safe-cex-exchange-server = { path = ".", features = ["test-support"] }
safe-cex-engine = { workspace = true, features = ["test-support"] }
tokio = { version = "1.53.3", features = ["test-util"] }
safe-cex-venues = { workspace = true, features = ["hyperliquid"] }
tokio-tungstenite = "0.30.0"
sentry = { version = "0.49.5", default-features = false, features = ["test", "panic"] }

[lints]
workspace = true
