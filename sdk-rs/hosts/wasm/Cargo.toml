[package]
name = "safe-cex-wasm"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
profiling = []
default = ["venue-bitrue", "venue-lighter", "venue-woo", "venue-backpack", "venue-binance", "venue-bingx", "venue-bitget", "venue-blofin", "venue-bybit", "venue-cryptocom", "venue-hyperliquid", "venue-mexc", "venue-okx", "venue-weex"]
venue-backpack = ["dep:safe-cex-venue-backpack"]
venue-binance = ["dep:safe-cex-venue-binance"]
venue-bingx = ["dep:safe-cex-venue-bingx"]
venue-bitget = ["dep:safe-cex-venue-bitget"]
venue-blofin = ["dep:safe-cex-venue-blofin"]
venue-bybit = ["dep:safe-cex-venue-bybit"]
venue-cryptocom = ["dep:safe-cex-venue-cryptocom"]
venue-hyperliquid = ["dep:safe-cex-venue-hyperliquid"]
venue-mexc = ["dep:safe-cex-venue-mexc"]
venue-okx = ["dep:safe-cex-venue-okx"]
venue-weex = ["dep:safe-cex-venue-weex"]

venue-bitrue = ["dep:safe-cex-venue-bitrue"]
venue-lighter = ["dep:safe-cex-venue-lighter"]
venue-woo = ["dep:safe-cex-venue-woo"]

[dependencies]
safe-cex-engine.workspace = true
safe-cex-venue-woo = { workspace = true, optional = true }
safe-cex-venue-lighter = { path = "../../venues/lighter", optional = true }
safe-cex-venue-bitrue = { workspace = true, optional = true }
safe-cex-venue-backpack = { path = "../../venues/backpack", optional = true }
safe-cex-venue-binance = { workspace = true, optional = true }
safe-cex-venue-bingx = { workspace = true, optional = true }
safe-cex-venue-bitget = { path = "../../venues/bitget", optional = true }
safe-cex-venue-blofin = { workspace = true, optional = true }
safe-cex-venue-bybit = { workspace = true, optional = true }
safe-cex-venue-cryptocom = { workspace = true, optional = true }
safe-cex-venue-hyperliquid = { workspace = true, optional = true }
safe-cex-venue-mexc = { workspace = true, optional = true }
safe-cex-venue-okx = { workspace = true, optional = true }
safe-cex-venue-weex = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true

[lints]
workspace = true
