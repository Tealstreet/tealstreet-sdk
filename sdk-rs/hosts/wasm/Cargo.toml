[package]
name = "safe-cex-wasm"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
weex = ["dep:safe-cex-venue-weex"]
default = ["binance", "bybit", "hyperliquid", "okx", "cryptocom", "weex"]
cryptocom = ["dep:safe-cex-venue-cryptocom"]
binance = ["dep:safe-cex-venue-binance"]
bybit = ["dep:safe-cex-venue-bybit"]
hyperliquid = ["dep:safe-cex-venue-hyperliquid"]
okx = ["dep:safe-cex-venue-okx"]

[dependencies]
safe-cex-venue-weex = { workspace = true, optional = true }
safe-cex-engine.workspace = true
safe-cex-venue-cryptocom = { workspace = true, optional = true }
safe-cex-venue-binance = { workspace = true, optional = true }
safe-cex-venue-bybit = { workspace = true, optional = true }
safe-cex-venue-hyperliquid = { workspace = true, optional = true }
safe-cex-venue-okx = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true

[lints]
workspace = true
