[package]
name = "safe-cex-wasm"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Paradex streams binary SBE; its JSON control messages use the stable text entry.
text-ingress = []
grvt = ["dep:safe-cex-venue-grvt", "text-ingress"]
polymarket = ["dep:safe-cex-venue-polymarket", "text-ingress"]
coinbase = ["dep:safe-cex-venue-coinbase", "text-ingress"]
paradex = ["dep:safe-cex-venue-paradex"]
apexomni = ["dep:safe-cex-venue-apexomni", "text-ingress"]
kraken = ["dep:safe-cex-venue-kraken", "text-ingress"]
asterdex = ["dep:safe-cex-venue-asterdex", "text-ingress"]
lighter = ["dep:safe-cex-venue-lighter", "text-ingress"]
woo = ["dep:safe-cex-venue-woo", "text-ingress"]
bitrue = ["dep:safe-cex-venue-bitrue", "text-ingress"]
bitget = ["dep:safe-cex-venue-bitget", "text-ingress"]
backpack = ["dep:safe-cex-venue-backpack", "text-ingress"]
blofin = ["dep:safe-cex-venue-blofin", "text-ingress"]
mexc = ["dep:safe-cex-venue-mexc", "text-ingress"]
bingx = ["dep:safe-cex-venue-bingx", "text-ingress"]
weex = ["dep:safe-cex-venue-weex", "text-ingress"]
phemex = ["dep:safe-cex-venue-phemex", "text-ingress"]
default = [
    "grvt",
    "polymarket",
    "coinbase",
    "paradex",
    "apexomni",
    "kraken",
    "asterdex",
    "lighter",
    "woo",
    "bitrue",
    "binance",
    "kucoin",
    "kucoinspot",
    "bybit",
    "hyperliquid",
    "okx",
    "cryptocom",
    "weex",
    "bingx",
    "mexc",
    "blofin",
    "backpack",
    "bitget",
    "orderly",
    "phemex",
]
cryptocom = ["dep:safe-cex-venue-cryptocom", "text-ingress"]
binance = ["dep:safe-cex-venue-binance", "text-ingress"]
kucoin = ["dep:safe-cex-venue-kucoin", "text-ingress"]
kucoinspot = ["dep:safe-cex-venue-kucoin", "safe-cex-venue-kucoin/spot", "text-ingress"]
bybit = ["dep:safe-cex-venue-bybit", "text-ingress"]
hyperliquid = ["dep:safe-cex-venue-hyperliquid", "text-ingress"]
okx = ["dep:safe-cex-venue-okx", "text-ingress"]
orderly = ["dep:safe-cex-venue-orderly", "text-ingress"]

[dependencies]
safe-cex-venue-grvt = { workspace = true, optional = true }
safe-cex-venue-polymarket = { path = "../../venues/polymarket", optional = true }
safe-cex-venue-coinbase = { path = "../../venues/coinbase", optional = true }
safe-cex-venue-paradex = { path = "../../venues/paradex", optional = true }
safe-cex-venue-apexomni = { path = "../../venues/apexomni", optional = true }
safe-cex-venue-kraken = { path = "../../venues/kraken", optional = true }
safe-cex-venue-asterdex = { path = "../../venues/asterdex", optional = true }
safe-cex-venue-lighter = { path = "../../venues/lighter", optional = true }
safe-cex-venue-woo = { workspace = true, optional = true }
safe-cex-venue-bitrue = { workspace = true, optional = true }
safe-cex-venue-bitget = { path = "../../venues/bitget", optional = true }
safe-cex-venue-backpack = { path = "../../venues/backpack", optional = true }
safe-cex-venue-blofin = { workspace = true, optional = true }
safe-cex-venue-mexc = { workspace = true, optional = true }
safe-cex-venue-bingx = { workspace = true, optional = true }
safe-cex-venue-weex = { workspace = true, optional = true }
safe-cex-venue-phemex = { workspace = true, optional = true }
safe-cex-engine.workspace = true
safe-cex-venue-orderly = { path = "../../venues/orderly", optional = true }
safe-cex-venue-cryptocom = { workspace = true, optional = true }
safe-cex-venue-binance = { workspace = true, optional = true }
safe-cex-venue-kucoin = { workspace = true, optional = true }
safe-cex-venue-bybit = { workspace = true, optional = true }
safe-cex-venue-hyperliquid = { workspace = true, optional = true }
safe-cex-venue-okx = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true

[lints]
workspace = true
