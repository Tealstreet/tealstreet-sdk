[package]
name = "safe-cex-wasm"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The Rust algos (chaser, TWAP, exec) on this engine, host-driven; off by default.
algos = ["dep:safe-cex-algos", "dep:safe-cex-chaser", "dep:safe-cex-algo-twap"]
algos-exec = ["algos", "dep:safe-cex-exec"]
hosted-operation-proof = ["kraken", "safe-cex-engine/test-support"]
address-nonce = ["safe-cex-engine/address-nonce", "safe-cex-venues/address-nonce", "sign-meta"]
http-mutation-barriers = ["safe-cex-engine/http-mutation-barriers"]
# Read-only signing-task metadata for hosted signing (Kraken and Paradex).
sign-meta = ["safe-cex-engine/sign-meta"]
# Additive provider bootstrap; at least one venue feature is still required.
dispatch-signing = ["safe-cex-venues/dispatch-signing"]
# Browser hosted signing captures, for families with a hosted codec only.
hosted-signing = ["dispatch-signing", "safe-cex-venues/hosted-signing"]
hosted-wallet = ["dispatch-signing", "safe-cex-venues/hosted-wallet"]
bitunix = ["safe-cex-venues/bitunix", "text-ingress", "dispatch-signing", "hosted-signing"]
# Paradex streams binary SBE; its JSON control messages use the stable text entry.
text-ingress = []
grvt = ["safe-cex-venues/grvt", "text-ingress"]
polymarket = ["safe-cex-venues/polymarket", "text-ingress", "safe-cex-engine/command-polymarket"]
coinbase = ["safe-cex-venues/coinbase", "text-ingress"]
# Polling-only builds isolate the startup subscription decoder.
cold-subscriptions = []
breakoutprop = ["safe-cex-venues/breakoutprop", "text-ingress", "cold-subscriptions"]
paradex = ["safe-cex-venues/paradex", "sign-meta", "dispatch-signing", "address-nonce", "hosted-wallet"]
apexomni = ["safe-cex-venues/apexomni", "text-ingress", "safe-cex-engine/command-apexomni", "dispatch-signing"]
txflow = ["safe-cex-venues/txflow", "text-ingress"]
kraken = ["safe-cex-venues/kraken", "text-ingress", "sign-meta"]
asterdex = ["safe-cex-venues/asterdex", "text-ingress", "safe-cex-engine/command-asterdex", "dispatch-signing", "hosted-signing", "address-nonce"]
lighter = ["safe-cex-venues/lighter", "text-ingress", "dispatch-signing", "hosted-wallet"]
woo = ["safe-cex-venues/woo", "text-ingress"]
bitrue = ["safe-cex-venues/bitrue", "text-ingress", "dispatch-signing"]
bitget = ["safe-cex-venues/bitget", "text-ingress", "dispatch-signing", "hosted-signing"]
backpack = ["safe-cex-venues/backpack", "text-ingress"]
blofin = ["safe-cex-venues/blofin", "text-ingress", "dispatch-signing", "hosted-signing"]
mexc = ["safe-cex-venues/mexc", "text-ingress", "dispatch-signing"]
bingx = ["safe-cex-venues/bingx", "text-ingress", "dispatch-signing", "hosted-signing"]
weex = ["safe-cex-venues/weex", "text-ingress", "dispatch-signing"]
phemex = ["safe-cex-venues/phemex", "text-ingress", "dispatch-signing", "hosted-signing"]
default = [
    "bitunix",
    "breakoutprop",
    "grvt",
    "polymarket",
    "coinbase",
    "paradex",
    "apexomni",
    "txflow",
    "kraken",
    "asterdex",
    "lighter",
    "woo",
    "bitrue",
    "binance",
    "kucoin",
    "kucoinspot",
    "bybit",
    "hyperliquid",
    "okx",
    "cryptocom",
    "weex",
    "bingx",
    "mexc",
    "blofin",
    "backpack",
    "bitget",
    "orderly",
    "phemex",
]
cryptocom = ["safe-cex-venues/cryptocom", "text-ingress", "dispatch-signing"]
binance = ["safe-cex-venues/binance", "text-ingress", "dispatch-signing", "hosted-signing", "safe-cex-algos?/product-semantics"]
kucoin = ["safe-cex-venues/kucoin", "text-ingress"]
kucoinspot = ["safe-cex-venues/kucoinspot", "text-ingress", "safe-cex-engine/command-kucoinspot"]
bybit = ["safe-cex-venues/bybit", "text-ingress", "dispatch-signing", "hosted-signing", "safe-cex-algos?/product-semantics"]
hyperliquid = ["safe-cex-venues/hyperliquid", "text-ingress", "dispatch-signing", "address-nonce", "hosted-wallet"]
okx = ["safe-cex-venues/okx", "text-ingress", "dispatch-signing", "hosted-signing"]
orderly = ["safe-cex-venues/orderly", "text-ingress"]

[dependencies]
zeroize.workspace = true
safe-cex-engine = { workspace = true, features = ["polling-control"] }
safe-cex-venues.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
safe-cex-algos = { path = "../../algos/runtime", default-features = false, features = ["host-executor"], optional = true }
safe-cex-chaser = { path = "../../algos/chaser", optional = true }
safe-cex-algo-twap = { path = "../../algos/twap", optional = true }
safe-cex-exec = { path = "../../algos/exec", optional = true }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom.workspace = true
