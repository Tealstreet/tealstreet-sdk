note = "MIXED: FORCED at the declared shared UTF-8 surface: the actual source returns an account whose unknown value/key or name contains an observable materialized lone UTF-16 unit (string, length 1, D800/DC00); Rust String and Value object-key/string fields cannot carry it, so Rust refuses the whole import with no data, including both entries of the witnessed array. This is not a global Rust impossibility claim. CHOSEN: retain serde_json's 128-level parser budget instead of admitting unrestricted recursion; the source accepts the witnessed 130-deep unknown field. Rust currently reports Invalid JSON format for these valid-JSON representation/depth refusals. The actual-method supplement tests/import_observability.rs and tests/import_observability_oracle.cjs pins returned units before serialization and distinguishes literal six-character backslash-u text, scalar Unicode, a paired surrogate and U+FFFD as preserved positives. Original feeder bytes unchanged. See sdk-rs/parity/MANIFEST-SPEC.md#shared-utf8-string-boundary and #forced-surrogate-conflict. Legacy secret mutation, indexed error prefixes and single/array output are otherwise preserved within the JSON wire domain. Mapped safe-cex-types/src/accounts.rs::parse_import_account_data."

