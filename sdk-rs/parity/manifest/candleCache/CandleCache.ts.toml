note = "The shared safe-cex-num V8 TimSort preserves the source subtraction comparator and NaN-as-equality scheduling after first-timestamp deduplication. The old NaN-last correction is removed. Actual maintained cleanCandles and constructed CandleCache.fetch compare all native timestamp/OHLC/volume bits and result order across 133 profiles; 2002 legacy seeded source profiles retain duplicate and signed-zero coverage. See CANDLE_CACHE_SPECIFIC_CLAIMS.md. Stable consistent ordering is portable; inconsistent-comparator permutations are pinned to the measured Node/V8 engine, as in the canonical shared sorter."

