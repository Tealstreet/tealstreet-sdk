ts = "cleanCandles"
kind = "const-fn"
layer = "adapted"
rs = "safe-cex-candle-cache/src/cache.rs::clean_candles"
status = "divergent"
note = "CORRECTED: Intentional correction authorized in round 3: deduplicate timestamps keeping the first candle, then use a total numeric order with NaN last. TS subtraction treats NaN comparisons as equal, producing engine-dependent permutations and potentially non-monotonic real candles. Rust does not reproduce V8 TimSort permutations for NaN inputs; finite-only ordering remains unchanged. Reproducing the V8 sorting algorithm could preserve its permutation, but was rejected because a deterministic total order is required for finite candle output."

