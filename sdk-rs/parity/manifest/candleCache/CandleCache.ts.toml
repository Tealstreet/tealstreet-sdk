status = "divergent"
note = "CORRECTED ts-bug: TS catch discards initial and late hydration errors. Rust reports each through on_hydration_error or stderr/console.error while retaining slot release and successful network fallback. The independently executed TS oracle pins silence. ts-bug preserved: after timeout, any existing memory map (even empty after fetching a forming candle) prevents another backend hydration although the key is not hydrated. Timeout releases the slot without cancelling the old load; late results still fill gaps and mark the key hydrated. Reset removes the retry-suppressing map."
