rs = "safe-cex-candle-cache/src/cache.rs::CandleCache::get_cached_candles"
status = "divergent"
note = "MIXED CHOSEN allocation bound and CORRECTED zero-size behavior: Chunk sizes above 16384 fail fetch with a recoverable error before cache/backend I/O; cached lookup has no hits. This deliberate dense-allocation bound is stricter than JS array length limits. ts-bug: TS accepts chunkSize zero and creates unusable non-finite slots. Rust explicitly disables caching: lookup returns no cached candles and fetch calls the exchange without backend reads or writes. JS-sized sparse-property storage could mirror both, but bounded dense typed storage was selected to avoid process-killing allocations."

