status = "ported"
note = "ExchangeName rejects forged testnet-prefixed exchange strings; AnyTimeframe covers all 27 runtime timeframeToSeconds entries. Optional testnet is a per-account flag; None and false retain the historical live bytes, true namespaces the environment. Calendar keys retain -cal to avoid old boundary and slot-width data. See TS getCandleCacheKey for the shared rationale."

[[symbol]]
ts = "slotSecondsFor"
kind = "const-fn"
layer = "adapted"
rs = "safe-cex-candle-cache/src/cache.rs::slot_seconds_for"
status = "divergent"
note = "CHOSEN: ts-bug: uppercase 1W can reach TS calendar helpers but timeframeToSeconds contains only 1w, so TS slot width is undefined and subsequent arithmetic is NaN. Rust rejects 1W at AnyTimeframe decoding rather than silently correcting or reproducing non-finite slots; lowercase 1w is finite. An open string representation could emulate this alias bug, but the existing finite interval contract was selected to prevent non-finite slot arithmetic."

