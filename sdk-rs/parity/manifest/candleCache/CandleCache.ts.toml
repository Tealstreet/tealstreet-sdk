kind = "method"
layer = "adapted"
rs = "safe-cex-candle-cache/src/cache.rs::CandleCache::get_chunk_info"
status = "divergent"
note = "CHOSEN: Non-finite or out-of-i64-range slots are rejected before casting; invalid fetched timestamps are never cached/persisted. Explicit pre-epoch divergence: Rust Euclidean remainder places candle index -1 at chunk -1 offset 99 for size 100. JS remainder yields -1, a negative array property omitted by iteration/persistence. Retained to support consistent sparse storage; no current venue candles predate 1970. JS-like sparse properties and non-finite indices could mirror this, but explicit rejection before casts and bounded typed offsets were selected to prevent silent chunk-zero writes."

