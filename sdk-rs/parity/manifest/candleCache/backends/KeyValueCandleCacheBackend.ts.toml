status = "divergent"
note = "Split: safe-cex-candle-cache/src/backends.rs::KeyValueCandleCacheBackend::load_chunks and safe-cex-candle-cache/src/codec.rs::decode_json_candle. Numeric codec decision: null OHLC/volume restores native NaN as a cache hit while timestamp and missing/wrong-kind fields remain strict misses; KV writes still encode nonfinite numbers as JSON null. Actual filesystem persistence/reopen under both read modes proves zero venue requests and native fields; structural controls still miss. MIXED CHOSEN bounded typed storage and CORRECTED null-record bugs: Chunk sizes above 16384 return an error before allocation or store access. Pre-epoch divergence: Euclidean remainder retains negative-index candles in real sparse slots; TS negative array properties disappear during persistence. Zero-width chunk reads return empty rather than divide by zero. Derived non-finite indices are skipped before integer conversion, matching TS no-hit comparisons for NaN and zero widths. CHOSEN exact i64 slot bound refuses finite out-of-range indices before casting rather than saturating; a binary64 slot representation could mirror TS outside that range but exact bounded sparse storage is retained to prevent false saturated hits. Typed Candle JSON boundary: timestamp filtering precedes decoding; malformed object-shaped matching candles are skipped individually, preserving valid siblings and allowing fetch to fill their gaps. CORRECTED ts-bug (chosen typed representation): a null candle ELEMENT is skipped; TS property access throws and rejects the entire Promise.all load, losing healthy sibling chunks. A null timestamp is rejected; TS coerces it to zero and returns a candle whose timestamp remains null. Generic JSON could reproduce both source bugs but was rejected to retain the typed Candle contract. Unknown fields are discarded; TS accepts unchecked matching candles. Malformed JSON and non-array records are skipped per chunk."

