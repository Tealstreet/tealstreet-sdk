note = "MIXED CHOSEN bounded allocation, exact-key namespace and refusal representation: Chunk sizes above 16384 return a recoverable error before listing keys; dense Rust chunks have a practical bound stricter than JS array length limits. Chunk-key prefix parsing uses shared ECMAScript trimStart: BOM is consumed and NEL is preserved, matching JS parseInt. This is reachable through arbitrary listKeys results even with chunkSize=1: the slot cap does not bound key magnitude. Rust parses exact signed 64-bit keys. Nonnumeric and nonfinite parseInt keys are skipped. CHOSEN namespace guard: wrong-prefix keys are skipped; TS trusts listKeys(prefix) and blindly slices prefix.length, so a store violating that contract can produce a different finite index there. Finite decimal prefixes outside i64 are returned as refused_keys alongside usable chunks in the successful LoadedChunks result, without suppressing valid siblings or wrapping/truncating. Backend callers can inspect the refusal list; CandleCache hydration consumes the usable chunks. Exact i64 keys were selected to avoid silent wrapping and namespace loss; a binary64-key representation could mirror this rounding. TS retains finite binary64 parseInt values, rounding above 2^53 and accepting values outside i64; within i64 Rust can therefore request a different exact key."

