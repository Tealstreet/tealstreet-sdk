note = "CHOSEN: safe-cex-exchange/src/cross_trade/place_order.rs::create_cross_trade_place_order safe-cex-exchange/src/cross_trade/mod.rs::CrossTradeOrder safe-cex-exchange/src/cross_trade/mod.rs::ChaserStart safe-cex-exchange/src/cross_trade/mod.rs::CrossTradePlaceOrderFn ; Actual eager callable implements copier-local Chase dedup, terminate-before-zero, maxAttempts/delay 1000, LimitSlippage +/-0.009 with canonical adjust/fallback 0.01, and Market orders. Empty/missing/falsy inputs and original opaque result/error allocation are asserted; warning failure replaces the order error. Owned args/snapshots, typed execution and ExchangeError ABI exclude arbitrary JS throws/unsafe modes; unpolled/dropped Rust continuations differ from detached Promises. Rationale: Keep execution in the existing exchange capabilities and caller-owned continuation instead of a second Promise/task owner; see sdk-rs/parity/MANIFEST-SPEC.md#cross-trade-native-capabilities."
