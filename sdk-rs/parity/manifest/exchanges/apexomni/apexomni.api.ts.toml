note = "CHOSEN sdk-rs/parity/MANIFEST-SPEC.md#shared-utf8-string-boundary. Owned prepared configs and the shared typed options/BaseExchange replace executable JS/Axios objects, getters and aliases. Imported client/retry/headers/Date/tunnel capabilities stay with the host; callbacks are registered against the real native request/response bodies instead of a second JS heap and scheduler. The complete factory preserves configuration and registration order; handlers retain lowercase-kline header bypass, primary and legacy canonicalization, base64 secret keying, timestamp representation, multipart override, strict nullish access errors, one-time legacy retry flags and shared HTTP failure reporting. Twenty-seven actual-source cases use actual noble HMAC and actual AxiosHeaders, with independent 3/12/12 factory/request/response floors. Native configs, signatures, error type/cause/dispatch and operation order are asserted before wire encoding; imported host library internals are not independently proved. A compiled factory control fails its named native assertion and restores. Split into `safe-cex-venue-apexomni/src/api_runtime.rs::create_api`, `safe-cex-venue-apexomni/src/api_runtime.rs::ApexApi`, `safe-cex-venue-apexomni/src/api_runtime.rs::ApexApiConfiguration`, `safe-cex-venue-apexomni/src/api_runtime.rs::ApexApi::request_handler`, `safe-cex-venue-apexomni/src/api_runtime.rs::ApexApi::response_handler`. Shared checked property reads moved without behavior change to safe-cex-venue-apexomni/src/data.rs::property ; this target implements the installed handlers' inline source-property guards. Native response/config objects now stay Js through the installed response interceptor and legacy retry; terminal body capture uses canonical retained Input without a whole-response UTF8 projection. Request signing and serializer inputs keep their explicit prepared-data boundary."
