note = "The actual inverse native binding uses safe-cex-venue-binance/src/signing.rs::sign_binance_request_native ; canonical Js shallow copies, native number values and nested referents survive until shared qs serialization; actual HTTP HMAC and maintained-class source witnesses cover the installed path. The following historical representation choices still describe the older typed signer, not the new inverse native path. CHOSEN: Split signing and factory query codec: safe-cex-venue-binance/src/signing.rs::sign_binance_request retains structured config, shared payload signer and VirtualClock; safe-cex-venue-binance/src/signing.rs::serialize_query reproduces qs repeat arrays, nested keys, JS integer-key order and numeric spelling. CHOSEN representation divergence: this implementation uses UTF-8 String and serde_json::Value for intermediate signing parameters. Spreading an astral string body substitutes U+FFFD for lone UTF-16 units, so QS lone-surrogate bytes differ, pinned against live source. Non-finite injected timestamp/window become JS textual spellings in the returned config; query bytes retain NaN/Infinity spelling. Rust could preserve the source values with a UTF-16 code-unit parameter tree and native f64 values; using the current shared JSON config boundary was a representation choice, not a Rust limitation. Callback header representation inherits safe-cex-crypto PayloadSignerResult. ts-bug: signBinanceRequest spreads string bodies into indexed characters; this behavior is preserved. Identical post-transform body bytes therefore do not identify the source signing parameters. Ordinary structured venue payloads pass live TS differential before subsequent mutation. CHOSEN sdk-rs/parity/MANIFEST-SPEC.md#owned-snapshot-vs-live-alias: source shallow copies retain nested params aliases; changing the input updates the returned params, and changing returned params updates the input. Rust deep copies freeze both views. The live signing alias witness records both directions separately from the UTF-16 and non-finite configuration choices."
