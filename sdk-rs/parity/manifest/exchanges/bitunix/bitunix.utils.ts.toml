status = "divergent"
note = "CHOSEN: shared UTF-8 boundary (parity/MANIFEST-SPEC.md#shared-utf8-string-boundary). Rust accepts scalar strings; TS TextEncoder also replaces lone surrogates. Mirroring arbitrary UTF-16 would require a separate string carrier incompatible with shared String-based signing inputs. Witness tests/utils.rs::actual_typescript_sha256_hex executes the actual TS utility and Noble dependencies once for 25 cases, including padding boundaries, distinct Unicode spellings, NUL, and four refused surrogate inputs with observed source replacement digests. Production uppercase-hex mutation must fail utility sha256Hex, then restore and pass."
