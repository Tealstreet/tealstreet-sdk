note = "Split member `safe-cex-venue-breakoutprop/src/host.rs::Wire`. The production Axios request hook preserves the body and applies source auth after the queue and on each retry. Split member `safe-cex-venue-breakoutprop/src/api.rs::ApiWire::install_request_interceptor`. Installs the source auth callback on the actual client before the constructor registers its limiter, preserving LIFO dequeue-time checks and retry execution. MIXED: FORCED native UTF-8 request identifiers. CHOSEN required ApiHost/ApiWire bindings replace Axios instance/interceptor/plugin objects without default success; initialize base URL, binary64 recvWindow including zero, qs-indexed serializer, JSON content type, 3 read-only network retries, then optional tunnel adapter. Owns an options snapshot and a Weak exchange instead of live JS options/strong closure, to avoid native ownership cycles. Typed RestRequest/Config omits arbitrary Axios properties, undefined-header states, prototype params and dynamic coercion hooks; the real native request interceptor shallow-copies its config and preserves the body while applying the explicit URL/params/auth projection. Reuses replace_url_params and Axios header normalization. Native single-shot 401 guard marks the original error config before invalidation, awaits concrete coalesced login, then replays through this API; login/marked/non401/missing-config errors propagate. Requests are lazy native futures rather than automatically driven Axios microtasks. Witness final_api_native_auth_and_retry precedes actual full-source API comparisons; Three actual ProductionHost/native-client regressions prove dequeue-time missing-token and replacement-token checks plus auth rerun on network retries; each compiled and failed on master. Split member `safe-cex-venue-breakoutprop/src/api.rs::ApiDefaults`. ApiDefaults carries the safeCexAxiosCreate defaults (baseURL, recvWindow timeout, Content-Type, qs paramsSerializer) that create_api builds. Split member `safe-cex-venue-breakoutprop/src/api.rs::ApiFailure`. ApiFailure is the rejected-request shape (error, response status, config) the 401 response interceptor in request_config inspects. Split member `safe-cex-venue-breakoutprop/src/api.rs::ApiHost`. ApiHost is the host trait create_api calls for safeCexAxiosCreate, axios-retry installation and installTransportAdapter. Split member `safe-cex-venue-breakoutprop/src/api.rs::ApiHost::create`. Host binding for safeCexAxiosCreate, called first by create_api. Split member `safe-cex-venue-breakoutprop/src/api.rs::ApiHost::install_network_retry`. Host binding for retry(xhr, {retries: 3, networkErrorOnRead(readsAndPosted(LOGIN, MARKET_DATA))}), called by create_api. Split member `safe-cex-venue-breakoutprop/src/api.rs::ApiHost::install_transport_adapter`. Host binding for installTransportAdapter, called by create_api only when tealstreetTunnel is set. Split member `safe-cex-venue-breakoutprop/src/api.rs::ApiWire`. ApiWire is the created Axios instance trait whose request the interceptor loop in request_config dispatches through. Split member `safe-cex-venue-breakoutprop/src/api.rs::ApiWire::request`. The raw xhr.request call that request_config invokes through the native interceptor pipeline and on the one-shot 401 re-login retry. Split member `safe-cex-venue-breakoutprop/src/api.rs::Config`. Config is the shared mutable request config that the response interceptor marks with __dxSessionRetried and re-requests. Split member `safe-cex-venue-breakoutprop/src/api.rs::DxApi`. DxApi is the returned xhr object create_api constructs, holding the wire, options and owning exchange for the interceptors. Split member `safe-cex-venue-breakoutprop/src/api.rs::DxApi::intercept_request`. Ports the request interceptor: No session token guard, replaceUrlParams, and the Authorization or Coinbase-Authorization DXAPI header. Split member `safe-cex-venue-breakoutprop/src/api.rs::DxApi::request_config`. Ports the response interceptor loop: on 401 for a non-login, not-yet-retried config it invalidates the session, re-logs in and re-requests once. Split member `safe-cex-venue-breakoutprop/src/api.rs::DxConfig`. DxConfig is the request config plus the __dxSessionRetried flag from SessionRetryConfig used by the response interceptor."
