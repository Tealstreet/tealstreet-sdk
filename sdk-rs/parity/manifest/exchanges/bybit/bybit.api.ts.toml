status = "divergent"
note = "FINDING input behavior (owner: rust-venue-paradex / Bybit owner). Valid scalar params=\"😀\" is accepted by maintained TypeScript: object spread materializes keys 0/1 with units D83D/DE00, qs produces 0=%F0%9F%90%80&1=%F2%90%80%80&requestId=id-1 and dispatches once. Both native params carriers instead refuse the entire request before signing/transmission, preserve original input context and emit the common failure hook; signed/unsigned four-case witness tests/support/api_factory_params_astral.rs pairs two actual-source cases in scripts/create-api-params-astral-boundaries.cjs. This remains an unimplemented input case, not FORCED or a chosen Unicode exclusion; bucket authority sdk-rs/parity/MANIFEST-SPEC.md#divergence-taxonomy. Adapted split targets: `safe-cex-venue-bybit/src/api_factory.rs::create_api`, `safe-cex-transport/src/retry.rs::retry_signature_rejection_with_receipt`, `safe-cex-transport/src/provider.rs::RestResponseBody::transform_axios_response`. Request signing, effective-config receipts, default Axios response transforms, response/auth ordering, one-shot clock reentry and shared environment-probe caching compose existing core/crypto/transport operations. Preserves ts-bug: retries sign JSON-stringified transformed data while physical body bytes remain unchanged, witnessed by native retry HMAC and body assertions before source comparisons. Separately CHOSEN: owned options retain original credentials after caller mutation, unlike the live source alias (sdk-rs/parity/MANIFEST-SPEC.md#owned-snapshot-vs-live-alias; scripts/create-api-options-boundaries.cjs and native_owned_options_snapshot_boundary). CHOSEN weak owner and owner-owned probe cancellation: owner disposal releases pending transport and wakes observers with visible cancellation; source AbortSignal after response leaves the probe running. Why mirroring would be worse: keeping the source strong owner/probe alive would retain disposed exchange resources. CHOSEN original read token: a failed original POST rewritten to GET retries in source but remains one native attempt. Why mirroring would be worse: rewritten error config must not grant an originally classified write network replay. CHOSEN signer-inclusive retry budget: signer80+wire10 leaves native10ms versus source90ms; signer120+wire10 exhausts native retry while source retries. Why mirroring would be worse: the shared total-attempt budget should include authentication cost rather than grant extra retry time; this does not claim a deadline on the first attempt. CHOSEN console carrier: source passes label and the same data object as two arguments; native emits one formatted string. Why mirroring would be worse: adding an executable variadic-object console channel would duplicate the shared runtime log ABI; object identity, argument separation and console throwability are lost, and only branch/count parity is witnessed. Separate returned-string boundary: raw valid JSON \"\\ud800\" becomes a caller-inspectable source string with unit D800, while native refuses the whole response transform before common response hooks because required Value::String cannot carry it; this exact loss is FORCED under sdk-rs/parity/MANIFEST-SPEC.md#shared-utf8-string-boundary and sdk-rs/parity/MANIFEST-SPEC.md#forced-surrogate-conflict, not a rationale for the astral params finding. Finite witness floor: 85 request profiles, five construction profiles, four optional-helper cases and four separately pinned astral refusals; native assertions precede all supplemental source comparisons. These counts do not claim arbitrary executable JS objects, general Axios/runtime equivalence or absence-bit preservation. Accepted native and CI gate sequence at 4b241b5120691effb5449e9afe4e456d5adf5329: 24 named gates exit 0, then thirteen compiled controls each fail at its required native assertion with exit 101 and restore with exit 0. Measurements belong to that proof revision, not this later annotation or delivery; see sdk-rs/safe-cex-venue-bybit/GATE_EVIDENCE.md. Split member `safe-cex-transport/src/retry.rs::SignatureRetryVenue` selects the instruments-info network-retry exclusion; Bybit is its only venue."
