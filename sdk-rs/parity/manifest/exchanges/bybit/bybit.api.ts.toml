t. Why mirroring would be worse: rewritten error config must not grant an originally classified write network replay. CHOSEN signer-inclusive retry budget: signer80+wire10 leaves native10ms versus source90ms; signer120+wire10 exhausts native retry while source retries. Why mirroring would be worse: the shared total-attempt budget should include authentication cost rather than grant extra retry time; this does not claim a deadline on the first attempt. CHOSEN console carrier: source passes label and the same data object as two arguments; native emits one formatted string. Why mirroring would be worse: adding an executable variadic-object console channel would duplicate the shared runtime log ABI; object identity, argument separation and console throwability are lost, and only branch/count parity is witnessed. Separate returned-string boundary: raw valid JSON \"\\ud800\" becomes a caller-inspectable source string with unit D800, while native refuses the whole response transform before common response hooks because required Value::String cannot carry it; this exact loss is FORCED under sdk-rs/parity/MANIFEST-SPEC.md#shared-utf8-string-boundary and sdk-rs/parity/MANIFEST-SPEC.md#forced-surrogate-conflict, not a rationale for the astral params finding. Finite witness floor: 85 request profiles, five construction profiles and four separately pinned astral refusals; the dead pure-predicate optional-helper supplement was subsequently removed; native assertions precede all supplemental source comparisons. These counts do not claim arbitrary executable JS objects, general Axios/runtime equivalence or absence-bit preservation. Accepted native and CI gate sequence at 4b241b5120691effb5449e9afe4e456d5adf5329: 24 named gates exit 0, then thirteen compiled controls each fail at its required native assertion with exit 101 and restore with exit 0. Measurements belong to that proof revision, not this later annotation or delivery; see sdk-rs/safe-cex-venue-bybit/GATE_EVIDENCE.md. Requ