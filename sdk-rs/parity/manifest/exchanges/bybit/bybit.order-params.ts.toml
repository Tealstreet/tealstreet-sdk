[[symbol]]
ts = "BybitPlaceOrderOpts"
kind = "type"
layer = "adapted"
rs = "safe-cex-venue-bybit/src/order_params.rs::BybitPlaceOrderOpts"
status = "divergent"
note = "CHOSEN: Authorized stronger representation: Plain/Bbo/TickSize enum makes simultaneous extensions unrepresentable, whereas TS uses optional-never types and runtime checks. Retaining this closed representation prevents invalid extension combinations in typed callers rather than deferring the same refusal to placement. JSON rejects null, malformed and simultaneous extensions; From<PlaceOrderOpts> selects Plain. Shared whole-entry numeric ingress and native serialization preserve all six shared numeric fields plus extension values, witnessed before serialization on raw, owned and borrowed input. Exhaustive local variants and shared PlaceOrderOpts field destructuring require compilation review when either graph grows. Callers must use the shared whole-entry API before standard serde can erase a parsed Value lexical sign. FIX-audit row24 ACCEPT is strictly placement input: the actual BaseExchange place_orders_json capability refuses null/malformed/simultaneous extension profiles before signing or HTTP. Existing positive BBO, tick-size and regular-order binding cases retain the allowed wire fields. This is not permission to narrow metadata, account configuration or output records."

