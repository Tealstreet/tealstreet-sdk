status = "ported"
note = "The map-required decoder consumes shared JsNumberInput and preserves retCode through raw, owned and borrowed whole-entry ingress. Opaque raw_response: Option<Value> is explicitly declared with js_number_output!(self, struct { is_success, has_explicit_status, ret_code, ret_msg } passthrough { raw_response }) and decoded by js_deserialize_passthrough before Value construction; the whole-output numeric guard remains active. The measured production decoder path is BybitResponseMeta::deserialize -> BybitResponseMetaWire::deserialize -> present_raw_response; the live Node corpus pins retCode and nested object/array payload bits including lexical -0, overflow and negative underflow. This record-decoding claim does not change getBybitResponseMeta computation. Standard serde can erase an existing lexical sign before custom decoding; callers use the shared whole-entry API."

