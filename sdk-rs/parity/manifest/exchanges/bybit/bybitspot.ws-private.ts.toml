note = "CHOSEN: the spot reconnect body runs when its Rust Future is first polled and cancels on drop, rather than invoking the JavaScript async prefix immediately and retaining an unowned Promise; the explicit host starter must schedule/poll it. This keeps async ownership with the host without claiming a new socket constructor. Auth failures arrive as decoded Rc<ExchangeError> (name/message/code and identity retained), excluding primitive throws, String coercion of non-Errors, executable error properties and JS stack/prototype identity. The spot subscription/ping callbacks compose the spot order-only topic. Only entry disposal is checked: sync, sleep(25), auth and successful snapshot still execute after disposal during awaits as in source. Thrown auth errors log; false or failed auth disregards silence and starts reconnect without subscription/ping; reconnect and snapshot callbacks start unawaited host operations. Clock and sleep rejection precede auth, syncTime is ignored, and the reconnecting flag is read after ping. No signing or transport implementation is claimed."

