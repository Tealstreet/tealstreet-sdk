note = "FINDING: Coinbase divergence audit, behaviour. Source info retains rawOrder identity; orders.rs::map_coinbase_rest_order stores raw_order.clone(). A later mutation of the caller record therefore cannot reach native info. The prior status/layout choices below do not price this separate alias snapshot, and tests/orders.rs has no mutation-after-map witness. Owner: Coinbase. See sdk-rs/parity/MANIFEST-SPEC.md#owned-snapshot-vs-live-alias and safe-cex-venue-coinbase/DIVERGENCE_AUDIT.md. Prior bounded explanation: CORRECTED: ts-bug mapCoinbaseRestOrder accepts Object.prototype ORDER_STATUS keys. The core OrderStatus enum cannot hold inherited functions or objects; choosing a typed Order instead of generic JS values deliberately rejects these invalid statuses, with both TS and Rust outcomes pinned. CHOSEN: returning the shared core Order uses its derived serializer, which places extra last instead of before reduceOnly. A venue newtype with a custom serializer could preserve the TS layout; it is not used because this mapper returns the shared domain Order consumed by Store, not signed wire JSON; the oracle isolates this exact field-order difference and checks raw info keys in their original order. Valid declared REST-order inputs preserve the complete raw info value including unknown fields. Preserved ts-bug: finite sizes can produce NaN/Infinity through safe-math decimal scaling and the mapper does not reject them; runtime-number oracle projections distinguish those values and negative zero before JSON serialization."
