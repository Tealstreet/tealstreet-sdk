rs = "safe-cex-venue-coinbase/src/starbase_orders.rs::build_coinbase_starbase_buy"
status = "divergent"
note = "FINDING: Coinbase divergence audit, behaviour. The maintained side wrapper spreads the caller intent shallowly, retaining nested size/otoco handles; the Rust expanded intent deep-clones those typed fields. Caller mutation after a blocked result cannot remain visible through those native copies. The existing shape/order choice does not price this alias loss, and the builder corpus has no paired nested-mutation witness. Owner: Coinbase. See sdk-rs/parity/MANIFEST-SPEC.md#owned-snapshot-vs-live-alias and safe-cex-venue-coinbase/DIVERGENCE_AUDIT.md. Prior bounded explanation: CHOSEN: blocked results retain the TypeScript caller object’s insertion order and unmodeled own properties, while this typed Rust intent serializes in declaration order and drops unmodeled fields (both differences are pinned by the live corpus). Preserving those runtime object details would require replacing the public typed intent with a generic insertion-ordered map, losing compile-time field, optionality, tuple, and literal guarantees; the typed contract was chosen."

