rs = "safe-cex-venue-coinbase/src/starbase_private.rs::normalize_coinbase_starbase_order"
status = "divergent"
note = "CHOSEN: blocked results preserve arbitrary caller own properties and insertion order on gateway, and ready Order.info retains them too; TS Order.info is the exact gateway object reference, so later gateway mutation changes info while Order's mapped fields remain snapshots. Rust uses a typed DTO and copies into RetainedJsonInput, preserving numeric bits while dropping unmodeled fields and alias identity; the typed DTO's declaration order differs from caller insertion order; the workspace serde_json::Map itself preserves insertion order. Retained info now preserves NaN, infinities and negative zero. The live corpus pins extra properties on both result branches, alias mutation, order, every ready numeric output bit (including -0 on both takeProfit and stopLoss trigger branches), and every present numeric info bit before serialization. Preserving arbitrary runtime shape and alias identity would replace the typed gateway DTO with a shared mutable JS value graph across the public surface; the typed contract was chosen."

