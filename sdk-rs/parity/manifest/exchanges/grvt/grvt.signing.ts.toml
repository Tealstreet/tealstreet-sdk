[[symbol]]
ts = "GrvtSignature"
kind = "type"
layer = "adapted"
rs = "safe-cex-venue-grvt/src/records.rs::GrvtSignature"
status = "divergent"
note = "MIXED: FORCED selected field r retains materialized D800/DC00 after actual JSON.parse and assignment to the actual TypeScript GrvtSignature interface; divergence_records reads source type/length/exact unit before serialization and native selected fields directly. Required safe-cex-venue-grvt/src/records.rs::GrvtSignature string surface cannot retain it: native decoding refuses the WHOLE record, not just this field. See sdk-rs/parity/MANIFEST-SPEC.md#shared-utf8-string-boundary and sdk-rs/parity/MANIFEST-SPEC.md#forced-surrogate-conflict. The protocol data scope is described in sdk-rs/safe-cex-venue-grvt/DIVERGENCE_AUDIT.md#grvt-wire-data-choice; it is not a separately measured per-record cause. CHOSEN: its public numeric capture additionally refuses an otherwise usable record with an unknown 140-deep extension; the same choice section prices that measured recursion-budget cost. Shallow extensions decode and retain the selected field; the deep refusal is checked by its numeric-ingress diagnostic. The supplement stops at five selected-field positives and two unit refusals for this record; existing records/numeric_records retain broader field/Number coverage, not a new exhaustive proof."

