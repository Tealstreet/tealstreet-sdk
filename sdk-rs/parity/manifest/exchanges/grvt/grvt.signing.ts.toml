layer = "adapted"
rs = "safe-cex-venue-grvt/src/signing_runtime.rs::sign_order"
status = "ported"
note = "Default true applies to omitted or explicit undefined; false/null choose mainnet. Bound wallet signTypedData receiver, original payload identity, legacy domain/type inputs, Signature.from decode and live post-await signer/nonce/expiration reads. Native source floor 8 through receiver; signing/decode errors preserve identity."

[[symbol]]
ts = "generateNonce"
kind = "function"
layer = "adapted"
rs = "safe-cex-venue-grvt/src/signing_clock.rs::generate_nonce"
status = "ported"
note = "The actual exported source function returns the injected Date.now Number unchanged. One injected clock read is asserted per call, alongside Number bits or output text over 462 timestamp/hour combinations, including signed zero, overflow, underflow and fractional nanoseconds. Native NaN capture alone is canonicalized. These legacy exports have no production call sites in the current GRVT source; their direct callable contract is measured, not the active GrvtSigner or placeOrder path. Nonfinite injected clock values are robustness coverage, not values promised by a real Date.now clock."

