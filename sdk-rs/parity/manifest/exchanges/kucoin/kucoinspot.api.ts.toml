note = "CHOSEN composed shared HTTP/interceptor, crypto, read-classified retry and remote signing operations. Spot reads later key and publicDataOnly mutations as well as nested broker config; Rust retains their original values. sdk-rs/parity/MANIFEST-SPEC.md#owned-snapshot-vs-live-alias; live witnesses capture caller before/after and signed headers. Normalized string headers cannot carry Axios false/null/array values (false timestamp signs as false but is omitted); a richer model could, but venue-local normalization would split the shared RestRequest boundary. Open strings retain sdk-rs/parity/MANIFEST-SPEC.md#shared-utf8-string-boundary, with escaped lone-surrogate refusal plus scalar/astral/whitespace positives. Request bodies/params use the shared prepared JSON boundary, not host object graphs. Retries and the one signature-rejection resend re-sign with a fresh timestamp over the serialized string body, with identical wire bytes; only a signing capture keeps the incoming timestamp. Live installed Axios/retry fixtures pin this alongside shrinking timeout budget; tests/api_capture.rs pins is_kucoin_signature_rejection against the real isKucoinSignatureRejection. api_runtime tests cover local factory interceptors, shared Rust composition and actual TS remote adapter; the TS safeCexAxiosCreate/transport installation seam is injected, not a production routing/telemetry acceptance claim."
