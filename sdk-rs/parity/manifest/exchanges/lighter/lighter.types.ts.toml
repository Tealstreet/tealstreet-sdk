status = "divergent"
note = "CHOSEN sdk-rs/parity/MANIFEST-SPEC.md#shared-utf8-string-boundary for the two Cow URL strings. Inline quoteCurrency union is safe-cex-venue-lighter/src/types.rs::LighterQuoteCurrency. Public Deserialize captures JsNumberInput before its private strict-map companion; both bare serde and shared entry ingress repair signerChainId lexical -0 through raw, owned, borrowed and nested paths; overflow, negative underflow and binary64 rounding are bit-pinned. All four borrowed deployment constants and owned decoded profiles retain the same public Cow representation. Scalar/astral/BOM/NEL and valid-JSON lone-surrogate URL witnesses pin the remaining string restriction. Independent CHOSEN whole-record capture depth cost: sdk-rs/safe-cex-venue-lighter/tests/support/unknown_depth.rs witnesses Node and ordinary serde accepting an unknown extra field with 140 nested arrays, while public and shared raw/owned/borrowed capture accepts 126 and refuses 127 at the root. Retaining the shared bounded-capture policy avoids a venue-local unbounded numeric ingress fork and duplicate resource-limit contract. Rust could skip unknown fields or raise the limit, so this is CHOSEN, never FORCED. Whole-record capture also applies sdk-rs/parity/MANIFEST-SPEC.md#shared-utf8-string-boundary to unknown string values: Node accepts lone-surrogate extras and ordinary serde skips them, while bare/shared raw capture refuses them; scalar, astral, BOM and NEL extras remain accepted. No owned/borrowed surrogate witness is claimed because Value cannot carry it."

