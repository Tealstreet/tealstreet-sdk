[[symbol]]
ts = "MexcEnvelope"
kind = "type"
layer = "adapted"
rs = [ "safe-cex-venue-mexc/src/types.rs::MexcEnvelope", "safe-cex-venue-mexc/src/types.rs::MexcCode", "safe-cex-venue-mexc/src/types.rs::decode_mexc_envelope", "safe-cex-venue-mexc/src/types.rs::decode_mexc_envelope_value" ]
status = "ported"
note = "CHOSEN: Rust represents the TypeScript number-or-string code union as MexcCode::Number or MexcCode::String so downstream Rust callers retain an exhaustive typed distinction; mirroring a bare JavaScript primitive union would erase that variant information from the Rust API without changing wire behavior. The generic envelope uses safe-cex-venue-mexc/src/types.rs::MexcEnvelope and MexcCode. Optional known fields reject present null and the private map-only decoder rejects positional arrays. Numeric-safe callers use decode_mexc_envelope or decode_mexc_envelope_value with JsNumberInput as the generic payload, then decode data into its typed output; these retain whole-entry lexemes and check native output bits. Nine live Node spellings compare raw and existing-Value checked paths by f64 bits; every envelope record carries distinct numeric code and data values and each field is checked by name. Separate native-Value cases pin negative zero independently in code and data. The prior direct-Serde failures remain pinned as baseline: raw untagged code rejected -0, -0.0, 1.5, 1e3 and overflow; existing-Value rebuffer loses integer -0 in code and data and rejects exponent/overflow. The paired spellings strongly implicate integer/float Number representation but do not prove serde_json's cause. Other MEXC numeric mappers use Number.parseFloat(String(value)) and are not typed-f64 ingress paths. Renamed to safe-cex-venue-mexc/src/types.rs::MexcCode. Renamed to safe-cex-venue-mexc/src/types.rs::decode_mexc_envelope. Renamed to safe-cex-venue-mexc/src/types.rs::decode_mexc_envelope_value."
