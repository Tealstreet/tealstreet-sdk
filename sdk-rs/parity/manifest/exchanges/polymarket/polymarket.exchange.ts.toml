note = "FINDING Polymarket divergence audit (owner: rust-venue-polymarket): FINDING: historical CHOSEN-only note already mentions whole-input refusal but omits the section19 ruling for returned token/outcome units and its larger three-pair loss. Actual JSON.parse materializes three returned pairs: ordinary/Yes, D800/No, third/DC00. Token and outcome units are inspected before serialization; the ordinary pair remains present. The Vec<(String,String)> output and ArrayString deserializer cannot retain the two observed units. Either malformed-for-String element aborts the array parse, so the helper returns empty: all three pairs, including the ordinary pair, are lost. Native branch inspected only.  Evidence sdk-rs/parity/evidence/polymarket-divergence-audit/README.md#row-7; canonical ruling sdk-rs/parity/MANIFEST-SPEC.md#forced-surrogate-conflict. Historical note follows: CHOSEN sdk-rs/parity/MANIFEST-SPEC.md#shared-utf8-string-boundary. tests/utilities.rs::utility_rows_actual_typescript executes the actual original function. Parameters project only Gamma clobTokenIds/outcomes nullable JSON-string fields; tuple entries preserve tokenId/outcome identity and order. Invalid JSON/nonarrays/unequal lengths return empty; non-string pairs are filtered without recursively materializing ignored nested values. 22 cases include malformed/scalar/mismatched/duplicate/mixed/deep256/Unicode/overflow-number inputs, 19 source outputs and 15 compared native pairs. Two JSON arrays containing lone-surrogate string elements cause whole-input Rust refusal (empty), while TS retains those pairs. tests/utilities_controls.py symmetric identity, mismatch, consuming string-deserializer loss, subset output and guard-removal controls require named runtime assertions and restored passes. This is wire pairing only, not prediction-core outcome/probability/event/payoff mapping."

