ter. Native config plus injected timestamp/provider retains body UTF-16, number bits, callables and nested aliases; typed provider projection remains separately declared. Value keeps absence distinct from explicit null and raw strings distinct from parsed objects. Signed preimage and untouched data are separate per-request values; no adapter byte-equivalence or factory completion is claimed here. This narrower boundary simplifies native ownership; a fuller JS-value model could mirror more, with no demonstrated parity reason to reject it. Twelve pre-implementation live HMAC captures pin preimages and signatures. Renamed Rust targets: safe-cex-venue-woo/src/api.rs::proxy_request."

