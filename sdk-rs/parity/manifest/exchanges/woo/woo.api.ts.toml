note = "FINDING: TransportProvider.proxy_prefix still receives an immutable typed RestRequest projection instead of the complete mutable Axios config. Unknown ordinary JSON custom=97 is source-observable but has no field in that carrier; callback mutations, non-string header values, non-string baseURL, non-number/non-integral/out-of-range timeout values, optional-field absence/null/presence distinctions, the negative-zero timeout sign (i64 becomes 0), and non-string original V1 method values are not retained in the provider view. Keep this remaining omission open; no complete transport-context parity is claimed. Repaired representable defects: non-null non-callable method.toUpperCase and non-string non-null URL now fail before signing with source messages; null/missing optional method members still default. Provider view now retains logical data, string headers, baseURL, representable signed integral timeout, params and the original V1 method spelling; V3 is uppercase before the provider call. Twenty-two actual-source/native cases stop at empty method fallback, with native assertions before source/wire comparisons. Native Js config now retains original nested data, callables and own properties through signing; the String error-result interface still omits original Error brand/stack; native error text is measured while TypeError brand is observed only in source. Canonical classification: sdk-rs/parity/MANIFEST-SPEC.md#divergence-taxonomy; context ownership: sdk-rs/parity/MANIFEST-SPEC.md#owned-snapshot-vs-live-alias. Other boundaries: sdk-rs/parity/MANIFEST-SPEC.md#shared-utf8-string-boundary, sdk-rs/parity/MANIFEST-SPEC.md#closed-typed-output-boundary, sdk-rs/parity/MANIFEST-SPEC.md#numeric-ingress-defect and sdk-rs/parity/MANIFEST-SPEC.md#forced-surrogate-conflict. See DIVERGENCE_AUDIT_EVIDENCE.md. Prior maintained-domain details: CHOSEN: JSON config and explicit timestamp/provider retain V1 form preimage and config separately, with shared root collation and no byte-sort fallback. Dynamic Axios objects, functions and native NaN are outside this narrower input model; broader modeling is possible but was omitted for implementation simplicity, not necessity. Six pre-implementation HMAC captures pin ordinary, missing-field, repeat-array, empty-query, falsy-data and PATCH behavior. Factory wiring is claimed separately by createAPI. Renamed to safe-cex-venue-woo/src/api.rs::sign_v1. Renamed Rust targets: safe-cex-venue-woo/src/api.rs::proxy_request."

