status = "divergent"
note = "CHOSEN: typed HttpClientOptions, RestRequest and injected RateLimitClock replace mutable dynamic Axios instances. JSON data preserves missing/null/raw-string distinctions, array broker properties consumed by V1 forms, unsigned broker-assignment failures and remote bypass after broker injection. Fourteen pre-implementation live Axios/HMAC captures now match complete header maps, wire bytes, URL, base URL and timeout through the real shared HttpClient; shared operations supply Accept, Content-Type and null-body handling. Classified network-read retries retain transformed body phase and use the caller clock. Integer-millisecond timeout rejects fractional/nonfinite/out-of-i64-range recvWindow rather than modeling Axios dynamic validation; functions, Axios header sentinels and arbitrary instance mutation are unrepresented. Caller options are owned: a later caller secret mutation changes TypeScript signatures but not Rust signatures, pinned on both sides and covered by sdk-rs/parity/MANIFEST-SPEC.md#owned-snapshot-vs-live-alias. These are implementation simplifications, not necessities; a fuller dynamic model is possible and no parity benefit from narrowing is claimed. Renamed to safe-cex-venue-woo/src/factory.rs::create_api."
