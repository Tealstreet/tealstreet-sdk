rs = "safe-cex-venue-woo/src/constants.rs::ORDER_TYPE"
status = "divergent"
note = "CORRECTED ts-bug: ORDER_TYPE inherits Object.prototype lookups (constructor/toString/valueOf/hasOwnProperty functions, __proto__ object). Typed enum pairs only represent declared own codes. Choosing enums excludes those values; an untyped JS-value model could preserve them but would allow functions or prototype objects where downstream order domain enums are required. Live TS prototype oracle pins this defect, so an upstream null-prototype fix forces review. Own-entry declaration order and values retained."

