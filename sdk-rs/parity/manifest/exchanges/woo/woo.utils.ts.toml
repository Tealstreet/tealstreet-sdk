note = "Split member safe-cex-venue-woo/src/utils.rs::normalize_symbol_utf16 retains the common normalization body; safe-cex-venue-woo/src/utils.rs::normalize_symbol supplies the UTF8 wrapper. The shared normalization body retains UTF16 through uppercase and separator selection before the UTF8 wrapper admits its result; public ticker bindings use it directly. CHOSEN: lodash memoize exposes a mutable cache; Rust retains a stateless String result. The typed free-function API intentionally keeps wire normalization deterministic across exchange consumers; exposing a process-global mutable cache would let unrelated callers replace returned symbols. This is an API tradeoff, not an inability to represent the source cache. Actual-source cache injection changes the returned value, and clearing the entry restores the source transform; native assertions pin the stateless result before source observations. Audit floor: eight rows ending at getTransactionHistorySymbolCandidates; twenty-four actual-source observations ending at requested-empty-suffix. See DIVERGENCE_AUDIT_EVIDENCE.md. Canonical declarations: sdk-rs/parity/MANIFEST-SPEC.md#shared-utf8-string-boundary ; sdk-rs/parity/MANIFEST-SPEC.md#closed-typed-output-boundary ; sdk-rs/parity/MANIFEST-SPEC.md#owned-snapshot-vs-live-alias ; sdk-rs/parity/MANIFEST-SPEC.md#numeric-ingress-defect ; sdk-rs/parity/MANIFEST-SPEC.md#divergence-taxonomy ; sdk-rs/parity/MANIFEST-SPEC.md#forced-surrogate-conflict."

