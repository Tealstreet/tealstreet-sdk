note = "CHOSEN, ts-bug: NaN timestamps make the TS comparator nontransitive. Stable merge preserves finite timestamp order and ties, but deliberately chooses a deterministic NaN permutation rather than pinning a V8 implementation; Rust sort assumes total ordering. The live source witness pins [0,1,3,2] versus Rust [3,2,0,1]; upstream comparator changes require revisiting it. Strict decoders reject nonfinite timestamps, so this affects only host-constructed mapper inputs. Inert V3 public contract; not connected to live exchange routing and all migration gates remain false. Verified on JSON inputs against current TypeScript; Rust owned records and Results replace readonly objects and thrown Error messages. The duplicate test-only comparison/canonical adapter and its host operations are retired; this remaining native target keeps its separate contract."
