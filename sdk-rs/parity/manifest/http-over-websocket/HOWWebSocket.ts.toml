ts = "HOWWebSocket.createWebsocket"
kind = "method"
layer = "adapted"
rs = "safe-cex-transport/src/socket.rs::TunnelDialOptions"
status = "divergent"
note = "FINDING owner: safe-cex-transport HOW audit. The WAF policy reason for fail-closed behavior is concrete and supported by applicable transport instructions and sealed implementation. However, the opening MIXED label does not name any separately FORCED cause: the sealed native dialing plan and fail-closed policy are both selected host contracts. This is a bucket-only annotation issue, not a runtime policy defect. packages/http-over-websocket/src/HOWWebSocket.ts:94-124 createWebsocket builds optional Node ws/header options, appends v/t query params, constructs reconnecting socket and binds error handlers; top-level lines 15-23 permit fallback without ws. sdk-rs/safe-cex-transport/src/socket.rs:33-94 TunnelDialOptions seals headers/ALPN/protocol fields, allows browser capabilities, rejects BunNative/missing header or ALPN capabilities, then emits mandatory headers and HTTP/1.1 ALPN. packages/safe-cex/CLAUDE.md:741-751 supplies the actual WAF policy rationale. sdk-rs/parity/MANIFEST-SPEC.md#divergence-taxonomy Inspection only; no runtime execution. Original annotation (historical): MIXED: the host ABI represents dialing as a sealed typed plan. Fail-closed rejection of BunNative or missing upgrade-header/ALPN capabilities is CHOSEN and explicitly required by this port brief; mirroring TS fallback would bypass the mandatory WAF transport policy. It is not forced by Rust. Renamed to safe-cex-transport/src/socket.rs::TunnelDialOptions."

[[symbol]]
ts = "HOWWebSocket.handleWebSocketError"
kind = "field-fn"
layer = "adapted"
rs = "safe-cex-transport/src/how.rs::HOWWebSocket::handle_websocket_error"
status = "divergent"
note = "FINDING owner: safe-cex-transport HOW audit. The source invokes propagation hooks before reading/logging the error, while native accepts an already-projected host error. The note admits the omission only simplifies the boundary and gives no valid CHOSEN reason. packages/http-over-websocket/src/HOWWebSocket.ts:127-139 handleWebSocketError calls preventDefault, stopPropagation and stopImmediatePropagation, then logs and returns false. sdk-rs/safe-cex-transport/src/how.rs:312 handle_websocket_error only eprintlns the TransportError and returns false. sdk-rs/parity/MANIFEST-SPEC.md#divergence-taxonomy Inspection only; no runtime execution. Original annotation (historical): CHOSEN: host I/O errors omit DOM propagation hooks; extending the host contract could expose them. The omission simplifies the native boundary, not parity. Rust consumes/logs host I/O errors and returns false; DOM propagation/preventDefault hooks do not exist at this host boundary. Renamed to safe-cex-transport/src/how.rs::HOWWebSocket::handle_websocket_error."

[[symbol]]
ts = "HOWWebSocket#validateAndSend"
kind = "method"
layer = "adapted"
rs = [ "safe-cex-transport/src/how.rs::HOWWebSocket::send", "safe-cex-transport/src/socket.rs::TunnelSocket::ready_state" ]
status = "divergent"
note = "FINDING owner: safe-cex-transport HOW audit. The silent ping/pong drop is visibly preserved. The diagnostic properties and dynamic Error identity are omitted by a selected TransportError surface, and the note explicitly admits no parity reason. Missing diagnostic fields are an annotation rationale finding without inventing a surrogate consumer. packages/http-over-websocket/src/HOWWebSocket.ts:141-174 validateAndSend checks readyState, silently drops ping/pong, otherwise throws WebSocketNotReadyError with state, preview, full message and token-send properties. sdk-rs/safe-cex-transport/src/how.rs:151 send checks TunnelSocket.ready_state, drops serialized ping/pong, otherwise returns TransportError::Host(\"WebSocketNotReadyError\") without source properties; socket.rs:110 ready_state default assumes open until close. sdk-rs/parity/MANIFEST-SPEC.md#divergence-taxonomy Inspection only; no runtime execution. Original annotation (historical): CHOSEN diagnostic omission: non-ping not-ready failures retain the error name but omit JS webSocketState, webSocketReadyState, messagePreview, fullMessage and token-send properties. TransportError is this port's own enum; a payload struct or another variant could preserve every field. Host(String) is not a forced constraint. Keeping the smaller error surface was an implementation simplification; there is no demonstrated parity reason why mirroring these fields would be worse. This is an acknowledged omission, not a necessity claim. The silent-drop behavior below is ported; the dynamic Error representation is not. Renamed to safe-cex-transport/src/socket.rs::TunnelSocket::ready_state. Host bindings expose DOM readyState; the compatibility default assumes an open socket until a close event, and bindings with earlier state changes must override it. ts-bug: validateAndSend silently drops closed-socket frames containing ping/pong anywhere in the serialized JSON; send still tracks rpc.http domains and ping re-arms without throwing. Collapsed into send, which validates the socket before forwarding the serialized frame; no separate JS error-event API. Renamed to safe-cex-transport/src/how.rs::HOWWebSocket::send."

