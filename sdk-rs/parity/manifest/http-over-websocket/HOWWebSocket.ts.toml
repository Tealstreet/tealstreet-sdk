note = "FINDING owner: shared-core annotation audit. Remaining dynamic callback/input costs still require their own supported rationale. Repair: disposed direct onMessage entry returns before decoding or server-clock dispatch. CHOSEN callback representation: f64 accepts numeric serverTime only; the onMessage caller skips missing, null and nonnumeric values where TS invokes syncServerTime unconditionally (including undefined). When no configured callback exists, onMessage instead calls host.sync_server_time for u64 values. A tagged optional Value callback could mirror the dynamic inputs; the narrowed numeric ABI and host fallback are implementation simplifications, not forced constraints. No demonstrated parity reason makes mirroring worse; these are acknowledged omissions. Renamed to safe-cex-transport/src/how.rs::HOWWebSocket::on_message. Evidence: sdk-rs/parity/SHARED_CORE_BEHAVIOR_REPAIRS.md and SHARED_CORE_BEHAVIOR_GATE_EXITS.md."

