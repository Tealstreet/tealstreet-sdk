[[symbol]]
ts = "HOWWebSocket.connectAndSubscribe"
kind = "field-fn"
layer = "adapted"
rs = "safe-cex-transport/src/how.rs::HOWWebSocket::prepare"
status = "divergent"
note = "FINDING owner: HOW initialization annotation audit. The note conflates eager regional object allocation with connection initialization. The source HOWWebSocket constructor only stores/checks URL; its adapter calls connectAndSubscribe on first request. Native bounded prepare still has the separately justified combined caller-owned connect/auth lifecycle, but the claimed eager-module initialization contrast must be corrected. No new generic first-poll or network-race proof is asserted. See sdk-rs/parity/MANIFEST-SPEC.md#divergence-taxonomy. Original annotation (historical): CHOSEN: bounded async preparation combines connect, time synchronization and authentication before send. Mirroring detached JS initialization would require another host task and lifecycle owner while callers already own deadline-bound futures. This changes when initialization begins: lazy first use rather than eager module construction. Renamed to safe-cex-transport/src/how.rs::HOWWebSocket::prepare."

