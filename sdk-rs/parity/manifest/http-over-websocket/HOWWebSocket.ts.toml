note = "FINDING owner: HOW latency annotation audit. handleLatencyResponse narrows truthy source Map keys to nonempty native strings while preserving the unchecked entry fields. Its historical note acknowledges a feasible compatible key enum and no demonstrated parity advantage for the chosen narrowing, so that independent choice still needs a local reason. No surrogate-domain fixture or forced Rust limitation is invented. See sdk-rs/parity/MANIFEST-SPEC.md#divergence-taxonomy. Original annotation (historical): CHOSEN: string domain keys simplify the latency lookup API; a JS-compatible key enum could preserve malformed non-string keys, so this is not forced and has no demonstrated parity advantage. Retains unchecked JSON latency field values and nullish defaults. Rust domain map keys are strings, unlike malformed TS responses whose non-string domain can become a Map key. Renamed to safe-cex-transport/src/how.rs::HOWWebSocket::handle_latency_response."

