note = "FINDING owner: HOW constructor annotation audit. The historical constructor note supports deterministic sealed-policy conflict removal and avoiding duplicate global credential registration, but its MIXED bucket does not establish a separate FORCED cause from the inherited BTreeMap/typed-host selection. Arbitrary unknown Node option extensions are acknowledged omitted without their own local reason for retaining that omission. Reconcile these annotation causes separately from the valid WAF policy choices; documented lazy dial/handshake ownership is not a newly discovered first-poll defect. See sdk-rs/parity/MANIFEST-SPEC.md#divergence-taxonomy. Original annotation (historical): MIXED: typed Static/Fresh upgrade headers preserve fresh-provider invocation at each tunnel dial; the error and option types adapt private base.ws.ts connection options at this cross-crate boundary, rather than originating in the RelayWebSocket class. Ownership ruling: the transport HeaderCapableWebSocketUnavailableError belongs to relay preflight; the separate core error belongs to base.ws createWebsocket preflight. They are distinct Rust targets for distinct boundary checks, not a duplicate claim on one item. FreshHeadersProvider and WebSocketConnectionOptions adapt private TS types that have no extracted rows; the constructor representation claims them here, and core consumes that transport surface. Browser best-effort providers/protocols remain inert and required auth fails before dialing. The inherited BTreeMap ABI cannot carry ordered application of duplicate HTTP field names, although differently cased keys are representable. CHOSEN remedy: remove case-insensitive caller conflicts and retain sealed WAF Origin/UA/ALPN policy deterministically; mirroring both spellings would let caller casing shadow the required Origin through host normalization. Arbitrary unknown nodeOptions extensions are an acknowledged omission of the typed host boundary, not something forced by BTreeMap. Host-provided token callbacks count as explicit configuration, so absent global configureHOW does not itself fail this relay as it does TS. Mirroring mandatory global setup would duplicate credential registration. Renamed to safe-cex-transport/src/relay.rs::RelayWebSocket::new. Renamed to safe-cex-transport/src/relay.rs::RelayWebSocket::with_connection_options. Renamed to safe-cex-transport/src/relay.rs::FreshHeadersProvider. Renamed to safe-cex-transport/src/relay.rs::UpgradeHeaders. Renamed to safe-cex-transport/src/relay.rs::WebSocketConnectionOptions. Renamed to safe-cex-transport/src/relay.rs::HeaderCapableWebSocketUnavailableError. Renamed to safe-cex-transport/src/socket.rs::TunnelDialOptions::protocols."

