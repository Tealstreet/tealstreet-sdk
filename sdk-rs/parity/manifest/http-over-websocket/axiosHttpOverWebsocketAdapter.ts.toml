status = "divergent"
note = "FINDING owner: safe-cex-transport HOW audit. Preserve the already recorded RequestDump.body signed-zero finding once. The actual response-data path detaches native payload before typed metadata decoding, while request_dump remains inside the typed frame. The factory note ALSO explicitly admits its broader dynamic Axios/config/error boundary has no demonstrated mirroring advantage; that is a new annotation subcause, not a second cohort row or a newly measured signed-zero defect. packages/http-over-websocket/src/axiosHttpOverWebsocketAdapter.ts:272-645 factory retains original config, constructs immediate headers/request/deadline, routes response data/custom parser, and resolves {...data,config}; no source RequestDump rebuffers its data. Source callback construction prefix is eager before its awaits. sdk-rs/safe-cex-transport/src/how.rs:1234 HowRestAdapter, 1256 with_options and 1300 execute_with_context provide typed factory/context surfaces. on_message at lines 252-263 detaches data.data before RpcHttpResponse decode. infra/tradetunnel/src/frames.rs:49-59 RequestDump has body Option<Value>. Existing how.rs:1442 finding_request_dump_body_rebuffers_signed_zero asserts native -0 input and +0 typed dump; inspected only. sdk-rs/parity/MANIFEST-SPEC.md#divergence-taxonomy Inspection only; no runtime execution. Original annotation (historical): MIXED: CHOSEN typed request/response/config snapshots and earlier shape validation are port design choices, not Rust necessities. A fuller dynamic Axios bridge is feasible; the narrower surface simplifies host integration without a demonstrated parity advantage. Split: option-aware adapter, contextual call, typed response/config snapshot and error variants implement the factory callback. RestResponse carries optional direct HTTP reason text, while HOW deliberately leaves reason absent even if a shared frame status_text exists. ts-bug: BybitAPI responseInterceptor appends direct statusText, inheriting the documented collision with health errorPatterns (server error/timeout phrases can demote notices); the port does not add phrases on the tunneled path. Existing RestAdapter retains its typed response/error boundary; execute_with_context carries typed context. Opaque Axios config keys, JS Error prototypes and originalError objects are outside RestRequest/TransportError; raw adapters without a custom parser return Encoded bytes for caller parsing. RestResponseBody retains native Untransformed ordinary HOW data and Transformed custom-parser output without a serialization round trip; subsequent source transforms receive current data. ts-bug: a venue parser can therefore parse a HOW string a second time while direct quoted HTTP bytes parse once, witnessed with typeof and numeric bits by the Binance whole-factory oracle. The json_value model view does not execute another source transform. FINDING: optional RequestDump.body in the server-owned infra/tradetunnel/src/frames.rs still passes through the SDK typed metadata decoder and loses lexical negative zero. It never supplies RestResponse data and diagnostics log the original frame before decoding; how::wire_tests::finding_request_dump_body_rebuffers_signed_zero pins this bounded unresolved field. Shared params require objects; invalid non-object query shapes fail before send rather than at the server. Simulation requires an explicitly supplied direct adapter and bypasses constructor tunnel-capability validation; switching back to real HOW still validates capabilities before any dial. Renamed to safe-cex-transport/src/how.rs::HowRestAdapter. Renamed to safe-cex-transport/src/how.rs::HowRestAdapter::with_options. Renamed to safe-cex-transport/src/how.rs::HowRestAdapter::execute_with_context. Renamed to safe-cex-transport/src/how_context.rs::HOWResponse. Renamed to safe-cex-transport/src/how_context.rs::HOWRequestError. JSON-data RestRequest.config_extensions now retains adapter-owned fields; HOW consumes truthy grvtCookie/grvtAccountId into Cookie/account headers while direct HTTP keeps original headers. Seven actual-source header cases and the JS terminal-config witness cover this repair; the existing broader dynamic-config finding remains."

