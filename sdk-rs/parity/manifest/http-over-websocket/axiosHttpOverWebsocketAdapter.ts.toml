ts = "refreshBadAuthOnce"
kind = "const-fn"
layer = "adapted"
rs = "safe-cex-transport/src/how.rs::Preparing"
status = "divergent"
note = "CHOSEN scheduling boundary: the lease serializes whole preparation, whereas TS shares only the refresh promise and advances each caller's bad-auth counter concurrently. After an owner exhausts, a joiner starts its own counter later; exhaustion is never inherited. Mirroring independent loops requires separating the current caller-driven receive/preparation owner into a dedicated authentication pump; the lease retains one owner and cancellation-safe handoff, at the cost of different retry timing. A joiner can make more auth attempts in wall-clock terms than TS, but its own complete-request deadline remains the ceiling. This prepares writes as well as reads; the attempts send only rpc.auth before the HTTP frame is built/sent, so they cannot replay an order. The cost is extra auth work, not extra venue requests. This is not full scheduling parity. The preparation lease retains a shared per-attempt non-timeout Bad-auth error for callers that joined that attempt. Timeout/cancellation releases only the lease; joiners keep independent deadlines and may elect another attempt. Later calls can retry after failure without inheriting a stale error. Renamed to safe-cex-transport/src/how.rs::Preparing."

