status = "divergent"
note = "CHOSEN ownership boundary: the SG singleton is represented by the shared regional lookup, not an eagerly constructed process-lifetime export. Rust caches weak clients by host identity and creates them lazily; dropping the final owner collects the client, and a later lookup rebuilds auth and latency state. Keeping strong process-lifetime entries would leak each injected host and its monitor tasks (the previously reported F7 defect). Global disposal preserves identity and terminal state only while owners retain the client. Shared mapping with the other regional export and getHOWWebSocketForExchange. Renamed to safe-cex-transport/src/how.rs::get_how_websocket_for_exchange."

