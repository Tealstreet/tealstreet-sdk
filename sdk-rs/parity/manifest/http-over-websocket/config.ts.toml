note = "FINDING owner: safe-cex-transport HOW audit. The admitted numeric callback narrowing and unconfigured host fallback have no parity rationale in this note; it explicitly says no demonstrated reason. on_message really skips nonnumeric values and applies an additional host callback absent from source. packages/http-over-websocket/src/config.ts:60 syncServerTime forwards its argument whenever configured callback is truthy; packages/http-over-websocket/src/HOWWebSocket.ts:268 calls it with json?.serverTime. sdk-rs/safe-cex-transport/src/how_config.rs:7 ClockCallback requires f64; sync_server_time at line 156 invokes it. sdk-rs/safe-cex-transport/src/how.rs:208-217 invokes only as_f64 values, or host sync for as_u64 when unconfigured. sdk-rs/parity/MANIFEST-SPEC.md#divergence-taxonomy Inspection only; no runtime execution. Original annotation (historical): CHOSEN callback representation: f64 accepts numeric serverTime only; the onMessage caller skips missing, null and nonnumeric values where TS invokes syncServerTime unconditionally (including undefined). When no configured callback exists, onMessage instead calls host.sync_server_time for u64 values. A tagged optional Value callback could mirror the dynamic inputs; the narrowed numeric ABI and host fallback are implementation simplifications, not forced constraints. No demonstrated parity reason makes mirroring worse; these are acknowledged omissions. Renamed to safe-cex-transport/src/how_config.rs::sync_server_time."

