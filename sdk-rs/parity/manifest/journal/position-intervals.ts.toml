note = "FINDING owner: state/worker divergence audit. PositionIntervalOptions in position-intervals.ts exposes an ordinary resolver and openingSize object; position_intervals.rs stores a closed-leg infallible LegResolver and ordered IndexMap. The note states accessor/inheritance/callback-result omissions but no local reason to prefer them. See MANIFEST-SPEC.md#divergence-taxonomy. Original annotation: CHOSEN: native infallible resolver returns a shared closed leg; throwing or malformed dynamic callback results are outside this typed API. opening_size is an ordered IndexMap supplied in Object.entries order; arbitrary JS property accessors and inherited mutation are excluded."

