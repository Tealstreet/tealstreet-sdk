[[symbol]]
ts = "reconstructPositionIntervals"
kind = "const-fn"
layer = "adapted"
rs = "safe-cex-exchange/src/position_intervals.rs::reconstruct_position_intervals"
status = "divergent"
note = "FINDING owner: state/worker divergence audit. position-intervals.ts::reconstructPositionIntervals sorts with the source comparator and resolves legs; position_intervals.rs::reconstruct_position_intervals uses sort_by, typed Execution and an infallible LegResolver. The note explicitly declines V8 scheduling for a non-transitive comparator and malformed callbacks/legs, but does not explain why mirroring the declined behavior would be worse. No concrete differing sort permutation is claimed. See MANIFEST-SPEC.md#divergence-taxonomy. Original annotation: CHOSEN: native typed Execution and infallible leg resolver exclude unchecked malformed sides/legs and lone UTF-16 strings; invalid surviving opening-size legs refuse the canonical enum. Valid bare leg keys preserve the source slice(-1) behavior. Native stable sort uses the source comparator; exact V8 comparator scheduling on non-transitive mixed missing/nonnumeric ID ties is declined. Fill arithmetic, zero crossing, fee split, unsplit closing PnL, incomplete seeds, open tails and final ordering follow source."

