rn shape and plain Error throws of the TransactionClient build bodies. Split member `safe-cex-venue-lighter/src/transaction_client.rs::TransactionApi`. Constructor config, httpClient capability and tx argument shape that TransactionClient holds and calls in its nonce and submit bodies. Split member `safe-cex-venue-lighter/src/transaction_client.rs::TransactionApi::get_next_nonce`. Constructor config, httpClient capability and tx argument shape that TransactionClient holds and calls in its nonce and submit bodies. Split member `safe-cex-venue-lighter/src/transaction_client.rs::TransactionApi::send_raw_tx`. Constructor config, httpClient capability and tx argument shape that TransactionClient holds and calls in its nonce and submit bodies. Split member `safe-cex-venue-lighter/src/transaction_client.rs::TransactionApi::send_raw_tx_batch`. Constructor config, httpClient capability and tx argument shape that TransactionClient holds and calls in its nonce and submit bodies. Split member `safe-cex-venue-lighter/src/transaction_client.rs::TransactionClientConfig`. Constructor config, httpClient capability and tx argument shape that TransactionClient holds and calls in its nonce and submit bodies. Split member `safe-cex-venue-lighter/src/transaction_client.rs::TransactionRef`. Constructor config, httpClient capability and tx argument shape that TransactionClient holds and calls in its nonce and submit bodies. Split member `safe-cex-venue-lighter/src/transaction_promise.rs::NativePromise`. Eager native promise type held in the TransactionClient nonce_lock field and returned by its async getNextNonce, get*Transaction, getAuthToken and submit bodies. Split member `safe-cex-venue-lighter/src/transaction_promise.rs::NativePromise::pending`. Creates the pending promise and resolver pair the TransactionClient async bodies return and later settle. Split member `safe-cex-venue-lighter/src/transaction_promise.rs::NativePromise::settled`. Creates an already-settled promise, used by TransactionClient.constructor to seed nonce_lock and by its async bodies for immediate results. Split member `safe-cex-venue-lighter/src/transaction_promise.rs::NativePromise::subscribe`. Registers a microtask observer so TransactionClient async bodies chain on nonce_lock and on awaited API results. Split member `safe-cex-venue-lighter/src/transaction_promise.rs::ObjectPromise`. Alias for a promise over a RefCell object, the shape of the TransactionClient async builder results. Split member `safe-cex-venue-lighter/src/transaction_promise.rs::ObjectResolver`. Alias for the resolver side of an ObjectPromise settled by the TransactionClient async builder bodies. Split member `safe-cex-venue-lighter/src/transaction_promise.rs::PromiseResolver`. Resolver half of a pending NativePromise that the TransactionClient async bodies settle with their result or rejection. Split member `safe-cex-venue-lighter/src/transaction_promise.rs::PromiseResolver::settle`. Settles a TransactionClient async body promise with an owned result or rejection. Split member `safe-cex-venue-lighter/src/transaction_promise.rs::PromiseResolver::settle_shared`. Settles a TransactionClient async body promise with an already shared Rc result. Split member `safe-cex-venue-lighter/src/transaction_promise.rs::PromiseResult`. Alias for the shared result delivered to observers of a TransactionClient async body promise. Split member `safe-cex-venue-lighter/src/transaction_promise.rs::Shared`. Alias for the Rc RefCell cell the TransactionClient async bodies use to share mutable state across promise callbacks. Split member `safe-cex-venue-lighter/src/transaction_promise.rs::TransactionRuntime`. Host runtime trait held in TransactionClientConfig.runtime supplying the microtask queue, Date.now clock and encoder availability for TransactionClient bodies. Split member `safe-cex-venue-lighter/src/transaction_promise.rs::TransactionRuntime::auth_token_encoding`. Reports the ambient UTF-8 encoder availability that Transact