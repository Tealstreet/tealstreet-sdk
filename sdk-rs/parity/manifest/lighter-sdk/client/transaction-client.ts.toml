status = "divergent"
note = "CHOSEN: the native client deliberately owns parameter records and batch vectors, giving callers predictable Rust ownership. TypeScript retains mutable caller aliases across awaits; mutations after invocation (and dynamic batch edits) can change built/sent DTOs there while native inputs are snapshots. This applies transitively to submit wrappers too. Native microtask promises preserve eager lock reservation, FIFO await continuations, detached execution, finally release, opaque host errors, mutable DTO/array fulfillment identity and readonly primitive fulfillment. The live source oracle records the caller-mutation survivor at getCreateOrderTransaction (source price99 versus native2401); no full JavaScript Promise runtime, thenable assimilation, unhandled-rejection reporting, overridden callback-factory throwing, HTTP implementation, WASM lifecycle or cryptographic arithmetic is claimed."

