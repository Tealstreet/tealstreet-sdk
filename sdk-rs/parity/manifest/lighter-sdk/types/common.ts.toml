note = "MIXED: CHOSEN sdk-rs/parity/MANIFEST-SPEC.md#shared-utf8-string-boundary for message/error and retained generic string payloads. Canonical shared whole-entry ingress uses ApiResponse<JsNumberInput>, then data.decode; raw, owned and borrowed lexical -0, overflow and negative underflow witnesses now preserve bits. FINDING: legacy bare-serde Value payloads still lose integer-lexeme -0 on owned/borrowed rebuffer. Registration repairs the supported shared entry API only; this generic Deserialize was not rewritten and no production SDK decode caller is ported yet. Optional nullable payload presence, live generic schema and no-Default payload remain pinned. CHOSEN depth cost: Node and legacy bare owned/borrowed Value decoders accept 140 nested payload arrays; shared raw/owned/borrowed ingress refuses with a recursion-limit error. Maintained boundary witnesses accept payload depths through 126 for ApiResponse and 125 for PaginatedResponse, whose items array consumes another level. Keeping the shared bounded-ingress contract is a representation/policy choice: mirroring unbounded legacy acceptance would remove the common recursion guard and permit unbounded recursive capture work. This cost is independent of both UTF8 and the residual legacy numeric FINDING. Rust can express a higher limit: the 256-bound mutation compiles. Its named failure proves the witness detects an acceptance-policy change, not that deeper acceptance is intrinsically wrong; the retained bound is CHOSEN, never FORCED."

