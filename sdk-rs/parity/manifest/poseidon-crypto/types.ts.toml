status = "divergent"
note = "MIXED: chosen explicit host-owned nonce boundary and corrected reference zero-nonce defect; the private nonzero nonce type forces refusal, and choosing that representation is deliberate. Split Schnorr callback interface into native public-key, explicit-nonce signing and verification functions. Split nonce handling into safe-cex-crypto/src/lighter.rs::SchnorrNonce, holding private canonical nonzero nonce bytes, and safe-cex-crypto/src/lighter.rs::SchnorrNonce::from_bytes, the fallible constructor. Signing consumes this non-Clone/non-Copy nonce; host CSPRNG generation and freshness remain caller responsibilities. The constructor refuses zero, order and over-order inputs; verification refuses a neutral nonce commitment as Go does. ref-bug: Go signs with an all-zero CSPRNG nonce, exposing the full private scalar through s = -e*x; Rust deliberately refuses that signing input while verification matches Go by rejecting the neutral commitment. The zero-nonce fixture demonstrates complete public-signature key recovery. Uniform 40-byte host candidates reject approximately 50%; hosts must resample fresh candidates, stop on actual entropy failure and scrub buffers on every outcome. Random key generation and Go random-nonce generation remain unported. Renamed targets: safe-cex-crypto/src/lighter.rs::SchnorrNonce and safe-cex-crypto/src/lighter.rs::SchnorrNonce::from_bytes. The poseidon-crypto TS surface is loaders (browser-loader, node-loader, loader, stub) wrapping a Go WASM blob in src/wasm. Rows over those cover LOADING, not cryptography. Go has no manifest representation; its only parity evidence is the committed Go-WASM vector harness. Renamed targets: `safe-cex-crypto/src/lighter.rs::public_key` `safe-cex-crypto/src/lighter.rs::schnorr_sign` `safe-cex-crypto/src/lighter.rs::schnorr_verify`."

