note = "CHOSEN: Split hasher callback interface into native byte-based primitive functions; hex decoding and WasmError wrapping remain caller responsibilities. Hash and Fp5 raw words mirror Go noncanonical reduction; two-to-one deliberately refuses noncanonical limbs even though Go hashes them, pinned by a separate Go-first corpus with left/right/both coverage. The poseidon-crypto TS surface is loaders (browser-loader, node-loader, loader, stub) wrapping a Go WASM blob in src/wasm. Rows over those cover LOADING, not cryptography. Go has no manifest representation; its only parity evidence is the committed Go-WASM vector harness. Renamed targets: `safe-cex-crypto/src/lighter.rs::poseidon2_hash` `safe-cex-crypto/src/lighter.rs::poseidon2_hash_fp5` `safe-cex-crypto/src/lighter.rs::poseidon2_two_to_one`. The canonical-only compression bound is chosen to catch misuse of digest inputs; modulo reduction could mirror Go and is not forbidden by Rust."

