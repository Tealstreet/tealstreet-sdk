status = "divergent"
note = "MIXED: legacy Value API preserves source adapter behavior. CHOSEN opt-in native QueryValue protocol uses separate retained-token DTOs and a host sign_query capability; unsupported hosts refuse rather than project native params through Value. Server Axios transformation precedes the remote adapter; source tryParseJson restores only objects/arrays, retaining transformed primitive strings for browser signing. Whole-source remote-stage oracle covers 54 browser-client and echo-signer cases, capturing the server envelope, browser interceptor input and exact inner-adapter data type. Returned objects, strings, explicit null and omission are forwarded without another Axios transform; physical network adapters own final byte projection. HTTP remote-signing adapter with explicit host signer, unique-id callback, and lazily replaceable inner adapter. HTTP wire config types decompose the factory closure; shared request/response unions are owned by the types.ts rows. Signed data/params omissions are authoritative and usable host bearer auth is retained. Adapted targets: `safe-cex-transport/src/signing.rs::SigningConfig`, `safe-cex-transport/src/signing.rs::SignedConfig`, `safe-cex-transport/src/signing.rs::RemoteSigner`, `safe-cex-transport/src/signing.rs::RemoteSigner::sign`, `safe-cex-transport/src/signing.rs::RemoteSigningAdapter`, `safe-cex-transport/src/signing.rs::RemoteSigningAdapter::execute_signed`. Native/legacy decomposition targets: `safe-cex-transport/src/signing.rs::create_remote_signing_adapter`, `safe-cex-transport/src/query_signing.rs::SigningConfig`, `safe-cex-transport/src/query_signing.rs::SignedConfig`, `safe-cex-transport/src/signing.rs::RemoteSigner::sign_query`, `safe-cex-transport/src/signing.rs::RemoteSigningAdapter::execute_query`."
