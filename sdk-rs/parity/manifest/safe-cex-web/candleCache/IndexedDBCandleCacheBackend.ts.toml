note = "MIXED: CHOSEN: Adapted target clear delegates to private records with readwrite cursor deletion and prefix filtering. Preserves marked TS abort-only pending completion; records deliberately installs no abort watch for clear. Cancellation detaches cursor and transaction handlers. Adapted target: safe-cex-candle-cache/src/indexed_db.rs::IndexedDBCandleCacheBackend::clear. A non-cancellable browser Promise could mirror source lifetime, but scoped handler ownership was selected so dropping native/wasm futures releases callback resources. Private records now explicitly aborts the active write transaction on cursor request/callback failure before returning a recovered error, preventing partial deletes; readonly failures still retain their prefix. FINDING: cursor_rollback_probe is compiled/linted but has never executed because browsers are environmentally blocked, so rollback execution coverage remains open."

