rs = [ "safe-cex-exchange/src/http.rs::safe_cex_axios_create", "safe-cex-exchange/src/http.rs::HttpClient", "safe-cex-exchange/src/http.rs::HttpClientOptions", "safe-cex-exchange/src/http.rs::HttpFailure", "safe-cex-exchange/src/http.rs::HttpLogState", "safe-cex-exchange/src/http.rs::HTTP_LOGS", "safe-cex-exchange/src/http.rs::HttpFuture", "safe-cex-exchange/src/http.rs::HttpClient::execute", "safe-cex-exchange/src/http.rs::HttpClient::execute_with_interceptor", "safe-cex-exchange/src/http.rs::ParamsSerializer", "safe-cex-exchange/src/http.rs::HttpClient::refuse_before_transmit", "safe-cex-transport/src/provider.rs::RestFailure::pre_transmit", "safe-cex-exchange/src/http.rs::HttpClient::execute_with_receipt", "safe-cex-exchange/src/http.rs::HttpClient::execute_with_interceptor_receipt", "safe-cex-exchange/src/js_runtime/client/factory.rs::create", "safe-cex-transport/src/query.rs::axios_default_query" ]
status = "ported"
note = "Split member `safe-cex-exchange/src/js_runtime/client/factory.rs::create` applies provider REST routing, the fixed 20s timeout and proxy authorization to the JS client before terminal hosted signing. It shares TransportProvider policy with typed clients; no venue-specific proxy rules are copied. JS telemetry remains owned by existing source bindings. The remote inner-adapter wrapper serializes query params without re-transforming remote returned data or regenerating deleted headers; local requests retain the post-signing transform. safe-cex-exchange/src/http.rs::HttpClient::execute_with_interceptor applies factory defaults before the venue callback, retains its header deletions without a second merge, and continues through shared stats/error handling. Split implementation into source behavior, runtime state, and typed payload components: safe-cex-exchange/src/http.rs::safe_cex_axios_create safe-cex-exchange/src/http.rs::HttpClient safe-cex-exchange/src/http.rs::HttpClientOptions safe-cex-exchange/src/http.rs::HttpFailure safe-cex-exchange/src/http.rs::HttpLogState safe-cex-exchange/src/http.rs::HTTP_LOGS safe-cex-exchange/src/http.rs::HttpFuture safe-cex-exchange/src/http.rs::HttpClient::execute safe-cex-exchange/src/http.rs::ParamsSerializer represents the Axios factory config callback: sign then serialize then transmit, retained across transport replacement. Inherited Axios precondition: params-only signer responses assert factory-codec agreement; exact signed encoding requires URL with params absent. Serializer errors refuse before send. safe-cex-exchange/src/http.rs::HttpClient::refuse_before_transmit and safe-cex-transport/src/provider.rs::RestFailure::pre_transmit share enhancement and non-network refusal construction with serializers; signer preflight counts zero requests while adapter serialization counts one, matching measured Axios ordering. HttpFailure is a transitional alias of transport RestFailure, not a second model. Receipt split targets: `safe-cex-exchange/src/http.rs::HttpClient::execute_with_receipt`, `safe-cex-exchange/src/http.rs::HttpClient::execute_with_interceptor_receipt`. Both public response-only entrypoints delegate to the same receipt path; the receipt retains effective adapter config for existing response hooks and venue response-interceptor reentry. This is config provenance, not a second transport or an added source factory. Split member `safe-cex-transport/src/query.rs::axios_default_query` renders installed Axios default bracket traversal and encodeURIComponent-derived query encoding. The shared JS host renders native scalar numbers before JSON projection on URL-consuming terminals; custom serializers retain ownership, and HOW keeps frame params. Source getUri and actual HTTP byte witnesses cover nested keys, metadata JSON and NaN/infinities. Residual physical apostrophe normalization is recorded in safe-cex-transport/QUERY_PARITY_EVIDENCE.md; renderer output itself preserves the source apostrophe."
