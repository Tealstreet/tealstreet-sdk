status = "divergent"
note = "CHOSEN: safe-cex-transport/src/direct.rs::DIRECT_TRANSPORT safe-cex-transport/src/direct.rs::DirectTransport ; Actual executable immutable DirectTransport constant exposes all nine provider trait methods. It replaces the mutable module singleton; JS provider-object identity/method replacement is not modeled, and owned options differ from source requireProxy identity. Actual-source name and native REST URL/proxied/authorizer absence are asserted; existing methods are not newly reclassified. Rationale: Retain the shared TransportProvider capability interface so provider replacement uses the transport registry or per-instance provider; adding a mutable JS-style method/property table would create a second dispatch/configuration mechanism. require_proxy moves the owned ExchangeOptions used by native clients; it preserves their values but exposes no JS object-identity surface. See sdk-rs/parity/MANIFEST-SPEC.md#divergence-taxonomy."

