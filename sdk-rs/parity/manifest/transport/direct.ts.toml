[[symbol]]
ts = "directTransport"
kind = "const"
layer = "adapted"
rs = [ "safe-cex-transport/src/direct.rs::DIRECT_TRANSPORT", "safe-cex-transport/src/direct.rs::DirectTransport", "safe-cex-transport/src/native.rs::ReqwestAdapter", "safe-cex-transport/src/native.rs::reqwest_adapter", "safe-cex-transport/src/native.rs::NativeTunnelHost", "safe-cex-transport/src/native.rs::spawn_local_task", "safe-cex-transport/src/native.rs::wall_clock_ms" ]
status = "divergent"
note = "CHOSEN: safe-cex-transport/src/direct.rs::DIRECT_TRANSPORT safe-cex-transport/src/direct.rs::DirectTransport ; Actual executable immutable DirectTransport constant exposes all nine provider trait methods. It replaces the mutable module singleton; JS provider-object identity/method replacement is not modeled, and owned options differ from source requireProxy identity. Actual-source name and native REST URL/proxied/authorizer absence are asserted; existing methods are not newly reclassified. Rationale: Retain the shared TransportProvider capability interface so provider replacement uses the transport registry or per-instance provider; adding a mutable JS-style method/property table would create a second dispatch/configuration mechanism. require_proxy moves the owned ExchangeOptions used by native clients; it preserves their values but exposes no JS object-identity surface. See sdk-rs/parity/MANIFEST-SPEC.md#divergence-taxonomy. Split member `safe-cex-transport/src/native.rs::ReqwestAdapter`. CHOSEN native host capability (sdk-rs/parity/MANIFEST-SPEC.md#exchange-runtime-callback-choice): terminal HTTP adapter under the direct transport; sends the codec output over reqwest/rustls and settles non-2xx statuses as response-bearing failures, as axios settle() does. Split member `safe-cex-transport/src/native.rs::reqwest_adapter`. CHOSEN native host capability (sdk-rs/parity/MANIFEST-SPEC.md#exchange-runtime-callback-choice): constructs that adapter on the shared ring-provider TLS configuration with native roots. Split member `safe-cex-transport/src/native.rs::NativeTunnelHost`. CHOSEN native host capability (sdk-rs/parity/MANIFEST-SPEC.md#exchange-runtime-callback-choice): socket host for the direct transport: plain tungstenite dials; tunnel and relay token requests fail visibly instead of going direct. Split member `safe-cex-transport/src/native.rs::spawn_local_task`. CHOSEN native host capability (sdk-rs/parity/MANIFEST-SPEC.md#exchange-runtime-callback-choice): local task spawn on the tokio LocalSet shared by the native runtime and tunnel host. Split member `safe-cex-transport/src/native.rs::wall_clock_ms`. CHOSEN native host capability (sdk-rs/parity/MANIFEST-SPEC.md#exchange-runtime-callback-choice): Date.now() milliseconds for native hosts."

