note = "CHOSEN: safe-cex-transport/src/routing_generated.rs::ROUTES safe-cex-transport/src/routing_generated.rs::row safe-cex-transport/src/routing.rs::StaticRoute safe-cex-transport/src/routing.rs::StaticWs ; Executable compiled StaticRoute data plus exhaustive ExchangeName/option row selection replaces the mutable declarative routingTable object. Source strategies and regionConditional are compiled to option-indexed native outcomes; declarative object mutation/shape is not exposed. Native REST/HOW/public/private/business fields are asserted before serialization for the independently expected 47*24=1128 source cases; the source generation freshness check is separate. Rationale: Compile the maintained declarative source into the one exhaustive native selector used by REST and websocket routing, retaining source-generation freshness as the change mechanism. A second independently mutable runtime table would allow route policy to drift from the generated audited outcomes. Price lack of runtime object/strategy mutation and declarative shape inspection; generated case coverage is evidence, not the rationale itself. See sdk-rs/parity/MANIFEST-SPEC.md#divergence-taxonomy."
