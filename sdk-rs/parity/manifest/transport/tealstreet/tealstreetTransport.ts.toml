status = "divergent"
note = "CHOSEN: safe-cex-transport/src/tealstreet.rs::TealstreetTransport::rest safe-cex-transport/src/tealstreet.rs::TealstreetAuthorizer safe-cex-transport/src/tealstreet.rs::TealstreetAuthorizer::authorize ; Implements GRVT/Blofin tunnel-to-proxy exception, generic tunnel suppression, override URL interpolation without changing proxied, eager canonical token lookup, empty credential preservation, GRVT/MEXC auth-header split and Node/Bun headers. Native authorizer mutates the request without converting its retained query tokens. Typed host/Result failures and flat string headers replace Axios/global objects and arbitrary throws; diagnostic state is delegated, adapter/facade integration is not claimed. Rationale: Use the exclusive mutable RestRequest/Result authorizer contract already consumed by native signing, retry and transport; a second dynamic Axios object/error heap would split request/header semantics across these consumers. Token policy remains canonical and lookup starts eagerly. The borrowed future owns subsequent mutation, so Promise identity, arbitrary throws and post-drop detached mutation remain priced CHOSEN omissions. See sdk-rs/parity/MANIFEST-SPEC.md#divergence-taxonomy."

