note = "CHOSEN: safe-cex-transport/src/tealstreet.rs::TealstreetTransport::ws_connection ; Checks is_relay_url before generic tealstreet.io host matching and returns relay/headers discriminants plus exact Origin and User-Agent values. Native outputs own header copies, while source calls share mutable TEALSTREET_WS_HEADERS identity; unsupported/invalid URLs return None, and no concrete socket creation is supplied. Rationale: Give each native dial its own WAF header map, matching the owned WebSocketConnectionOptions merge path; a shared mutable template would let one connection change the Origin/User-Agent used by unrelated later connections. This is the priced owned-snapshot choice (sdk-rs/parity/MANIFEST-SPEC.md#owned-snapshot-vs-live-alias): source alias mutations propagate between returned header views, while native copies remain independent. See sdk-rs/parity/MANIFEST-SPEC.md#divergence-taxonomy."
