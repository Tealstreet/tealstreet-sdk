ts = "RemoteSignerRequest"
kind = "type"
layer = "adapted"
rs = [ "safe-cex-types/src/ws_auth.rs::WsAuthRequest", "safe-cex-types/src/ws_auth.rs::WsAuth", "safe-cex-transport/src/signing.rs::RemoteSignerRequest", "safe-cex-transport/src/signing.rs::HttpSigningRequest", "safe-cex-transport/src/signing.rs::RemoteSignerRequest::decode_response", "safe-cex-transport/src/query_signing.rs::HttpSigningRequest" ]
status = "divergent"
note = "MIXED: chosen WS projection and corrected caller-hang behavior. ts-bug: BaseExchange.signWsAuth and KrakenExchange.signWsAuth reject their async promise on truthy non-string toSign (ERR_INVALID_ARG_TYPE), leaving pending WS auth unsettled; Rust keeps its pre-existing correlated error to avoid a hanging caller. FINDING: the live-source TypeScript rejection oracle is still pending; raw Rust tests alone do not discharge that reference claim. Split WS envelope from raw payload for correlated errors; renamed projections `safe-cex-types/src/ws_auth.rs::WsAuthRequest` and `safe-cex-types/src/ws_auth.rs::WsAuth`. WsAuthRequest independently retains raw JSON id (including missing versus null) and optional wsAuth; WsAuth holds optional string toSign and raw JSON outputFormat before fallible string-only enum conversion. Canonical WS payloads remain shared with crypto; safe-cex-transport/src/signing.rs::RemoteSignerRequest adds the exhaustive HTTP/WS union and exchangeName/accountName, with safe-cex-transport/src/signing.rs::HttpSigningRequest carrying HTTP config. safe-cex-transport/src/signing.rs::RemoteSignerRequest::decode_response selects the untagged response from the originating operation, including error-only replies. The union arm owns the serialized type; wsAuth.extraData remains raw JSON. The old crypto projection discarded extraData, a defect for remote-signer consumers; the canonical move closes that omission. RawValue retains unknown metadata without eager numeric conversion or introducing metadata depth refusal; Field-wise parsing lexically skips ignored metadata, including out-of-range numbers and deep nesting; raw format JSON preserves id-bearing errors only after successful parsing, and Kraken ignores its type after parsing. Workspace arbitrary_precision closes numeric parser refusal: overflow formats yield correlated Infinity/-Infinity errors and Kraken signs; numeric toSign or scalar wsAuth yields correlated missing-payload errors. Overflow ids are preserved as raw JSON numbers and otherwise-signable requests sign, while TS JSON.stringify serializes Infinity ids as null (remaining wire divergence). Excessive nesting in retained id/toSign/outputFormat, non-object root envelopes and invalid JSON still fail parsing: NO RESPONSE IS PRODUCED, including for Kraken. Deep non-object wsAuth arrays are drained and return correlated missing-payload errors. Invalid toSign or non-object wsAuth returns a correlated missing-payload error rather than propagating TS digest type errors. The shared transport union closes the omitted-HTTP staging limitation; the canonical WS malformed-input and id projection differences above remain. Native/legacy decomposition targets: `safe-cex-transport/src/query_signing.rs::HttpSigningRequest`."

