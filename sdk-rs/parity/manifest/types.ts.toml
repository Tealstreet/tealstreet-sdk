note = "One local native Future-returning provider accepts the full HMAC/Stark request union. The production HTTP host supplies that executable capability outside serialized account options; BaseExchange retains the same provider and exposes its callback as a canonical runtime-owned Promise. Signature/optional headers and provider errors propagate. The actual Paradex constructed-host witness compares order/amendment/JWT hashes and signatures plus real HTTP authentication headers with Node Starknet, and checks both HMAC encodings through the same callback. Native String result/error values retain the declared host API domain; this is not arbitrary JS callback object identity. Split members `safe-cex-crypto/src/lib.rs::PayloadSigner::sign`, `safe-cex-exchange/src/js_runtime/client.rs::JsHttpHost::payload_signer`, `safe-cex-exchange/src/js_runtime/client.rs::rest_http_host_with_signers` and `safe-cex-exchange/src/js_runtime/base_exchange.rs::js_payload_signer` implement the native capability and its production JS assembly."

