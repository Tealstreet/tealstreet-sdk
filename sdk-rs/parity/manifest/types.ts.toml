status = "divergent"
note = "CHOSEN: Renamed projection `safe-cex-types/src/ws_auth.rs::WsAuthResponse` is the WS-only raw optional JSON id/signature/error projection (missing id is omitted, explicit null is preserved); skip_serializing_if preserves absent-key {id,error} versus {id,wsAuthSignature} wire behavior. The exhaustive safe-cex-transport/src/signing.rs::RemoteSignerResponse now wraps this exact canonical payload or safe-cex-transport/src/signing.rs::HttpSigningResponse, retaining HTTP config without duplicate WS shapes. Error-only response decoding uses the originating request rather than guessing a kind. Canonical response decoding is map-only; positional arrays from serde derive are refused to match the TS record shape. CHOSEN: the HTTP arm retains its existing required string id and optional-config projection, while the WS arm preserves the canonical optional raw id contract; these typed envelopes are not arbitrary JavaScript values. Native/legacy decomposition targets: `safe-cex-transport/src/query_signing.rs::HttpSigningResponse`."

