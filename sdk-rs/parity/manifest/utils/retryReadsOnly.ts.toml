status = "ported"
note = "A policy owns its original read classifier. Retry configs are REVALIDATED against that original classifier; a changed target classified as a write returns the terminal failure with no replay. Failure configs retain signed headers and post-transform JS data. Query params are retained before URL serialization so retries do not append the encoded query a second time. ts-bug: Axios retry data is already transformed, so venue JSON-stringifying signers can sign different text on later attempts while wire bytes stay identical; this is preserved rather than resetting original input. Request-aware custom conditions remain guarded by read classification. Host-timed retry delay is configured on the read policy; omitted delay is zero, while Asterdex can use retryCount * 1000. Execute requires one host clock for elapsed time and sleep. Native remaining timeout is derived from the original request budget minus the whole attempt duration and next delay; signer-inclusive accounting is separately priced by the Bybit createAPI row, rather than claimed equal to Axios interceptor timing; exhaustion preserves the terminal error and sends/sleeps no further. Epoch-zero lastRequestTime retains the source truthy-guard omission. Adapted targets: `safe-cex-transport/src/retry.rs::RetryPolicy`, `safe-cex-transport/src/retry.rs::RetryPolicy::execute`, `safe-cex-transport/src/retry.rs::RetryPolicy::with_delay`. Receipt execution target: `safe-cex-transport/src/retry.rs::RetryPolicy::execute_with_receipt`; the response-only facade discards the receipt after the same retry path."

