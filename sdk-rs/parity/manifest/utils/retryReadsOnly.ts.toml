note = "Split network read policy, its standalone response-absent/code classifier safe-cex-transport/src/retry.rs::is_network_error, and opaque originating error evidence: safe-cex-transport/src/retry.rs::network_error_on_read safe-cex-transport/src/provider.rs::NetworkFailure safe-cex-transport/src/provider.rs::NetworkFailure::from_code safe-cex-transport/src/provider.rs::NetworkFailure::code safe-cex-transport/src/provider.rs::RestFailure::is_retryable_network . Network origin is opaque and code-based, with response absence and the installed axios-retry predicate including all 30 is-retry-allowed denied codes checked live; callers cannot supply retry eligibility. Terminal errors retain the final attempt response/request/context. The concrete OKX imported factory reads native values directly, preserves the source read guard and falsy response test, and performs strict UTF-16 code membership without coercion. ERR_CANCELED/ECONNABORTED and the installed 30-code is-retry-allowed denial set are excluded; repeated code reads preserve source order. The native host helpers split factory and denial membership; existing transport code supplies the separate typed policy. Real constructed HTTP regression compares36 GET profiles and one POST guard with the maintained wrapper and installed dependencies;31 denied codes compile-fail on master and pass after repair while allowed socket retries remain. Renamed Rust targets: safe-cex-venue-okx/src/binding/globals.rs::network_error_on_read ; safe-cex-venue-okx/src/binding/globals.rs::network_code_denied."

