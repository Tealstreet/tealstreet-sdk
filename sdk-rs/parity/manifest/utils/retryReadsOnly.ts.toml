note = "Read classification issues immutable owning read/write tokens; write execution cannot accept a network retry policy, as explicitly requested for P2c. Adapted targets: `safe-cex-transport/src/retry.rs::ReadClassification`, `safe-cex-transport/src/retry.rs::ReadClassification::classify`, `safe-cex-transport/src/retry.rs::ReadRequest`, `safe-cex-transport/src/retry.rs::WriteRequest`, `safe-cex-transport/src/retry.rs::WriteRequest::execute`, `safe-cex-transport/src/retry.rs::ClassifiedRequest`. Receipt execution target: `safe-cex-transport/src/retry.rs::WriteRequest::execute_with_receipt` returns the terminal adapter receipt without introducing a write-network policy. Split member `safe-cex-transport/src/retry.rs::WriteRequest::request`. Read-only access to the classified write configuration lets the signature-rejection composition retain its original timeout budget; it does not reclassify a write as a network read."

