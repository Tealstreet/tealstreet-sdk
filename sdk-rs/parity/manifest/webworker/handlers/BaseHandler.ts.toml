note = "Renamed to safe-cex-webworker/src/handler.rs::BaseHandler. Market-timeout reports create a host-native Error at the report point and retain its opaque identity through the required post capability. tests/handlers.rs covers real inherited timeout dispatch, bounded telemetry, cooldown and visible host failures. tests/markets-error-clone-source.cjs executes the maintained source; examples/worker_error_host.rs and tests/worker-error-host.cjs execute the actual Wasm host adapter and structuredClone, retaining Error identity and the original stack while the clone resets its custom name. This bounded proof does not claim complete browser-worker startup composition."

