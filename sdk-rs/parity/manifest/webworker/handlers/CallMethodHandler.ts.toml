note = "FINDING owner: shared-core annotation audit. Remaining typed dispatch costs still require their own supported rationale. Continuation timing is repaired with the canonical eager driver and source await checkpoints; tests/handlers.rs compares twelve maintained-source/native profiles across direct and outer dispatch, ready/failed/held results and caller abandonment. Repair: recoverAfterOffline now reaches the object-safe Exchange hook, returning its boolean or reporting its error through the existing reply catch. Socket protocols supply their individual recovery policy; every socket is visited before boolean reduction. Existing adaptation: Renamed to safe-cex-webworker/src/call_method.rs::CallMethodHandler::handle_call_method. the typed Exchange trait requires arguments to deserialize to its typed parameters and rejection is ExchangeError, so arbitrary JS arguments and primitive throws are not representable. Caller waiter abandonment now leaves the runtime-owned operation running to its real reply. Runtime teardown retains the guarded cancellation reply. Assigned void results now retain an own undefined result at the native DATA boundary; unassigned operations retain null and unknown methods omit result. Error name/message, own stack and present code are retained in runtime Js. Typed results use existing retained numeric capture, preserving nonfinite values and own ModelField Undefined before the host structured clone. The DATA sink is fallible; source and native tests cover success-post and unknown-post rejection reaching the existing error reply catch. Core override hooks now carry fetchAndSetOrders and fetchAndSetPrivateSnapshot to the venue implementation; source-driven override sentinels pin dispatch targets and arguments. The former removeOrders notification finding is closed: tests/store_notification asserts the committed removal, skipped later subscriber and failure reply retaining the original error name/code. The typed dispatch rationale remains an independent FINDING; that conclusion is not discharged by the notification witness. Evidence: sdk-rs/parity/SHARED_CORE_BEHAVIOR_REPAIRS.md and SHARED_CORE_BEHAVIOR_GATE_EXITS.md."

