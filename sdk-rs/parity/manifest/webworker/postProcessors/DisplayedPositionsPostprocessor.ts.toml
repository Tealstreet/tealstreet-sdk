note = "MIXED: Renamed to safe-cex-webworker/src/displayed_positions.rs::DisplayedPositionsPostprocessor::process. CHOSEN owned StoreData snapshots rebuild borrowed symbol maps each pass instead of retaining JavaScript array identities; in-place symbol renames therefore refresh lookups, unlike the source cache. Retaining parallel identity caches would duplicate the shared snapshot model. CHOSEN sdk-rs/parity/MANIFEST-SPEC.md#closed-typed-output-boundary: ts-bug: all eleven Object.prototype callable names pass the source fake-position ticker-and-market guard. Shared TableHit preserves that guard; typed output refuses the inherited values and omits the whole fake row, while TypeScript retains the row with truthy function fields in memory and omits only those fields in JSON. Eleven pre-serialization typeof witnesses pin this difference. FINDING: absent __proto__ yields source empty ticker/market objects that survive JSON, while Rust omits the row. Prototype writes are separate: assigning a ticker to __proto__ makes a missing last symbol resolve to a scalar ticker and NaN UPnL; Rust retains UPnL. Shared read support does not implement those writes. Live witnesses preserve both findings; explicitly supplied prototype-named symbols retain ordinary parity."

