[package]
name = "safe-cex-exchange"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
health = ["dep:regex"]
# Production native host (tokio LocalSet, reqwest, tungstenite); never on wasm32.
native = ["safe-cex-transport/native", "dep:tokio", "dep:getrandom"]

[dependencies]
safe-cex-types.workspace = true
safe-cex-num.workspace = true
safe-cex-store.workspace = true
safe-cex-transport.workspace = true
safe-cex-crypto.workspace = true
safe-cex-candle-cache = { path = "../safe-cex-candle-cache" }
serde.workspace = true
indexmap = { version = "=2.14.2", features = ["serde"] }
serde_json.workspace = true
num-bigint = "=0.4.6"
base64.workspace = true
regex = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, optional = true, features = ["rt", "time"] }
getrandom = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
syn.workspace = true
quote = "=1.0.47"
trybuild = "=1.0.116"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio-tungstenite.workspace = true
