[package]
name = "safe-cex-ffi"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
node = ["dep:napi", "dep:napi-derive", "dep:napi-build", "dep:tokio", "dep:serde_json", "dep:safe-cex-webworker"]
wasm = ["dep:wasm-bindgen"]

[dependencies]
safe-cex-registry.workspace = true
safe-cex.workspace = true
safe-cex-webworker = { path = "../safe-cex-webworker", optional = true }
napi = { workspace = true, optional = true, default-features = false, features = ["napi6", "async", "serde-json"] }
napi-derive = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "sync", "time"] }
serde_json = { workspace = true, optional = true }

[build-dependencies]
napi-build = { workspace = true, optional = true }

[lints]
workspace = true
