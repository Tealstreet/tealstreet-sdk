[package]
name = "safe-cex-parity"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
syn.workspace = true
proc-macro2 = { version = "1", features = ["span-locations"] }
toml.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
safe-cex-webworker = { path = "../safe-cex-webworker" }
safe-cex-venue-asterdex.workspace = true
safe-cex-exchange = { workspace = true, features = ["native"] }
safe-cex-store.workspace = true
safe-cex-types.workspace = true
safe-cex-transport = { workspace = true, features = ["native"] }
tokio = { workspace = true, features = ["rt", "time"] }

# Cross-layer browser witnesses belong to tooling, never in a venue dependency.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
safe-cex-webworker = { path = "../safe-cex-webworker" }
safe-cex-venue-mexc.workspace = true
safe-cex-exchange.workspace = true
safe-cex-store.workspace = true
safe-cex-types.workspace = true
safe-cex-transport.workspace = true
wasm-bindgen.workspace = true
js-sys = "0.3.106"

[[example]]
name = "mexc_reporting_worker_host"
crate-type = ["cdylib"]
