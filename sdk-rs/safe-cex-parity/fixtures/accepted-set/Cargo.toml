[workspace]
members = [".", "reexport", "vendor-serde-json", "macro-consumer"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "=1.0.152", features = ["preserve_order", "arbitrary_precision"] }

[package]
name = "accepted-set-control"
version = "0.1.0"
edition = "2024"

[features]
permissive = []
native = []

[dependencies]
serde.workspace = true
serde_json.workspace = true

[lints.rust]
warnings = "deny"
