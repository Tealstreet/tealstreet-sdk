safe-cex-venue-binance.workspace = true
safe-cex-venue-bingx.workspace = true
safe-cex-venue-bitget.workspace = true
safe-cex-venue-bitrue.workspace = true
safe-cex-venue-bitunix.workspace = true
safe-cex-venue-blofin.workspace = true
safe-cex-venue-breakoutprop.workspace = true
safe-cex-venue-bybit.workspace = true
safe-cex-venue-coinbase.workspace = true
safe-cex-venue-okx.workspace = true
safe-cex-venue-kraken.workspace = true
