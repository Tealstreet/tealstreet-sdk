[package]
name = "safe-cex-transport"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
safe-cex-types.workspace = true
serde.workspace = true
# Signed JSON uses the shared workspace ordering contract.
serde_json.workspace = true
url = "2.5.8"
indexmap = { version = "2.14.2", features = ["serde"] }
safe-cex-num.workspace = true
base64 = "0.23.0"
flate2 = { version = "1.1.5", default-features = false, features = ["rust_backend"] }

[features]
# Native terminal HTTP/WebSocket I/O; inert on wasm32, where the browser supplies I/O.
native = ["dep:reqwest", "dep:tokio", "dep:tokio-tungstenite", "dep:rustls", "dep:rustls-native-certs", "dep:futures-util"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "time", "sync", "net"] }
tokio-tungstenite = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
toml.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true

[[example]]
name = "warning_wasm"
crate-type = ["cdylib"]
