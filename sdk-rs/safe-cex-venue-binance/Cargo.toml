[package]
name = "safe-cex-venue-binance"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Production native host: real HTTP/WS via safe-cex-exchange's native runtime.
native = ["safe-cex-exchange/native", "safe-cex-transport/native", "dep:tokio"]

[lints]
workspace = true

[dependencies]
safe-cex-exchange.workspace = true
safe-cex-transport.workspace = true

safe-cex-types.workspace = true
safe-cex-num.workspace = true
safe-cex-store.workspace = true
safe-cex-crypto.workspace = true
safe-cex-candle-cache.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["unbounded_depth"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, optional = true, features = ["rt", "net", "time"] }
