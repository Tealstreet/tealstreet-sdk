[package]
name = "safe-cex-venue-hyperliquid"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64.workspace = true
flate2 = { version = "1.1.5", default-features = false, features = ["rust_backend"] }
getrandom.workspace = true
regex.workspace = true
safe-cex-exchange.workspace = true
safe-cex-store.workspace = true
safe-cex-types.workspace = true
safe-cex-num.workspace = true
safe-cex-transport.workspace = true
safe-cex-crypto.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
alloy-dyn-abi.workspace = true

[dev-dependencies]
indexmap = "=2.14.2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
safe-cex-exchange = { workspace = true, features = ["native"] }
tokio = { workspace = true, features = ["rt", "time"] }
