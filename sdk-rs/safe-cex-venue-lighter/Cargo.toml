[package]
name = "safe-cex-venue-lighter"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
safe-cex-types.workspace = true
safe-cex-num.workspace = true
safe-cex-store.workspace = true
safe-cex-transport.workspace = true
safe-cex-crypto.workspace = true
# Host CSPRNG for Schnorr nonces (crypto.getRandomValues on wasm32).
getrandom.workspace = true
safe-cex-candle-cache.workspace = true
safe-cex-exchange.workspace = true
safe-cex-lighter-sdk = { path = "../safe-cex-lighter-sdk" }
serde.workspace = true
serde_json.workspace = true
indexmap = { version = "=2.14.2", features = ["serde"] }
num-bigint = "=0.4.6"
form_urlencoded = "=1.2.2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
safe-cex-exchange = { workspace = true, features = ["native"] }
safe-cex-transport = { workspace = true, features = ["native"] }
