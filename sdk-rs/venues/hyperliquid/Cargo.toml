[package]
name = "safe-cex-venue-hyperliquid"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
private-adoption-originals = []

[[test]]
name = "request_context_trading"
required-features = ["private-adoption-originals"]

[dependencies]
safe-cex-engine = { workspace = true, features = ["order-locks", "underlying-tokens", "command-schedule-cancel", "managed-sockets", "address-nonce", "release-domains", "condition-waits"] }
safe-cex-crypto = { workspace = true, features = ["address-nonce"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
base64.workspace = true
miniz_oxide = "0.8"
rmp-serde = "1.3"

[dev-dependencies]
safe-cex-engine = { workspace = true, features = ["test-support"] }
alloy-dyn-abi.workspace = true

[lints]
workspace = true
