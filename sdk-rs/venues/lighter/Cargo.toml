[package]
name = "safe-cex-venue-lighter"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
safe-cex-engine = { workspace = true, features = ["order-locks", "serial-plans", "condition-waits", "managed-sockets"] }
safe-cex-crypto = { workspace = true, features = ["schnorr"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
zeroize.workspace = true

[lints]
workspace = true

[dev-dependencies]
safe-cex-engine = { workspace = true, features = ["test-support"] }
safe-cex-crypto = { workspace = true, features = ["schnorr"] }
